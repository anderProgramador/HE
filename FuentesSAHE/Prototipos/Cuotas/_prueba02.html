<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>T01FUN - prueba</title>
<style>
@charset "utf-8";
/* ============================================================================
   SAHE - Sistema Administrativo de Horas Extra
   Sistema.css  -  pantallas de mantenimiento construidas por Ventana.

   Estas pantallas se cargan DENTRO de #ifrPagina del Escritorio: no llevan
   cabecera ni menú propios, solo el contenido.

   CSS nativo. Compatibilidad Chrome 49: sin CSS Grid, sin gap en flexbox,
   sin clamp(), sin inset, sin :focus-visible, sin :focus-within,
   sin position:sticky. Los anchos de columna van en porcentaje sobre flexbox.

   Paleta (la misma de Escritorio.css)
     Rojo institucional ......... #C8102E
     Rojo oscuro (foco) ......... #7A0E1F
     Rojo al pasar el mouse ..... #A32D2D
     Rojo suave ................. #FCEBEB
     Texto ...................... #221F1F
     Texto secundario ........... #5F5C58
     Texto atenuado ............. #8A8781
     Texto tenue ................ #A9A6A0
     Borde ...................... #EDEAE5
     Borde de control ........... #D5D0C9
     Fondo suave ................ #F7F6F3
     Correcto ................... #1F7A4D
   ========================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
    background: #FFFFFF;
    color: #221F1F;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

.hide { display: none !important; }

/* ================================================================ pantalla */
/* Sin tope de ancho: la pantalla -y con ella la grilla- ocupa todo lo que le
   da el iframe. Un formulario sí se acota más abajo, porque campos de 1600px
   no se leen; una rejilla de 8 columnas, en cambio, agradece cada píxel. */
.pantalla {
    margin: 0;
    padding: 24px 26px 32px;
}

/* Los formularios de la pantalla principal -no los del popup, que tienen su
   propio ancho- se quedan en una medida legible. */
.pantalla__cuerpo > .seccion {
    max-width: 1040px;
}

.pantalla__cabecera {
    padding-bottom: 16px;
    margin-bottom: 22px;
    border-bottom: 2px solid #C8102E;
}
.pantalla__titulo {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.2;
    color: #221F1F;
}
.pantalla__subtitulo {
    margin-top: 4px;
    max-width: 78em;
    font-size: 13.5px;
    color: #5F5C58;
}

/* ================================================================ secciones */
.seccion {
    margin-bottom: 22px;
    padding: 18px 20px 6px;
    border: 1px solid #EDEAE5;
    border-radius: 8px;
    background: #FFFFFF;
}
.seccion__titulo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: #C8102E;
}
.seccion__descripcion {
    margin-top: 3px;
    margin-bottom: 14px;
    max-width: 70em;
    font-size: 13px;
    color: #8A8781;
}

/* Fila de campos. Sin gap: la separación va por padding de cada campo. */
.seccion__campos {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
    margin: 0 -10px;
}

/* ==================================================================== campo */
.campo {
    padding: 0 10px;
    margin-bottom: 16px;
}
/* El ancho lo decide el dato, no la plantilla de la página: un número de dos
   dígitos no necesita el mismo espacio que el nombre de un archivo. */
.campo--corto { width: 25%; }
.campo--medio { width: 33.33%; }
.campo--largo { width: 50%; }
.campo--total { width: 100%; }

.campo__etiqueta {
    display: block;
    margin-bottom: 5px;
    font-size: 12.5px;
    font-weight: 600;
    color: #221F1F;
}
.campo__obligatorio {
    margin-left: 3px;
    color: #C8102E;
    font-weight: 700;
}

.campo__control {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
}

.control {
    width: 100%;
    min-width: 0;
    height: 34px;
    padding: 0 10px;
    border: 1px solid #D5D0C9;
    border-radius: 5px;
    background: #FFFFFF;
    color: #221F1F;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    outline: 0;
    -webkit-transition: border-color .15s ease, box-shadow .15s ease;
    transition: border-color .15s ease, box-shadow .15s ease;
}
/* Chrome 49 no soporta :focus-visible; se usa :focus */
.control:focus {
    border-color: #C8102E;
    -webkit-box-shadow: 0 0 0 3px rgba(200, 16, 46, .13);
    box-shadow: 0 0 0 3px rgba(200, 16, 46, .13);
}
.control[readonly] { background: #F7F6F3; color: #5F5C58; }
.control[disabled] { background: #F1EFEC; color: #A9A6A0; }
/* Un select bloqueado en Chrome 49 se pone gris claro por su cuenta y casi no
   se lee; se le fija el mismo par que a las cajas. */
select.control[disabled] { opacity: 1; -webkit-text-fill-color: #A9A6A0; }
.campo__lupa[disabled] {
    background: #F1EFEC; border-color: #E4E1DC; color: #C3C0BA; cursor: default;
}
.campo__lupa[disabled]:hover { background: #F1EFEC; border-color: #E4E1DC; color: #C3C0BA; }

textarea.control {
    height: auto;
    padding: 8px 10px;
    line-height: 1.5;
    resize: vertical;
}
input[type="number"].control { text-align: right; }
select.control { height: 34px; }
input[type="checkbox"].control {
    width: 16px;
    height: 16px;
    padding: 0;
    -webkit-box-flex: 0;
    -ms-flex: 0 0 auto;
    flex: 0 0 auto;
}

/* La unidad al lado del control: el número deja de estar suelto. */
.campo__unidad {
    -ms-flex-negative: 0;
    flex-shrink: 0;
    margin-left: 8px;
    font-size: 12.5px;
    color: #8A8781;
    white-space: nowrap;
}

.campo__ayuda {
    margin-top: 4px;
    font-size: 11.5px;
    color: #8A8781;
}

.campo__error {
    margin-top: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: #B3261E;
}
.campo--error .control { border-color: #B3261E; }
.campo--error .control:focus {
    -webkit-box-shadow: 0 0 0 3px rgba(179, 38, 30, .12);
    box-shadow: 0 0 0 3px rgba(179, 38, 30, .12);
}

/* ================================================================== archivo */
.campo__archivo {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    width: 100%;
    min-width: 0;
}
.campo__archivo .control { border-radius: 5px 0 0 5px; }
.campo__archivo .boton {
    -ms-flex-negative: 0;
    flex-shrink: 0;
    height: 34px;
    margin-left: -1px;
    border-radius: 0 5px 5px 0;
}
/* El input real se oculta; lo dispara el botón Examinar. */
.campo__archivo-real { display: none; }

/* Una cantidad hh:mm se escribe y se lee centrada: el ':' queda alineado de
   una fila a la otra y las cifras se comparan de un vistazo. Las cantidades
   van a la derecha, como en la grilla, para que las unidades queden una
   debajo de la otra. */
input.control.Centro { text-align: center; }
input.control.Derecha { text-align: right; }

/* Boton declarado dentro de una seccion: se alinea con los controles que
   tiene al lado, no con sus rotulos. */
.campo--boton {
    -webkit-box-flex: 0;
    -ms-flex: none;
    flex: none;
    width: auto;
}
.campo--boton .campo__etiqueta { visibility: hidden; }
.campo--boton .boton { height: 34px; }

/* ============================================================== multicombo */
/* Desplegable de seleccion multiple. Lo arma Sistema.js sobre el <select> que
   dejo la plantilla: el select sigue ahi -oculto- para que el paquete lo llene
   como a cualquier otro, y encima van la caja del resumen y el panel de
   casillas. */
.multi { position: relative; width: 100%; min-width: 0; }
.multi__real { display: none !important; }
.multi__caja {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border: 1px solid #D5D0C9;
    border-radius: 5px;
    background: #FFFFFF;
    font-family: inherit;
    font-size: 13.5px;
    color: #221F1F;
    text-align: left;
    cursor: pointer;
}
.multi.abierto .multi__caja { border-color: #C8102E; }
.multi__texto {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.multi__texto--vacio { color: #A9A6A0; }
/* La flecha se dibuja con un borde girado: un SVG mas que mantener para un
   triangulo de seis pixeles no se justifica. */
.multi__caja:after {
    content: "";
    -webkit-box-flex: 0;
    -ms-flex: none;
    flex: none;
    width: 7px;
    height: 7px;
    margin-left: 8px;
    border-right: 2px solid #78756F;
    border-bottom: 2px solid #78756F;
    -webkit-transform: rotate(45deg) translate(-2px, -2px);
    transform: rotate(45deg) translate(-2px, -2px);
}
.multi__panel {
    display: none;
    position: absolute;
    left: 0;
    top: 36px;
    z-index: 60;
    width: 100%;
    max-height: 260px;
    overflow-y: auto;
    border: 1px solid #D5D0C9;
    border-radius: 6px;
    background: #FFFFFF;
    -webkit-box-shadow: 0 8px 20px rgba(0,0,0,.14);
    box-shadow: 0 8px 20px rgba(0,0,0,.14);
}
.multi.abierto .multi__panel { display: block; }
.multi__opcion {
    display: block;
    padding: 6px 10px;
    font-size: 13px;
    color: #221F1F;
    cursor: pointer;
}
.multi__opcion:hover { background: #FCEBEB; }
.multi__opcion input { margin-right: 7px; vertical-align: middle; }
.multi__opcion--todos {
    font-weight: 700;
    background: #F7F6F3;
    border-bottom: 1px solid #EDEAE5;
}

/* =================================================================== botones */
.boton {
    display: -webkit-inline-box;
    display: -ms-inline-flexbox;
    display: inline-flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    height: 36px;
    padding: 0 18px;
    border: 1px solid #C8102E;
    border-radius: 6px;
    background: #C8102E;
    color: #FFFFFF;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-transition: background-color .15s ease;
    transition: background-color .15s ease;
}
.boton:hover { background: #A32D2D; border-color: #A32D2D; }
.boton:focus { outline: 2px solid #7A0E1F; outline-offset: 2px; }
.boton--secundario {
    background: #FFFFFF;
    color: #5F5C58;
    border-color: #D5D0C9;
}
.boton--secundario:hover {
    background: #F7F6F3;
    color: #C8102E;
    border-color: #D5D0C9;
}

/* ================================================================= acciones */
.pantalla__acciones {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
    padding-top: 16px;
    border-top: 1px solid #EDEAE5;
}
.pantalla__botones {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
}
.pantalla__botones .boton { margin-left: 10px; }
.pantalla__botones .boton:first-child { margin-left: 0; }

.MensajeError {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    min-width: 0;
    margin-right: 16px;
    font-size: 13px;
    font-weight: 600;
    color: #B3261E;
}

.pantalla__cambios {
    display: none;
    font-size: 12px;
    color: #8A8781;
}
.pantalla__cambios.visible { display: inline; }

/* ========================================= ventana de mantenimiento (popup) */
/* La arma Ventana a partir de la línea 'popup' de la plantilla. Mismo velo y
   misma caja que el diálogo de mensajes, para que se vean de la misma familia. */
.velo {
    display: none;
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background: rgba(20, 18, 18, .5); z-index: 1000;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
}
.velo.abierto { display: -webkit-box; display: -ms-flexbox; display: flex; }

.ventana {
    width: 100%; max-width: 640px; max-height: 92%; margin: 0 16px;
    background: #FFFFFF; border-radius: 8px; overflow: auto;
    -webkit-box-shadow: 0 18px 44px rgba(0, 0, 0, .3);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .3);
}
.ventana__barra {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: justify; -ms-flex-pack: justify; justify-content: space-between;
    padding: 12px 18px; background: #C8102E; color: #FFFFFF;
}
.ventana__titulo { font-size: 14.5px; font-weight: 700; }
.ventana__cerrar {
    width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .16); color: #FFFFFF;
    font-size: 17px; line-height: 1; cursor: pointer;
}
.ventana__cerrar:hover { background: rgba(255, 255, 255, .3); }
.ventana__cerrar:focus { outline: 2px solid #FFFFFF; outline-offset: 1px; }

.ventana__cuerpo { padding: 18px 18px 4px; }
.ventana__cuerpo .seccion { margin-bottom: 0; padding: 0; border: 0; }

.ventana__pie {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: end; -ms-flex-pack: end; justify-content: flex-end;
    padding: 14px 18px; border-top: 1px solid #EDEAE5; background: #FBFAF9;
}
.ventana__pie .MensajeError {
    -webkit-box-flex: 1; -ms-flex: 1; flex: 1; margin-right: 12px;
}
.ventana__pie .boton { margin-left: 10px; }

/* ====================================================== pantallas angostas */
@media screen and (max-width: 1024px) {
    .campo--corto { width: 33.33%; }
    .campo--medio { width: 50%; }
    .campo--largo { width: 100%; }
}
@media screen and (max-width: 700px) {
    .pantalla { padding: 18px 16px 26px; }
    .seccion { padding: 16px 14px 4px; }
    .campo--corto, .campo--medio, .campo--largo { width: 100%; }
    .pantalla__acciones {
        -webkit-box-orient: vertical;
        -ms-flex-direction: column;
        flex-direction: column;
        -webkit-box-align: stretch;
        -ms-flex-align: stretch;
        align-items: stretch;
    }
    .MensajeError { margin: 0 0 10px 0; }
    .pantalla__botones .boton {
        -webkit-box-flex: 1;
        -ms-flex: 1;
        flex: 1;
    }
}

/* ======================================================= pantalla cargando */
/* Entre que la ventana queda construida y que llegan sus datos. Se apaga un
   poco y no acepta clics, para que nadie pulse Grabar sobre campos vacíos. */
.pantalla--cargando {
    opacity: .55;
    pointer-events: none;
    cursor: progress;
}

/* ==================================================================== lupa */
/* La caja de texto se estira y la lupa queda pegada a su derecha. */
.campo__control--conLupa .control {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
}
.campo__lupa {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
    -webkit-box-flex: 0; -ms-flex: none; flex: none;
    width: 36px; height: 34px; margin-left: -1px;
    border: 1px solid #D5D0C9; border-left-color: #D5D0C9;
    border-radius: 0 5px 5px 0;
    background: #F7F6F3; color: #5F5C58; cursor: pointer;
    -webkit-transition: background-color .15s ease, color .15s ease;
    transition: background-color .15s ease, color .15s ease;
}
.campo__lupa:hover { background: #C8102E; border-color: #C8102E; color: #FFFFFF; }
.campo__lupa:focus {
    outline: 0; border-color: #C8102E;
    -webkit-box-shadow: 0 0 0 2px rgba(200, 16, 46, .13);
    box-shadow: 0 0 0 2px rgba(200, 16, 46, .13);
}
.campo__lupa svg { width: 16px; height: 16px; }
/* El atributo hidden por sí solo no alcanza: la regla de arriba le da
   display:flex y le gana al display:none que trae el navegador. */
.campo__lupa[hidden] { display: none !important; }

/* ======================================================== ventana de ayuda */
/* La lupa abre esta ventana sobre la de mantenimiento, así que su velo va por
   encima. Chrome 49 no tiene position:sticky ni :focus-within: nada de eso se
   usa aquí. */
#divPantPop .velo { z-index: 1100; }
.ventana--ayuda { max-width: 720px; }
.ventana--ayuda .ventana__cuerpo { padding: 14px 14px 16px; }
.ventana--ayuda .PanelHerramientas { margin-bottom: 8px; }
/* La rejilla de la ayuda no debe empujar la ventana fuera de la pantalla. */
.ventana--ayuda .divGrilla { max-height: 52vh; overflow-y: auto; }

/* ============================================== contador de caracteres */
/* Va debajo del control y encima de la ayuda, alineado a la derecha para que
   no compita con el texto que se está escribiendo. */
.campo__contador {
    margin-top: 3px;
    text-align: right;
    font-size: 12px;
    color: #8A8781;
    -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
}
.campo__contador-usado { font-weight: 700; color: #5F5C58; }
.campo__contador--al-limite { color: #B3261E; }
.campo__contador--al-limite .campo__contador-usado { color: #B3261E; }

/* ============================================ detalle dentro de la ventana */
/* La barra que encabeza la grilla editable del popup. */
.detalle__barra {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    padding-top: 14px; margin-top: 6px; margin-bottom: 10px;
    border-top: 1px solid #EDEAE5;
}
.detalle__titulo { -webkit-box-flex: 1; -ms-flex: 1; flex: 1; font-size: 14.5px; font-weight: 700; }
.detalle__cuenta { font-size: 13px; color: #5F5C58; }
.gDetalle { margin-bottom: 4px; }


/* ==========================================================================
   La tarjeta de resumen de T01FUN: la cuota de la ubicación con la que se
   entró -asignada, repartida y pendiente- en el periodo elegido. La sección
   la declara el txt y la pinta Sistema.js con el segmento que manda el
   paquete. Sin grid ni gap: Chrome 49 no los tiene.
   ========================================================================== */
.resumen {
    display: inline-block; vertical-align: top; width: 380px; max-width: 100%;
    padding: 12px 14px; margin-bottom: 4px;
    border: 1px solid #EDEAE5; border-left: 4px solid #C8102E; border-radius: 8px;
    background: #FFFFFF;
}
.resumen--excedida { border-left-color: #B3261E; background: #FFF7F7; }
/* Un periodo cerrado no se puede repartir: la tarjeta lo dice en gris para
   que no invite a nada. */
.resumen--cerrada { border-left-color: #A9A6A0; background: #F7F6F3; }
.resumen__marca {
    display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 10px;
    background: #EDEAE5; color: #5F5C58;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
}

.resumen__titulo { font-size: 13px; font-weight: 700; line-height: 1.25; color: #221F1F; }
.resumen__periodo { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: #8A8781; }

.resumen__cifras { margin-top: 8px; }
.resumen__dato { display: inline-block; width: 32%; vertical-align: top; }
.resumen__rotulo {
    font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: #8A8781;
}
.resumen__valor {
    font-size: 15px; font-weight: 700; color: #221F1F;
    -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
}
.resumen__valor--verde { color: #1E7A46; }
.resumen__valor--rojo { color: #B3261E; }

.resumen__barra {
    height: 6px; margin-top: 9px; border-radius: 4px; background: #EDEAE5; overflow: hidden;
}
.resumen__lleno { height: 100%; background: #C8102E; }
.resumen__lleno--excedido { background: #B3261E; }

</style>
<style>
@charset "utf-8";
/* ============================================================================
   SAHE - Sistema Administrativo de Horas Extra
   Grilla.css  -  estilos de la rejilla que arma GUI.Grilla (General.js).

   El módulo genera su propio marcado; aquí solo se le da forma. Clases que
   emite y que este archivo atiende:
       divGrilla, cssGridView, FilaCabecera, EnlaceCabecera,
       PanelHerramientas, cssRegistros, contenedor-botones,
       boton-herramienta (+ boton-limpiar, boton-nuevo, boton-excel,
       boton-eliminar-multiple, boton-txt),
       boton-accion (+ boton-editar, boton-eliminar, boton-ver),
       col-marca (columna de selección múltiple),
       col-width-N, col-hidden, Centro, Derecha, Pagina.

   CSS nativo. Compatibilidad Chrome 49: sin Grid, sin gap en flexbox,
   sin :focus-visible, sin position:sticky.

   Paleta: la misma de Sistema.css y Escritorio.css.
   ========================================================================== */

/* ============================================================ herramientas */
.PanelHerramientas {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;

   distingue la acción destructiva de las demás. */
.boton-herramienta {
    display: -webkit-inline-box; display: -ms-inline-flexbox; display: inline-flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;

}

.boton-nuevo:hover { background: #A32D2D; border-color: #A32D2D; color: #FFFFFF; }
.boton-eliminar-multiple:hover,
.boton-eliminarMultiple:hover { background: #FCEBEB; color: #B3261E; border-color: #E7C9C9; }

.grilla--elegible table.cssGridView tbody tr { cursor: pointer; }

<input id="hdfControles" type="hidden" value="# ============================================================================
# T01FUN - Distribución de Cuotas (funcionario)
#
# La otra mitad de T01. Allí la administración le asigna una cuota de horas
# extra a cada gerencia; aquí el funcionario -gerente o subgerente- reparte la
# suya entre las oficinas que dependen de él.
#
# Es una pantalla aparte y no un modo de T01 porque no comparten casi nada:
# otros permisos, otra cuenta que cuadrar y otro paquete -dvpkg_spT01FUN-. El
# controlador arma el nombre del archivo y el del paquete con el mismo texto,
# así que basta con que el menú diga 'T01FUN¦...' para que todo apunte aquí.
#
# ----------------------------------------------------------------------------
# LA CUENTA QUE TIENE QUE CUADRAR
#
#     asignada - repartida = pendiente
#
# Una por ubicación. Un funcionario con dos gerencias a cargo tiene dos
# cuentas independientes: lo que le sobra en una no puede gastarlo en la otra.
# Por eso la ubicación no es un campo de esta pantalla: es el contexto de la
# sesión y se elige en la cabecera del escritorio, igual que el perfil.
#
# ----------------------------------------------------------------------------
# LO QUE SE LE PIDE A CARGAR
#
#     T01FUN|C|&lt;cTrabajador&gt;|&lt;cUbicacion&gt;
#
# El trabajador y la ubicación NO salen de la pantalla: salen de la sesión
# -Escritorio los deja al ingresar y los cambia el desplegable de la cabecera-.
# Que viajen desde el navegador es solo comodidad de lectura para el paquete;
# la palabra final sobre qué puede ver y grabar un funcionario la tiene la
# base, no esta trama.
#
# Esto es propio de T01FUN y por eso lo registra Sistema.js
# ('Ventana.datosDeCarga.T01FUN'), no la librería: ninguna otra pantalla carga
# con esta forma.
#
# ----------------------------------------------------------------------------
# LO QUE DEVUELVE CARGAR, por segmentos separados por ~ :
#
#   [0]  listas de los combos, separadas por ¦ y con sus registros por ¬
#          0  periodos      aaaamm|aaaamm
#   [1]  filas de la grilla, campos por | y en el orden de 'mapeo|origen=cargar'
#   [2]  ayuda de la lupa: las oficinas dependientes, lista plana
#          |codigo|nombre|codigo|nombre...
#   [3]  valores por omisión, 'clave=valor' separados por ¦
#          Periodo=202609¦PeriodoPop=202609
#   [4]  el resumen de la cuota de ESA ubicación en ESE periodo, en hh:mm:
#          &lt;asignada&gt;|&lt;repartida&gt;|&lt;pendiente&gt;
#          por ejemplo   2636:00|2042:00|594:00
#
# El [4] es lo que pinta la tarjeta de resumen. Se manda calculado desde la
# base y no se recalcula aquí: la pantalla solo ve las filas de un periodo, y
# una cuenta que se arma con lo que hay a la vista miente en cuanto algo queda
# fuera de la vista.
#
# Consultar declara 'devuelve=todo' porque el resumen tiene que cambiar con el
# periodo: la respuesta de la consulta trae los mismos cinco segmentos.
#
# ----------------------------------------------------------------------------
# LO QUE DEVUELVE GESTIONAR -grabar, modificar y eliminar-:
#
#     &lt;mensaje&gt; ~ &lt;datosGrilla&gt; ~ &lt;datosResumen&gt;
#
# es decir, el mensaje de siempre y detrás lo que acaba de cambiar: las filas
# del periodo y el resumen recalculado. Cada línea que entra o sale mueve la
# cuenta de la cuota, así que la tarjeta y la grilla se rehacen juntas, con la
# misma respuesta y sin un viaje más. Los tres segmentos son obligatorios: si
# el resumen no viene, la tarjeta se queda con la cifra vieja -que ya no es
# cierta- y solo queda anotado en la consola.
#
# Ojo con los índices: aquí el resumen es el segmento [2] y en la carga es el
# [4], porque en un grabado el [0] es el mensaje y en una carga son los
# combos. La pantalla no lo adivina contando: se le dice de dónde viene la
# respuesta.
# ============================================================================

pantalla|tabla=T01FUN|titulo=Distribución de Cuotas|subtitulo=Reparta entre sus oficinas dependientes las horas extra que le asignó la administración.

# ---------------------------------------------------------------------------
# Con qué se pide la lista. Aquí queda UN solo filtro: el periodo. La oficina
# no está porque ya la dice la cabecera, y repetirla en la pantalla dejaría al
# usuario con dos sitios donde elegir lo mismo y con la duda de cuál manda.
#
# Es un desplegable simple y no múltiple: el resumen de arriba es de un
# periodo: si se pudieran marcar tres, la tarjeta no sabría de cuál hablar.
# ---------------------------------------------------------------------------
seccion|id=busqueda
campo|tipo=select|id=Periodo|etiqueta=Periodo|lista=0|ancho=corto
accion|id=Consultar|etiqueta=Consultar|estilo=primario|accion=consultar|ubicacion=busqueda|devuelve=todo

# ---------------------------------------------------------------------------
# El resumen de la cuota. Una sección sin campos: el txt dice DÓNDE va -entre
# el filtro y la grilla- y Sistema.js la pinta con el segmento [4], porque las

<script>
var Http = (function () {

    var TIEMPO_MAXIMO = 60000;   /* ms; 0 desactiva el limite                */

    var CLASE_OCULTAR = "hide";

    function registrar(mensaje, detalle) {
        if (typeof console === "undefined" || !console) return;

    function capaCarga() {
        var capa = document.getElementById(ID_CAPA_CARGA);
        if (capa) return capa;
        try {
            if (window.parent && window.parent !== window && window.parent.document) {
                return window.parent.document.getElementById(ID_CAPA_CARGA);
            }
        } catch (e) {
            /* otro origen: se trabaja solo con el documento actual */
        }
        return null;
    }

       recien cuando termina la ultima, no cuando responde la primera.       */
    function mostrarCarga(xhr) {
        var i = indiceDe(xhr);
        if (i === -1) enCurso.push(xhr);
        var capa = capaCarga();
        if (capa && capa.className.indexOf(CLASE_OCULTAR) !== -1) {
            capa.className = quitarClase(capa.className, CLASE_OCULTAR);
        }
    }

    function ocultarCarga(xhr) {
        var i = indiceDe(xhr);
        if (i !== -1) enCurso.splice(i, 1);
        if (enCurso.length > 0) return;
        var capa = capaCarga();
        if (capa && capa.className.indexOf(CLASE_OCULTAR) === -1) {
            capa.className = (capa.className === "" ? CLASE_OCULTAR : capa.className + " " + CLASE_OCULTAR);
        }
    }

    function indiceDe(xhr) {
        var i, n = enCurso.length;
        for (i = 0; i < n; i++) { if (enCurso[i] === xhr) return i; }
        return -1;
    }

        var partes = className.split(/\s+/), salida = [], i, n = partes.length;

        }

    }

       la llama, la primera peticion la ejecuta sola (ver asegurarConfig).    */

        try {
            var hdfRaiz = document.getElementById("hdfRaiz");
            var hdfToken = document.getElementById("hdfToken");

            if (hdfRaiz && hdfRaiz.value) {
                cfg.urlBase = hdfRaiz.value;
                guardarEnSesion("urlBase", hdfRaiz.value);
            }
            if (hdfToken && hdfToken.value) {
                cfg.token = hdfToken.value;
                guardarEnSesion("token", hdfToken.value);
            }
            cfg.configurado = true;
        } catch (e) {
            registrar("No se pudo leer la configuracion de la pagina.", e);
        }

        } catch (e) {
            /* modo incognito o almacenamiento bloqueado: queda solo en memoria */
            registrar("sessionStorage no disponible; la configuracion queda en memoria.", e);
        }

    function leerDeSesion(clave) {
        try {
            var v = window.sessionStorage.getItem(clave);
            /* getItem devuelve null: concatenar "" producia la cadena "null"
               y la peticion salia hacia "nullSAHE/validarLogin".             */
            return (v === null || v === "null" || v === "undefined") ? null : v;
        } catch (e) {
            return null;
        }
    }

    function asegurarConfig() {
        if (cfg.urlBase === null) cfg.urlBase = leerDeSesion("urlBase");
        if (cfg.token === null) cfg.token = leerDeSesion("token");
        if (cfg.urlBase === null || cfg.token === null) Http.configuracion();

    /* --------------------------------------------------------------- urls  */

    function raiz() {
        var base = cfg.urlBase;
        if (!base) return "/";
        if (base.charAt(base.length - 1) !== "/") base += "/";
        return base;
    }

    function armarUrl(url, externo) {
        var limpia = String(url === undefined || url === null ? "" : url);
        if (externo) return limpia;
        while (limpia.charAt(0) === "/") limpia = limpia.substring(1);
        return raiz() + limpia;
    }

       La version anterior rechazaba toda peticion cuya url o cuyos datos
       contuvieran  --  '  ;  UNION SELECT UPDATE DELETE DROP ../ <script>
       Eso bloqueaba datos legitimos (apellido "D'Angelo", una clave con ";",
       un comentario que diga "actualizar") y ademas no protegia nada: sobre
       un FormData, la expresion evaluaba la cadena "[object FormData]", que
       nunca coincide. La defensa contra inyeccion corresponde al servidor,
       con consultas parametrizadas; aqui solo se corta el salto de ruta.     */
    function rutaSegura(url, externo) {
        var u = String(url || "");
        if (u.indexOf("../") !== -1 || u.indexOf("..\\") !== -1) return false;
        if (externo) return true;
        if (u.indexOf("//") === 0) return false;                 /* //otrositio.com  */

        return true;
    }

       propio Http: dejarlo en la pantalla obligaba a repetirlo, y olvidarse
       significaba que el usuario se quedaba mirando un aviso dentro del marco
       sin forma de volver a entrar.

       Una pantalla puede reemplazarlo si necesita otra cosa; el valor por
       omisión ya hace lo correcto. */
    Http.onSesionExpirada = function () {

    };

       Escritorio que lo haga -así también limpia lo que tenga guardado-; si no
       se puede llegar al padre, navega por las malas. */
    Http.irAlLogin = function irAlLogin() {
        var raiz;

        try {
            if (window.parent && window.parent !== window &&
                window.parent.Escritorio && typeof window.parent.Escritorio.irAlLogin === "function") {

            } catch (e2) {
                raiz = null;
            }

                tipo: "seguridad",
                status: 0,
                statusText: "",
                mensaje: "La ruta solicitada no es válida.",

                metodo: metodo,
                respuesta: null

                botones.appendChild(botonHerramienta(nombre));
            }
            panel.appendChild(botones);
            return panel;
        }

        function botonHerramienta(nombre) {
            var boton = elemento("button", {
                type: "button",
                "class": "boton-herramienta boton-" + nombre,
                title: TITULOS[nombre],
                "data-accion": nombre
            });
            boton.appendChild(svg(ICONOS[nombre], 17));
            return boton;
        }

        function claseAncho(columna) {
            if (columna.oculto) return "col-hidden";
            return columna.ancho ? "col-width-" + columna.ancho : "";
        }

        /* El título se alinea como sus datos: un encabezado a la izquierda
           sobre una columna de importes se lee torcido. */
        function claseCabecera(columna) {
            var base = claseAncho(columna);
            if (columna.oculto) return base;
            return (base === "" ? "" : base + " ") + alineacionDe(columna);
        }

        function construirCabecera() {
            var cabeza = elemento("thead");
            var filaTitulos = elemento("tr", { "class": "FilaCabecera" });
            var filaFiltros = elemento("tr", { "class": "FilaFiltros" });
            var i, columna, celda, entrada, enlace;

            if (conSeleccion) {
                celda = elemento("th", { "class": "col-marca Centro" });
                celda.appendChild(elemento("input", { type: "checkbox", "data-marcar-todo": "1", title: "Marcar todo" }));
                filaTitulos.appendChild(celda);
                filaFiltros.appendChild(elemento("th", { "class": "col-marca" }));
            }

            for (i = 0; i < columnas.length; i++) {
                columna = columnas[i];

                celda = elemento("th", { "class": claseCabecera(columna), "data-columna": i });
                /* El ancho sale del número que declara el txt. Antes dependía
                   de que existiera una clase .col-width-N en el CSS, así que
                   un ancho nuevo salía sin aplicar y sin avisar. */
                if (!columna.oculto && columna.ancho) celda.style.width = columna.ancho + "px";
                enlace = elemento("span", { "class": "EnlaceCabecera", "data-orden": i }, columna.titulo);
                celda.appendChild(enlace);
                refs["orden" + i] = elemento("span", { "class": "orden" });
                enlace.appendChild(refs["orden" + i]);
                filaTitulos.appendChild(celda);

                celda = elemento("th", { "class": claseAncho(columna) });
                if (conFiltros && !columna.oculto) {
                    celda.appendChild(controlFiltro(i, columna));
                }
                filaFiltros.appendChild(celda);
                criterios.push(combos[i] && combos[i].tipo === "cm" ? [] : "");
            }

            if (hayAccionesFila()) {
                filaTitulos.appendChild(elemento("th", { "class": "col-acciones Centro" }, "Acciones"));
                filaFiltros.appendChild(elemento("th", { "class": "col-width-5" }));
            }

            cabeza.appendChild(filaTitulos);
            if (conFiltros) cabeza.appendChild(filaFiltros);
            return cabeza;
        }

        /* Tres formas de filtrar una columna: caja de texto, combo simple o
           combo de selección múltiple. Lo decide la línea 'grilla' del txt. */
        function controlFiltro(indice, columna) {
            var combo = combos[indice];

            if (!combo) {
                return elemento("input", {
                    type: "text", "data-filtro": indice,
                    placeholder: "Filtrar", "aria-label": "Filtrar por " + columna.titulo
                });
            }
            if (combo.tipo === "cm") return filtroMultiple(indice, columna);
            return filtroSimple(indice, columna);
        }

        function filtroSimple(indice, columna) {
            var seleccion = elemento("select", {
                "data-filtro": indice, "aria-label": "Filtrar por " + columna.titulo
            });
            refs["combo" + indice] = seleccion;
            llenarSimple(indice);
            return seleccion;
        }

        function llenarSimple(indice) {
            var seleccion = refs["combo" + indice];
            var registros = listas[combos[indice].lista] || [];
            var i, partes, opcion, elegido;

            if (!seleccion) return;
            elegido = seleccion.value;
            seleccion.innerHTML = "";

            opcion = document.createElement("option");
            opcion.value = "";
            opcion.textContent = "Todos";
            seleccion.appendChild(opcion);

            for (i = 0; i < registros.length; i++) {
                if (registros[i] === "") continue;
                partes = String(registros[i]).split("|");
                opcion = document.createElement("option");
                opcion.value = partes[0];
                opcion.textContent = partes.length > 1 ? partes[1] : partes[0];
                seleccion.appendChild(opcion);
            }
            if (elegido) seleccion.value = elegido;
        }

        /* Selección múltiple: un botón con el resumen y un panel de casillas.
           No se usa <select multiple> porque en una fila de filtros ocupa
           varias líneas y no deja ver la rejilla. */
        function filtroMultiple(indice, columna) {
            var caja = elemento("div", { "class": "filtro-multiple" });
            var boton = elemento("button", {
                type: "button", "class": "filtro-multiple__boton",
                "data-panel": indice, "aria-label": "Filtrar por " + columna.titulo
            }, "Todos");
            var panel = elemento("div", { "class": "filtro-multiple__panel", "data-panel-de": indice });

            refs["resumen" + indice] = boton;
            refs["panel" + indice] = panel;
            caja.appendChild(boton);
            caja.appendChild(panel);
            llenarMultiple(indice);
            return caja;
        }

        function llenarMultiple(indice) {
            var panel = refs["panel" + indice];
            var registros = listas[combos[indice].lista] || [];
            var i, partes, fila, marca;

            if (!panel) return;
            panel.innerHTML = "";

            for (i = 0; i < registros.length; i++) {
                if (registros[i] === "") continue;
                partes = String(registros[i]).split("|");
                fila = elemento("label", { "class": "filtro-multiple__opcion" });
                marca = elemento("input", { type: "checkbox", "data-marca-filtro": indice, value: partes[0] });
                fila.appendChild(marca);
                fila.appendChild(elemento("span", null, partes.length > 1 ? partes[1] : partes[0]));
                panel.appendChild(fila);
            }
        }

        function resumirMultiple(indice) {
            var boton = refs["resumen" + indice];
            var elegidos = criterios[indice] || [];
            if (!boton) return;
            boton.textContent = elegidos.length === 0
                ? "Todos"
                : (elegidos.length === 1 ? "1 elegido" : elegidos.length + " elegidos");
        }

        function alternarPanel(indice) {
            var panel = refs["panel" + indice];
            var abierto = panel && panel.className.indexOf("abierto") !== -1;
            cerrarPaneles();
            if (panel && !abierto) panel.className = "filtro-multiple__panel abierto";
        }

        function cerrarPaneles() {
            var i;
            for (i = 0; i < columnas.length; i++) {
                if (refs["panel" + i]) refs["panel" + i].className = "filtro-multiple__panel";
            }
        }

        /* Tres situaciones distintas y cada una necesita su texto: filtrando,
           trayendo por bloques, o todo a la vista. */
        function textoConteo(cuantasVisibles) {
            if (cuantasVisibles !== filas.length) return cuantasVisibles + " de " + filas.length;
            if (totalEsperado > filas.length) return filas.length + " de " + totalEsperado + "…";
            return String(filas.length);
        }

        function hayAccionesFila() {
            var i;
            for (i = 0; i < ACCIONES_FILA.length; i++) {
                if (acciones[ACCIONES_FILA[i]]) return true;
            }
            return false;
        }

        function construirEstructura() {
            var marco = elemento("div", { "class": "divGrilla" });
            var tabla = elemento("table", { "class": "cssGridView" });
            var pie = elemento("tfoot");
            var filaPie = elemento("tr");
            var celdaPie = elemento("td", { colspan: columnas.length + 2 });

            contenedor.innerHTML = "";
            contenedor.appendChild(construirHerramientas());

            tabla.appendChild(construirCabecera());
            refs.cuerpo = elemento("tbody");
            tabla.appendChild(refs.cuerpo);

            /* La fila de totales va ANTES de la del paginado: primero el
               resumen de lo que se está viendo, después cómo moverse. */
            if (totales.length > 0) {
                refs.totales = elemento("tr", { "class": "FilaTotales" });
                pie.appendChild(refs.totales);
            }

            refs.paginado = celdaPie;
            filaPie.appendChild(celdaPie);
            pie.appendChild(filaPie);
            tabla.appendChild(pie);

            marco.appendChild(tabla);
            contenedor.appendChild(marco);
        }

        /* Suma pura: recibe filas y devuelve el total de una columna. Se
           prueba sin navegador. */
        function sumaDe(filas, indice) {
            var total = 0, i, hora = esHora(columnas[indice]);

            for (i = 0; i < filas.length; i++) {
                total += hora ? aMinutos(filas[i][indice]) : aNumero(filas[i][indice]);
            }
            return total;
        }

        /* Se suman las filas VISIBLES, no todas: si el usuario filtró por una
           agencia, el total que espera es el de esa agencia. */
        function pintarTotales(visibles) {
            var nueva, j, celda, esTotal, columna, rotulado = false;

            if (!refs.totales) return;
            nueva = elemento("tr", { "class": "FilaTotales" });

            if (conSeleccion) nueva.appendChild(elemento("td", { "class": "col-marca" }));

            for (j = 0; j < columnas.length; j++) {
                columna = columnas[j];
                esTotal = contieneNumero(totales, j);
                if (columna.oculto) { nueva.appendChild(elemento("td", { "class": "col-hidden" })); continue; }

                if (esTotal) {
                    /* El total de una columna hh:mm es otro hh:mm: sumar 120:45
                       y 8:30 da 129:15, no 129.25. */
                    celda = elemento("td", { "class": "Derecha" },
                                     esHora(columna)
                                        ? formatearHora(sumaDe(visibles, j))
                                        : formatearNumero(sumaDe(visibles, j), { tipo: "decimal" }));
                } else if (!rotulado && j > 0 && contieneNumero(totales, j + 1)) {
                    /* El rótulo se pone en la columna anterior a la primera
                       que suma, que es donde el ojo lo busca. */
                    celda = elemento("td", { "class": "Derecha rotulo-total" }, "Totales");
                    rotulado = true;
                } else {
                    celda = elemento("td");
                }
                nueva.appendChild(celda);
            }
            if (hayAccionesFila()) nueva.appendChild(elemento("td"));

            refs.totales.parentNode.replaceChild(nueva, refs.totales);
            refs.totales = nueva;
        }

        function contieneNumero(lista, valor) {
            var i;
            for (i = 0; i < lista.length; i++) {
                if (lista[i] === valor) return true;
            }
            return false;
        }

        /* --------------------------------------------------------- pintado */

        function pintarFilas(visibles) {
            var enPagina = paginar(visibles, pagina, porPagina);
            var cuerpo = elemento("tbody");
            var i, j, fila, celda, columna, texto, indice, marca;

            if (enPagina.length === 0) {
                fila = elemento("tr", { "class": "sinDatos" });
                fila.appendChild(elemento("td", { colspan: columnas.length + 2 },
                    filas.length === 0 ? "No hay registros." : "Ningún registro coincide con los filtros."));
                cuerpo.appendChild(fila);
            }

            for (i = 0; i < enPagina.length; i++) {
                indice = indiceReal(enPagina[i]);
                fila = elemento("tr", { "data-fila": indice });

                if (conSeleccion) {
                    celda = elemento("td", { "class": "col-marca Centro" });
                    marca = elemento("input", { type: "checkbox", "data-marcar": indice });
                    marca.checked = marcadas[indice] === true;
                    celda.appendChild(marca);
                    fila.appendChild(celda);
                }

                for (j = 0; j < columnas.length; j++) {
                    columna = columnas[j];
                    celda = elemento("td", {
                        "class": (columna.oculto ? "col-hidden" : alineacionDe(columna))
                    });
                    if (esAdjunto(columna) && !columna.oculto) {
                        celda.appendChild(botonAdjunto(enPagina[i][j]));
                    } else if (editables[j] && !columna.oculto) {
                        celda.appendChild(controlEdicion(indice, j, enPagina[i][j]));
                    } else {
                        celda.appendChild(document.createTextNode(textoCelda(enPagina[i][j], j, columna)));
                    }
                    fila.appendChild(celda);
                }

                if (hayAccionesFila()) fila.appendChild(celdaAcciones());
                cuerpo.appendChild(fila);
            }

            refs.cuerpo.parentNode.replaceChild(cuerpo, refs.cuerpo);
            refs.cuerpo = cuerpo;
        }

        /* La columna de adjunto muestra el icono del documento, no su nombre:
           en una lista de veinte gerencias los nombres son todos parecidos y
           ocupan media pantalla. Sin documento el botón queda apagado en lugar
           de desaparecer, para que la columna no se desalinee de fila en fila
           y se entienda que el registro existe pero no tiene sustento. */
        function botonAdjunto(valor) {
            var nombre = adjuntoDeTrama(valor);
            var hay = nombre !== "";
            var boton = elemento("span", {
                "class": "boton-accion boton-adjunto" + (hay ? "" : " boton-adjunto--vacio"),
                title: hay ? nombre : "El registro no tiene documento adjunto",
                "data-accion": hay ? "adjunto" : null,
                "data-archivo": hay ? nombre : null
            });

            boton.appendChild(svg(ICONOS.pdf, 16));
            return boton;
        }

        /* El combo de la columna manda; si no hay, se acepta el índice
           declarado en la propia columna. */
        function textoCelda(valor, indice, columna) {
            if (combos[indice]) return describir(valor, listas[combos[indice].lista]);
            if (columna.lista !== undefined && columna.lista !== "") {
                return describir(valor, listas[Number(columna.lista)]);
            }
            if (esNumerica(columna)) return formatearNumero(valor, columna);
            if (esHora(columna)) return normalizarHora(valor);
            return valor;
        }

        /* El control de una celda editable. El tipo lo dice el txt, no el
           dato: 'fec' pinta un calendario aunque llegue vacío, y 'dec' admite
           centavos aunque el primer registro venga redondo. */
        function controlEdicion(indiceFila, indiceColumna, valor) {
            var tipo = editables[indiceColumna].tipo;
            var atributos;

            if (tipo === "lista") return selectEdicion(indiceFila, indiceColumna, valor);

            atributos = {
                type: (tipo === "fecha" ? "date" : (tipo === "texto" ? "text" : "number")),
                "class": "control control-celda",
                "data-celda": indiceFila + ":" + indiceColumna,
                value: valorEditable(valor, tipo)
            };

            if (tipo === "decimal") { atributos.step = "0.01"; atributos.min = "0"; }
            if (tipo === "numero") { atributos.step = "1"; atributos.min = "0"; }
            /* Una fecha de movimiento registra algo que ya pasó: el tope va en
               el propio control, así el calendario del navegador ni siquiera
               ofrece los días de adelante. */
            if (tipo === "fecha") {
                atributos.max = hoyISO();
                /* Si el navegador no dibuja el calendario, el control queda
                   como una caja de texto sin ninguna pista del formato. */
                atributos.placeholder = "aaaa-mm-dd";
                atributos.title = "Fecha en formato año-mes-día, no posterior a hoy.";
            }
            return elemento("input", atributos);
        }

        /* Un desplegable dentro de la celda. Se llena con la misma lista que
           usan los combos de filtro, así el detalle ofrece exactamente lo que
           el paquete mandó como vigente. */
        function selectEdicion(indiceFila, indiceColumna, valor) {
            var registros = listas[editables[indiceColumna].lista] || [];
            var caja = elemento("select", {
                "class": "control control-celda",
                "data-celda": indiceFila + ":" + indiceColumna
            });
            var i, partes, opcion;

            opcion = elemento("option", { value: "" }, "Seleccione");
            caja.appendChild(opcion);
            for (i = 0; i < registros.length; i++) {
                if (registros[i] === "") continue;
                partes = String(registros[i]).split("|");
                opcion = elemento("option", { value: partes[0] },
                                  partes.length > 1 ? partes[1] : partes[0]);
                caja.appendChild(opcion);
            }
            caja.value = String(valor === null || valor === undefined ? "" : valor);
            return caja;
        }

        /* Lo que va DENTRO del control no lleva separador de miles: un
           <input type=number> con '5,001.01' lo rechaza y queda vacío. */
        function valorEditable(valor, tipo) {
            var texto = String(valor === null || valor === undefined ? "" : valor);
            if (texto === "") return "";
            if (tipo === "numero") return String(Math.round(aNumero(texto)));
            if (tipo === "decimal") return aNumero(texto).toFixed(2);
            return texto;
        }

        /* Una fecha posterior a hoy queda en rojo con el motivo en el title.
           No se bloquea el tecleo: se avisa, y Grabar es quien se niega. */
        function marcarCeldaFecha(control, indiceColumna) {
            var mal;
            if (!editables[indiceColumna] || editables[indiceColumna].tipo !== "fecha") return;
            mal = control.value !== "" && control.value > hoyISO();
            control.className = mal ? "control control-celda control--error" : "control control-celda";
            control.title = mal ? "La fecha no puede ser posterior a hoy." : "";
        }

        function celdaAcciones() {
            var celda = elemento("td", { "class": "col-acciones Centro" });
            var i, nombre, boton;

            for (i = 0; i < ACCIONES_FILA.length; i++) {
                nombre = ACCIONES_FILA[i];
                if (!acciones[nombre]) continue;
                boton = elemento("span", {
                    "class": "boton-accion boton-" + nombre,
                    title: TITULOS[nombre],
                    "data-accion": nombre
                });
                boton.appendChild(svg(ICONOS[nombre], 15));
                celda.appendChild(boton);
            }
            return celda;
        }

        function indiceReal(fila) {
            var i;
            for (i = 0; i < filas.length; i++) {
                if (filas[i] === fila) return i;
            }
            return -1;
        }

        /* Cuántos números se muestran alrededor del actual. Antes se dibujaban
           TODAS las páginas: con 35 mil filas de a 10 eso son 3 522 botones
           rehechos en cada tecla del filtro, y ninguno de los 3 500 del medio
           le sirve a nadie. */
        var PAGINAS_A_LA_VISTA = 7;

        /* Devuelve la ventana de números a mostrar. Es una función pura: se
           puede probar sin navegador. */
        function ventanaPaginas(actual, paginas, cuantas) {
            var mitad = Math.floor(cuantas / 2);
            var desde = Math.max(0, actual - mitad);
            var hasta = Math.min(paginas - 1, desde + cuantas - 1);

            desde = Math.max(0, Math.min(desde, hasta - cuantas + 1));
            return { desde: desde, hasta: hasta };
        }

        function botonPagina(indice, texto, activa, titulo) {
            return elemento("button", {
                type: "button",
                "class": "Pagina" + (activa ? " PaginaActiva" : ""),
                "data-pagina": indice,
                title: titulo || null
            }, texto);
        }

        function pintarPaginado(cantidad) {
            var paginas = totalPaginas(cantidad, porPagina);
            var nuevo = elemento("td", { colspan: columnas.length + 2 });
            var rango, i;

            if (paginas > 1) {
                rango = ventanaPaginas(pagina, paginas, PAGINAS_A_LA_VISTA);

                if (pagina > 0) {
                    nuevo.appendChild(botonPagina(0, "«", false, "Primera"));
                    nuevo.appendChild(botonPagina(pagina - 1, "‹", false, "Anterior"));
                }
                for (i = rango.desde; i <= rango.hasta; i++) {
                    nuevo.appendChild(botonPagina(i, String(i + 1), i === pagina));
                }
                if (pagina < paginas - 1) {
                    nuevo.appendChild(botonPagina(pagina + 1, "›", false, "Siguiente"));
                    nuevo.appendChild(botonPagina(paginas - 1, "»", false, "Última (" + paginas + ")"));
                }
            }
            refs.paginado.parentNode.replaceChild(nuevo, refs.paginado);
            refs.paginado = nuevo;
        }

        function pintarOrden() {
            var i;
            for (i = 0; i < columnas.length; i++) {
                if (!refs["orden" + i]) continue;
                refs["orden" + i].textContent = (i === indiceOrden) ? (ordenAscendente ? " ▲" : " ▼") : "";
            }
        }

        function refrescar() {
            var visibles = ordenar(filtrar(filas, criterios, combos, listas), indiceOrden, ordenAscendente, columnas);
            var paginas = totalPaginas(visibles.length, porPagina);

            if (pagina >= paginas) pagina = paginas - 1;
            if (pagina < 0) pagina = 0;

            refs.conteo.textContent = textoConteo(visibles.length);

            pintarFilas(visibles);
            pintarTotales(visibles);
            pintarPaginado(visibles.length);
            pintarOrden();
        }

        /* ------------------------------------------------------ eventos --- */

        function nodoConAtributo(nodo, atributo) {
            while (nodo && nodo !== contenedor) {
                if (nodo.getAttribute && nodo.getAttribute(atributo) !== null) return nodo;
                nodo = nodo.parentNode;
            }
            return null;
        }

        function filaDe(nodo) {
            var contenedorFila = nodoConAtributo(nodo, "data-fila");
            var indice;
            if (!contenedorFila) return null;
            indice = +contenedorFila.getAttribute("data-fila");
            return filas[indice] || null;
        }

        /* Marca o desmarca lo que está a la vista, no toda la tabla: es lo que
           el usuario ve y espera. */
        function marcarTodo(activo) {
            var visibles = ordenar(filtrar(filas, criterios, combos, listas), indiceOrden, ordenAscendente, columnas);
            var enPagina = paginar(visibles, pagina, porPagina);
            var i, indice;

            for (i = 0; i < enPagina.length; i++) {
                indice = indiceReal(enPagina[i]);
                if (activo) marcadas[indice] = true;
                else delete marcadas[indice];
            }
            refrescar();
        }

        function seleccionados() {
            var salida = [], clave;
            for (clave in marcadas) {
                if (Object.prototype.hasOwnProperty.call(marcadas, clave) && marcadas[clave] && filas[clave]) {
                    salida.push(filas[clave]);
                }
            }
            return salida;
        }

        function limpiarFiltros() {
            var entradas = contenedor.querySelectorAll("[data-filtro]");
            var marcas = contenedor.querySelectorAll("[data-marca-filtro]");
            var i;

            for (i = 0; i < entradas.length; i++) entradas[i].value = "";
            for (i = 0; i < marcas.length; i++) marcas[i].checked = false;
