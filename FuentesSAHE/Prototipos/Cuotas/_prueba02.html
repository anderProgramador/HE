           función al inicio, funciones cortas de una sola responsabilidad,
           comparación con === y ningún global implícito.                      */

        var SEPARADOR_REGISTRO = /\r?\n|¬/;
        var ANCHOS = ["corto", "medio", "largo", "total"];
        var NANCHOS = ANCHOS.length;

        /* Se conservan los prefijos de id del aplicativo anterior. Lo que de
           verdad usa Ventana.obtenerDatos es la clase G+tabla.               */
        var PREFIJOS = {
            number: "num", text: "txt", textarea: "txa", archivo: "fup",
            select: "cbo", checkbox: "chk", fecha: "dat", oculto: "hdn",
            /* En 'hora' y 'adjunto' el valor lo lleva una caja de texto: la
               hora se escribe hh:mm y el adjunto muestra el nombre. */
            hora: "txt", adjunto: "txt",
            /* El multicombo guarda su valor en un <select multiple> oculto:
               conserva el prefijo del desplegable porque para el resto de la
               librería -llenar listas, leer, limpiar- es uno más. */
            multi: "cbo"
        };

        /* ------------------------------------------------ 1. analizar ----- */

        function esPlantillaNombrada(datos) {
            return typeof datos === "string" && /(^|\r?\n|¬)\s*pantalla\|/.test(datos);
        }

        function separarLista(texto) {
            var partes = String(texto || "").split(","), salida = [], i, n = partes.length, dato;
            for (i = 0; i < n; i++) {
                dato = partes[i].replace(/^\s+|\s+$/g, "");
                if (dato !== "") salida.push(dato);
            }
            return salida;
        }

        function analizarRegistro(linea) {
            var partes = linea.split("|");
            /* Es la cantidad de campos, no el largo de la cadena: con
               linea.length el bucle se pasaba del final del arreglo, par
               quedaba undefined y par.indexOf reventaba la construcción de
               toda la ventana. */
            var nPartes = partes.length;
            var registro = { tipo: partes[0].replace(/^\s+|\s+$/g, ""), atributos: {} };
            var i, par, corte, clave, valor;

            for (i = 1; i < nPartes; i++) {
                par = partes[i];
                if (par === undefined || par === "") continue;
                corte = par.indexOf("=");
                if (corte === -1) continue;               /* par suelto: se ignora */
                clave = par.substring(0, corte).replace(/^\s+|\s+$/g, "");
                valor = par.substring(corte + 1).replace(/^\s+|\s+$/g, "");
                if (clave !== "") registro.atributos[clave] = valor;
            }
            return registro;
        }

        /* Columnas de la grilla, declaradas en una sola línea de la plantilla:
               columnas=Id:0:numero,Código:150,Descripción:280:texto
           Cada columna es titulo[:ancho[:tipo]]. Ancho 0 la oculta, que es como
           se lleva la llave sin mostrarla. */
        function analizarColumnas(texto) {
            var partes = separarLista(texto), salida = [], i, campos, ancho;

            for (i = 0; i < partes.length; i++) {
                campos = partes[i].split(":");
                ancho = campos.length > 1 ? campos[1].replace(/^\s+|\s+$/g, "") : "";
                salida.push({
                    titulo: campos[0].replace(/^\s+|\s+$/g, ""),
                    ancho: ancho,
                    tipo: campos.length > 2 ? campos[2].replace(/^\s+|\s+$/g, "") : "texto",
                    /* Cuarta parte: índice de la lista con la que se traduce el
                       código que devuelve Oracle a su descripción. */
                    lista: campos.length > 3 ? campos[3].replace(/^\s+|\s+$/g, "") : "",
                    oculto: ancho === "0"
                });
            }
            return salida;
        }

        /* Los nombres se normalizan contra una lista canónica: en el txt da
           igual escribir eliminarMultiple, eliminarmultiple o ELIMINARMULTIPLE,
           y del otro lado siempre se compara contra el mismo nombre. Antes se
           pasaba todo a minúsculas y 'eliminarmultiple' no coincidía con el
           'eliminarMultiple' que usan los permisos. */
        /* Los nombres que el txt puede escribir en 'acciones='. Los dos
           últimos son los de la grilla del detalle, que tiene sus propios
           permisos: sin ellos, 'acciones=nuevoDetalle,eliminarDetalle' se
           descartaba entero y la grilla quedaba sin botones. */
        var ACCIONES_CANONICAS = ["nuevo", "eliminarMultiple", "excel", "editar", "eliminar", "ver",
                                  "nuevoDetalle", "eliminarDetalle"];

        function normalizarAccion(nombre) {
            var buscado = String(nombre || "").toLowerCase(), i;
            for (i = 0; i < ACCIONES_CANONICAS.length; i++) {
                if (ACCIONES_CANONICAS[i].toLowerCase() === buscado) return ACCIONES_CANONICAS[i];
            }
            return "";
        }

        /* Combos de la fila de filtros, en el formato de siempre: columna,
           tipo (cs simple, cm múltiple) e índice de la lista. Por ejemplo
           '6cs1' pone en la columna 6 un combo simple con la lista 1.
           Van separados por coma y no por | porque aquí | separa los campos
           del registro. */
        /* 'editables=3num,4fec' -> qué columnas se escriben y con qué control.
           Mismo formato que los combos: índice de columna + tipo.
              num  número entero      dec  número con decimales
              txt  texto              fec  fecha
           Una columna sin declarar es de solo lectura, que es lo que era
           antes: la grilla no se vuelve editable por accidente. */
        /* num entero, dec con decimales, txt texto, fec fecha, cbo lista.
           'cbo' lleva detrás el índice de la lista, igual que los combos de
           filtro: '2cbo0' es un desplegable en la columna 2 con la lista 0. */
        var TIPOS_EDICION = { cbo: "lista", num: "numero", dec: "decimal", txt: "texto", fec: "fecha" };

        function analizarEditables(texto) {
            var partes = separarLista(texto), salida = [], i, dato, corte, clave, tipo, largo;

            for (i = 0; i < partes.length; i++) {
                dato = partes[i].toLowerCase();
                corte = -1;
                for (clave in TIPOS_EDICION) {
                    if (!Object.prototype.hasOwnProperty.call(TIPOS_EDICION, clave)) continue;
                    if (dato.indexOf(clave) > 0) {
                        corte = dato.indexOf(clave);
                        tipo = TIPOS_EDICION[clave];
                        largo = clave.length;
                        break;
                    }
                }
                if (corte < 1) continue;
                salida.push({
                    columna: Number(dato.substring(0, corte)),
                    tipo: tipo,
                    lista: Number(dato.substring(corte + largo)) || 0
                });
            }
            return salida;
        }

        /* 'totales=3,4' -> qué columnas suman al pie. Se declara aparte del
           tipo porque no toda columna numérica se suma: un año o un código de
           agencia son números y sumarlos no significa nada. */
        function analizarTotales(texto) {
            var partes = separarLista(texto), salida = [], i, n;
            for (i = 0; i < partes.length; i++) {
                n = Number(partes[i]);
                if (!isNaN(n) && partes[i] !== "") salida.push(n);
            }
            return salida;
        }

        function analizarCombos(texto) {
            var partes = separarLista(texto), salida = [], i, dato, corte, tipo;

            for (i = 0; i < partes.length; i++) {
                dato = partes[i].toLowerCase();
                corte = dato.indexOf("cs");
                tipo = "cs";
                if (corte === -1) { corte = dato.indexOf("cm"); tipo = "cm"; }
                if (corte < 1) continue;                 /* sin columna delante */
                salida.push({
                    columna: Number(dato.substring(0, corte)),
                    tipo: tipo,
                    lista: Number(dato.substring(corte + 2))
                });
            }
            return salida;
        }

        /* 'editar:Codigo,Justificacion;nuevo:Secuencia' -> un arreglo de ids
           por acción. Los grupos van con ; y los campos de cada uno con , ,
           porque el | ya separa los campos del registro. Sin el prefijo de
           acción, la lista se aplica a todas. */
        function analizarPorAccion(texto) {
            var grupos = String(texto || "").split(";"), salida = {}, i, corte, accion, campos;

            for (i = 0; i < grupos.length; i++) {
                if (grupos[i].replace(/^\s+|\s+$/g, "") === "") continue;
                corte = grupos[i].indexOf(":");
                if (corte === -1) { accion = "todas"; campos = grupos[i]; }
                else {
                    accion = normalizarAccion(grupos[i].substring(0, corte));
                    campos = grupos[i].substring(corte + 1);
                }
                salida[accion] = (salida[accion] || []).concat(separarLista(campos));
            }
            return salida;
        }

        function analizarAcciones(texto) {
            var lista = separarLista(texto), salida = {}, i, nombre;
            for (i = 0; i < lista.length; i++) {
                nombre = normalizarAccion(lista[i]);
                if (nombre !== "") salida[nombre] = true;
            }
            return salida;
        }

        function seccionPorId(destino, id) {
            var lista = destino.secciones || [], i;
            for (i = 0; i < lista.length; i++) {
                if (lista[i].id === id) return lista[i];
            }
            return null;
        }

        function analizar(texto) {
            var modelo = {
                tabla: "", titulo: "", subtitulo: "",
                secciones: [], ocultos: [], acciones: [], mapeo: [], mapeoGrabar: [], mapeoObtener: [],
                mapeoEliminar: [], consultaDevuelve: "grilla",
                /* Todos los campos en el orden en que aparecen en el archivo,
                   ocultos incluidos. 'secciones' y 'ocultos' sirven para
                   dibujar; 'todos' para setear y leer por posición. */
                todos: [],
                grilla: null,
                /* Las secciones y acciones que van dentro de la ventana de
                   mantenimiento, para no mezclarlas con la pantalla principal. */
                popup: null,
                /* La grilla editable de la ventana de mantenimiento. */
                detalle: null,
                /* Una definición por lupa, en el orden en que el paquete manda
                   las ayudas del segmento 2. */
                ayudas: []
            };
            var lineas = String(texto || "").split(SEPARADOR_REGISTRO);
            var nLineas = lineas.length;
            var seccionActual = null;
            /* A partir de una línea 'popup', todo lo que sigue pertenece a la
               ventana de mantenimiento. Un solo interruptor, fácil de leer en
               el txt y de analizar aquí. */
            var destino = modelo;
            var i, linea, registro, a, seccion;

            for (i = 0; i < nLineas; i++) {
                linea = lineas[i].replace(/^\s+|\s+$/g, "");
                if (linea === "" || linea.charAt(0) === "#") continue;

                registro = analizarRegistro(linea);
                a = registro.atributos;

                if (registro.tipo === "pantalla") {
                    modelo.tabla = a.tabla || "";
                    modelo.titulo = a.titulo || "";
                    modelo.subtitulo = a.subtitulo || "";
                } else if (registro.tipo === "grilla") {
                    modelo.grilla = {
                        columnas: analizarColumnas(a.columnas),
                        porPagina: a.porPagina ? Number(a.porPagina) : 10,
                        filtros: a.filtros !== "no",
                        combos: analizarCombos(a.combos),
                        /* pk: con qué campos se identifica una fila al pedirla
                           con Obtener o al borrarla. Sin esto se usaría el
                           primero del mapeo.
                           uk: los campos que no se pueden repetir entre filas.
                           Se comprueban antes de mandar, para no ir al servidor
                           a que Oracle devuelva un ORA-00001. */
                        pk: separarLista(a.pk || a.llave),
                        /* Campo que identifica a la fila cuando hay que
                           nombrarla en un mensaje, p. ej. al eliminar. */
                        rotulo: a.rotulo || "",
                        uk: separarLista(a.uk),
                        archivo: a.archivo || "",
                        /* Campo de la pantalla principal cuyo valor viaja al
                           paquete como filtro. Lo usan las tablas grandes,
                           donde traer todo no es una opción. */
                        filtro: a.filtro || "",
                        /* Cuántas filas por viaje. Solo tiene sentido en las
                           tablas grandes; sin esto se trae todo de una vez. */
                        bloque: a.bloque ? Number(a.bloque) : 0,
                        editables: analizarEditables(a.editables),
                        totales: analizarTotales(a.totales),
                        acciones: analizarAcciones(a.acciones)
                    };
                } else if (registro.tipo === "detalle") {
                    /* uk:     columnas que no se pueden repetir entre líneas.
                       enviar:  qué campos viajan al grabar. Lo que no está
                               declarado se muestra pero no se manda, porque el
                               paquete ya lo tiene en la base. */
                    /* La grilla que va DENTRO de la ventana de mantenimiento:
                       los conceptos del trabajador, las cuotas de un préstamo,
                       lo que la pantalla necesite editar de a varios.
                       Se declara igual que la grilla principal y admite además
                       'editables=' y 'totales='. */
                    modelo.detalle = {
                        titulo: a.titulo || "Detalle",
                        columnas: analizarColumnas(a.columnas),
                        porPagina: a.porPagina ? Number(a.porPagina) : 0,
                        filtros: a.filtros === "si",
                        combos: analizarCombos(a.combos),
                        editables: analizarEditables(a.editables),
                        totales: analizarTotales(a.totales),
                        uk: analizarTotales(a.uk),
                        enviar: separarLista(a.enviar),
                        acciones: analizarAcciones(a.acciones),
                        mapeo: separarLista(a.campos)
                    };
                } else if (registro.tipo === "ayuda") {
                    /* 'destino' se llena en cuanto el usuario elige una fila:
                       columna 0 al primer campo, columna 1 al segundo. */
                    modelo.ayudas.push({
                        titulo: a.titulo || "Búsqueda",
                        ancho: a.ancho || "720",
                        porPagina: a.porPagina ? Number(a.porPagina) : 10,
                        columnas: analizarColumnas(a.columnas),
                        destino: separarLista(a.destino)
                    });
                } else if (registro.tipo === "popup") {
                    modelo.popup = {
                        titulo: a.titulo || "Mantenimiento",
                        ancho: a.ancho || "640",
                        /* Qué campos quedan bloqueados según con qué acción se
                           abre la ventana. Lo decide la pantalla, no el JS. */
                        deshabilitar: analizarPorAccion(a.deshabilitar),
                        secciones: [], ocultos: [], acciones: [], todos: []
                    };
                    destino = modelo.popup;
                    seccionActual = null;
                } else if (registro.tipo === "seccion") {
                    seccionActual = { id: a.id || "", titulo: a.titulo || "",
                              descripcion: a.descripcion || "", campos: [], acciones: [] };
                    destino.secciones.push(seccionActual);
                } else if (registro.tipo === "campo") {
                    /* El orden del archivo se respeta aunque un oculto quede
                       entre dos visibles: es el orden en que el paquete manda
                       el registro y en el que hay que asignarlo. */
                    destino.todos.push(a);
                    if (a.tipo === "oculto") destino.ocultos.push(a);
                    else if (seccionActual) seccionActual.campos.push(a);
                } else if (registro.tipo === "accion") {
                    /* Qué devuelve la consulta de esta pantalla. Por omisión
                       solo las filas de la grilla, que es lo que hace un
                       Consultar: refrescar la lista. Con 'devuelve=todo' se
                       espera la misma respuesta de la carga -combos, filas,
                       ayudas y valores por omisión-, para una pantalla donde
                       consultar también cambia lo que ofrecen los
                       desplegables o las lupas. */
                    if (a.accion === "consultar") {
                        modelo.consultaDevuelve = (a.devuelve === "todo") ? "todo" : "grilla";
                    }
                    /* 'ubicacion=' pone el botón dentro de una sección en vez
                       de la barra del pie. Es lo que quiere un Consultar: va
                       al lado de los campos con que se consulta, no al final
                       de la pantalla, debajo de la lista que acaba de traer. */
                    seccion = a.ubicacion ? seccionPorId(destino, a.ubicacion) : null;
                    if (seccion) seccion.acciones.push(a);
                    else destino.acciones.push(a);
                } else if (registro.tipo === "mapeo") {
                    /* Dos órdenes distintos: el que devuelve listar y el que
                       espera gestionar. Si solo se declara uno, sirve para las
                       dos cosas. */
                    if (a.origen === "grabar") { modelo.mapeoGrabar = separarLista(a.campos); continue; }
                    /* Obtener puede devolver el registro en otro orden que la
                       grilla: el suyo es el de los controles del popup. */
                    if (a.origen === "obtener") { modelo.mapeoObtener = separarLista(a.campos); continue; }
                    /* Para dar de baja no hace falta la ficha entera: alcanza
                       con señalar cuál es el registro. Si el paquete necesita
                       algo más -una secuencia, un motivo- se declara aquí; si
                       no se declara, viaja la pk y nada más. */
                    if (a.origen === "eliminar") { modelo.mapeoEliminar = separarLista(a.campos); continue; }
                    /* Orden en que el procedimiento almacenado devuelve los
                       campos de un registro. Es lo único que traduce la trama
                       posicional de Oracle a los nombres de la pantalla; al
                       estar aquí, junto a los campos, se mantiene a la vista. */
                    modelo.mapeo = separarLista(a.campos);
                }
            }
            return modelo;
        }

        /* ------------------------------------------------ 2. construir ---- */

        /* Un único ayudante para crear nodos: el texto entra por textContent,
           así que no hay concatenación de HTML ni nada que escapar a mano.   */
        function elemento(tag, atributos, texto) {
            var nodo = document.createElement(tag);
            var claves, nClaves, i, valor;

            if (atributos) {
                claves = Object.keys(atributos);
                nClaves = claves.length;
                for (i = 0; i < nClaves; i++) {
                    valor = atributos[claves[i]];
                    if (valor !== undefined && valor !== null && valor !== "") {
                        nodo.setAttribute(claves[i], valor);
                    }
                }
            }
            if (texto !== undefined && texto !== null && texto !== "") nodo.textContent = texto;
            return nodo;
        }

        function idControl(campo) {
            return (PREFIJOS[campo.tipo] || "txt") + (campo.id || "");
        }

        function clasesDato(campo, tabla) {
            /* G+tabla la usa obtenerDatos; R+tabla marca lo requerido. */
            var clases = "control G" + tabla;
            if (campo.requerido === "si") clases += " R" + tabla;
            return clases;
        }

        function esAnchoValido(ancho) {
            var i;
            for (i = 0; i < NANCHOS; i++) {
                if (ANCHOS[i] === ancho) return true;
            }
            return false;
        }

        /* Tabla de constructores: agregar un tipo de control es agregar una
           entrada, no editar un switch de doscientas líneas.                 */
        var CONSTRUCTORES = {
            /* Una cantidad. Es una caja de texto y no un <input type=number>:
               ese acepta que se teclee el signo, el punto y la 'e' de la
               notación científica, y cuando el resultado no es un número
               válido devuelve la cadena vacía. Es decir, el usuario ve '1e5'
               escrito y el aplicativo lee "" -no hay forma de limpiar lo que
               no se puede leer-. Con una caja de texto, lo que se ve es lo que
               hay, y la ventana le quita al vuelo lo que no sea una cifra.
               'inputmode' hace que en un equipo táctil salga el teclado
               numérico igual que antes. */
            number: function (campo, tabla) {
                return elemento("input", {
                    type: "text", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla) + " Derecha",
                    inputmode: "numeric",
                    maxlength: campo.largo,
                    "data-tipo": campo.decimales === "si" ? "decimal" : "entero",
                    "data-minimo": campo.min,
                    "data-maximo": campo.max,
                    "data-default": campo.valor
                });
            },
            text: function (campo, tabla) {
                return elemento("input", {
                    type: "text", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla),
                    maxlength: campo.largo, placeholder: campo.marcador,
                    readonly: campo.soloLectura === "si" ? "readonly" : null,
                    "data-default": campo.valor
                });
            },
            textarea: function (campo, tabla) {
                return elemento("textarea", {
                    id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla),
                    rows: campo.filas || "3", maxlength: campo.largo,
                    placeholder: campo.marcador,
                    "data-default": campo.valor
                });
            },
            fecha: function (campo, tabla) {
                return elemento("input", {
                    type: "date", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla), min: campo.min, max: campo.max
                });
            },
            checkbox: function (campo, tabla) {
                return elemento("input", {
                    type: "checkbox", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla), value: campo.valor || "1"
                });
            },
            select: function (campo, tabla) {
                var caja = elemento("select", {
                    id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla), "data-cbotipo": campo.origen,
                    /* Sin esto, limpiar dejaba el desplegable en blanco y el
                       'No' que declara el txt no llegaba a verse nunca. */
                    "data-default": campo.valor
                });
                var fijas = separarLista(campo.opciones), i, partes, opcion;

                /* 'opciones=N:No,S:Sí' fija la lista en el propio txt. Es para
                   las que no salen de ninguna tabla -un sí o un no-: pedirlas
                   al paquete sería un viaje entero para traer dos filas que
                   nunca cambian. Las demás siguen llegando con 'lista='. */
                for (i = 0; i < fijas.length; i++) {
                    partes = fijas[i].split(":");
                    opcion = elemento("option", { value: partes[0] },
                                      partes.length > 1 ? partes[1] : partes[0]);
                    if (partes[0] === campo.valor) opcion.setAttribute("selected", "selected");
                    caja.appendChild(opcion);
                }
                return caja;
            },
            oculto: function (campo, tabla) {
                return elemento("input", {
                    type: "hidden", id: idControl(campo), name: campo.id,
                    "class": "G" + tabla,
                    /* value además de data-default: si no, el oculto nace
                       vacío y el valor de la plantilla recién aparecía al
                       cancelar. */
                    value: campo.valor,
                    "data-default": campo.valor
                });
            },
            /* Desplegable de selección múltiple. Debajo hay un <select
               multiple> corriente -oculto- para que el resto de la librería lo
               trate como a cualquier otro: el paquete lo llena con 'lista=',
               'limpiar' lo vacía y la trama lo lee de ahí. Encima se dibujan la
               caja del resumen y el panel de casillas, que es lo que el
               usuario ve.

               No se usa el <select multiple> a la vista porque obliga a
               arrastrar con la tecla control, y en una lista de veinte
               oficinas eso no se acierta. */
            multi: function (campo, tabla) {
                var caja = elemento("div", { "class": "multi", id: "mul" + campo.id });

                caja.appendChild(elemento("select", {
                    id: idControl(campo), name: campo.id, multiple: "multiple",
                    "class": clasesDato(campo, tabla) + " multi__real",
                    "data-vacio": campo.marcador || "Todos",
                    "data-default": campo.valor
                }));
                return caja;
            },
            /* Una cantidad de horas escrita hh:mm. Es una caja de texto y no
               un <input type="time"> porque lo que se registra no es un
               momento del día sino tiempo acumulado: una cuota de 42017:00
               horas es normal, y el control de tiempo se corta en 23:59. */
            hora: function (campo, tabla) {
                /* 'digitos' es cuántas cifras admite la parte de las horas; el
                   largo del control sale de ahí más los dos puntos y los dos
                   dígitos de los minutos. Con digitos=5 caben 99999:59. */
                var digitos = Number(campo.digitos || 5);

                if (isNaN(digitos) || digitos < 1) digitos = 5;
                return elemento("input", {
                    type: "text", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla) + " Derecha",
                    maxlength: String(digitos + 3),
                    placeholder: campo.marcador || "hh:mm",
                    /* El filtro de teclas y la validación los aplica la propia
                       ventana leyendo estos dos: así la regla se declara una
                       sola vez, en el txt. */
                    "data-tipo": "hora",
                    "data-digitos": String(digitos),
                    "data-default": campo.valor
                });
            },
            /* Del adjunto solo viaja el nombre del documento; el archivo se
               sube aparte. Son tres controles: la caja que lo muestra, el
               botón visible y el input real, que queda oculto. */
            adjunto: function (campo, tabla) {
                var caja = elemento("div", { "class": "campo__archivo" });

                caja.appendChild(elemento("input", {
                    type: "text", id: "txt" + campo.id, name: campo.id,
                    "class": clasesDato(campo, tabla), readonly: "readonly",
                    placeholder: campo.marcador || "Ningún documento adjunto",
                    "data-default": campo.valor
                }));
                caja.appendChild(elemento("button", {
                    type: "button", id: "btnArchivo" + campo.id,
                    "class": "boton boton--secundario",
                    "data-abrir": "fup" + campo.id
                }, "Examinar…"));
                caja.appendChild(elemento("input", {
                    type: "file", id: "fup" + campo.id, name: "fup" + campo.id,
                    "class": "campo__archivo-real",
                    accept: campo.acepta || ".pdf,.doc,.docx,.xls,.xlsx"
                }));
                return caja;
            },
            /* El archivo son tres controles: la caja que muestra el nombre, el
               botón visible y el input real, que queda oculto.                */
            archivo: function (campo, tabla) {
                var caja = elemento("div", { "class": "campo__archivo" });
                caja.appendChild(elemento("input", {
                    type: "text", id: "txt" + campo.id, name: campo.id,
                    "class": clasesDato(campo, tabla), readonly: "readonly",
                    placeholder: "Ningún archivo seleccionado"
                }));
                caja.appendChild(elemento("button", {
                    type: "button", id: "btnArchivo" + campo.id,
                    "class": "boton boton--secundario",
                    "data-abrir": "fup" + campo.id
                }, "Examinar…"));
                caja.appendChild(elemento("input", {
                    type: "file", id: "fup" + campo.id, name: "fup" + campo.id,
                    "class": "campo__archivo-real", accept: campo.acepta
                }));
                return caja;
            }
        };

        /* Un campo lleva lupa cuando declara con qué ayuda se busca:
           'lupa=0' es la primera ayuda que manda el paquete. */
        function tieneLupa(campo) {
            return campo.lupa !== undefined && campo.lupa !== "";
        }

        /* El icono es un SVG y no un carácter: '🔍' se ve distinto en cada
           equipo y en Chrome 49 sobre Windows 7 sale en blanco y negro. */
        function construirLupa(campo) {
            var boton = elemento("button", {
                type: "button", "class": "campo__lupa",
                id: "lup" + campo.id, title: "Buscar",
                "data-accion": "buscar", "data-lupa": campo.id,
                "data-ayuda": campo.lupa
            });
            var dibujo = (typeof Grilla !== "undefined" && Grilla.icono) ? Grilla.icono("buscar", 16) : null;

            if (dibujo) boton.appendChild(dibujo);
            else boton.appendChild(document.createTextNode("Buscar"));
            return boton;
        }

        /* Cuántos caracteres admite el campo para el contador. 'contador=250'
           fija el tope a mano; 'contador=si' toma el 'largo', que es el mismo
           que ya limita la caja. Sin 'contador' no se dibuja nada: hay campos
           cortos donde el número sobra. */
        function topeContador(campo) {
            var declarado = campo.contador;
            if (!declarado) return 0;
            if (declarado === "si") return Number(campo.largo || 0);
            return isNaN(Number(declarado)) ? 0 : Number(declarado);
        }

        function construirContador(campo) {
            var caja = elemento("p", { "class": "campo__contador", id: "cnt" + campo.id });
            caja.appendChild(elemento("span", { "class": "campo__contador-usado" }, "0"));
            caja.appendChild(document.createTextNode(" / " + topeContador(campo)));
            return caja;
        }

        function construirCampo(campo, tabla) {
            var ancho = esAnchoValido(campo.ancho) ? campo.ancho : "medio";
            var bloque = elemento("div", { "class": "campo campo--" + ancho, "data-campo": campo.id });
            var etiqueta = elemento("label", { "class": "campo__etiqueta", "for": idControl(campo) }, campo.etiqueta);
            var control = elemento("div", { "class": "campo__control" });
            var constructor = CONSTRUCTORES[campo.tipo] || CONSTRUCTORES.text;

            if (campo.requerido === "si") {
                etiqueta.appendChild(elemento("span", { "class": "campo__obligatorio", title: "Obligatorio" }, "*"));
            }
            bloque.appendChild(etiqueta);

            /* 'visible=no' hace que el campo nazca escondido. No es lo mismo
               que 'tipo=oculto': ese es un input que nunca se ve; este es un
               campo normal -con su rótulo, su ayuda y su validación- que la
               pantalla muestra cuando corresponde. Así el txt sigue diciendo
               qué campos hay y el JS solo decide cuándo. */
            if (campo.visible === "no") bloque.hidden = true;

            control.appendChild(constructor(campo, tabla));
            /* También en el control: 'revisarCampo' salta los escondidos, así
               que un campo que todavía no se muestra no exige llenarse. */
            if (campo.visible === "no") control.firstChild.hidden = true;
            if (campo.unidad) control.appendChild(elemento("span", { "class": "campo__unidad" }, campo.unidad));
            if (tieneLupa(campo)) {
                control.className = "campo__control campo__control--conLupa";
                control.appendChild(construirLupa(campo));
            }
            bloque.appendChild(control);

            if (topeContador(campo) > 0) bloque.appendChild(construirContador(campo));
            /* La ayuda lleva id: hay pantallas que la reescriben según el
               estado del campo -T01 explica ahí por qué los meses están
               apagados- y sin id habría que buscarla por la forma del DOM. */
            if (campo.ayuda) {
                bloque.appendChild(elemento("p", { "class": "campo__ayuda", id: "ayu" + campo.id }, campo.ayuda));
            }
            bloque.appendChild(elemento("p", { "class": "campo__error", id: "err" + campo.id }));

            return bloque;
        }

        function construirSeccion(seccion, tabla) {
            var bloque = elemento("section", { "class": "seccion", id: "sec" + seccion.id });
            var campos = elemento("div", { "class": "seccion__campos" });
            var i;

            bloque.appendChild(elemento("h2", { "class": "seccion__titulo" }, seccion.titulo));
            if (seccion.descripcion) {
                bloque.appendChild(elemento("p", { "class": "seccion__descripcion" }, seccion.descripcion));
            }
            var nSeccion = seccion.campos.length;
            for (i = 0; i < nSeccion; i++) {
                campos.appendChild(construirCampo(seccion.campos[i], tabla));
            }

            /* Los botones que la sección declara van al final de su fila de
               campos, alineados con ellos: un Consultar pertenece a los campos
               con que se consulta. */
            nSeccion = (seccion.acciones || []).length;
            for (i = 0; i < nSeccion; i++) {
                campos.appendChild(botonDeSeccion(seccion.acciones[i], tabla));
            }

            bloque.appendChild(campos);
            return bloque;
        }

        function botonDeSeccion(accion, tabla) {
            var caja = elemento("div", { "class": "campo campo--boton" });

            /* La etiqueta va vacía pero presente: así el botón queda a la
               misma altura que los controles que tiene al lado, en vez de
               subirse a la línea de los rótulos. */
            caja.appendChild(elemento("label", { "class": "campo__etiqueta" }, " "));
            caja.appendChild(elemento("button", {
                type: "button", id: "btn" + accion.id + tabla,
                "class": "boton boton--" + (accion.estilo || "secundario"),
                "data-accion": accion.accion || ""
            }, accion.etiqueta));
            return caja;
        }

        function construir(modelo) {
            var tabla = modelo.tabla;
            var fragmento = document.createDocumentFragment();
            var cabecera = elemento("div", { "class": "pantalla__cabecera" });
            var cuerpo = elemento("div", { "class": "pantalla__cuerpo" });
            var pie = elemento("div", { "class": "pantalla__acciones" });
            var botones = elemento("div", { "class": "pantalla__botones" });
            var i, accion;

            cabecera.appendChild(elemento("h1", { "class": "pantalla__titulo", id: "hTituloPantalla" + tabla }, modelo.titulo));
            if (modelo.subtitulo) {
                cabecera.appendChild(elemento("p", { "class": "pantalla__subtitulo" }, modelo.subtitulo));
            }
            fragmento.appendChild(cabecera);

            /* Los campos de la pantalla principal van ARRIBA de la grilla:
               son con qué se pide la lista -el periodo, la oficina- y leerlos
               después del resultado no tendría sentido. */
            var nModelo = modelo.secciones.length;
            for (i = 0; i < nModelo; i++) {
                cuerpo.appendChild(construirSeccion(modelo.secciones[i], tabla));
            }

            /* La grilla solo necesita su contenedor: el módulo Grilla arma
               dentro la barra, la tabla, los filtros y la paginación. */
            if (modelo.grilla) {
                cuerpo.appendChild(elemento("div", { "class": "gPrincipal", id: "gPri" + tabla }));
            }

            nModelo = modelo.ocultos.length;
            for (i = 0; i < nModelo; i++) {
                cuerpo.appendChild(CONSTRUCTORES.oculto(modelo.ocultos[i], tabla));
            }
            fragmento.appendChild(cuerpo);

            /* La barra de acciones de la pantalla principal solo tiene sentido
               cuando esta edita directamente; con grilla, las acciones viven en
               la ventana de mantenimiento. */
            if (modelo.acciones.length > 0 || !modelo.popup) {
                pie.appendChild(elemento("span", { "class": "MensajeError", id: "spnValida" + tabla }));
                pie.appendChild(elemento("span", { "class": "pantalla__cambios", id: "spnCambios" + tabla }, "Hay cambios sin guardar."));
                nModelo = modelo.acciones.length;
                for (i = 0; i < nModelo; i++) {
                    accion = modelo.acciones[i];
                    botones.appendChild(elemento("button", {
                        type: "button", id: "btn" + accion.id + tabla,
                        "class": "boton boton--" + (accion.estilo || "secundario"),
                        "data-accion": accion.accion || ""
                    }, accion.etiqueta));
                }
                pie.appendChild(botones);
                fragmento.appendChild(pie);
            }

            if (modelo.popup) fragmento.appendChild(construirPopup(modelo));

            return fragmento;
        }

        /* Ventana de mantenimiento: mismo velo y misma caja que el diálogo de
           mensajes, para que las dos se vean de la misma familia. */
        function construirPopup(modelo) {
            var tabla = modelo.tabla;
            var popup = modelo.popup;
            var velo = elemento("div", { "class": "velo", id: "divVelo" + tabla });
            var ventana = elemento("div", { "class": "ventana", role: "dialog" });
            var barra = elemento("div", { "class": "ventana__barra" });
            var cuerpo = elemento("div", { "class": "ventana__cuerpo" });
            var pie = elemento("div", { "class": "ventana__pie" });
            var cerrar = elemento("button", { type: "button", "class": "ventana__cerrar", title: "Cerrar", "data-accion": "cerrar" }, "×");
            var i, n, accion;

            ventana.style.maxWidth = popup.ancho + "px";

            barra.appendChild(elemento("span", { "class": "ventana__titulo", id: "spnBarraTitulo" + tabla }, popup.titulo));
            barra.appendChild(cerrar);

            n = popup.secciones.length;
            for (i = 0; i < n; i++) cuerpo.appendChild(construirSeccion(popup.secciones[i], tabla));
            n = popup.ocultos.length;
            for (i = 0; i < n; i++) cuerpo.appendChild(CONSTRUCTORES.oculto(popup.ocultos[i], tabla));

            /* El detalle va después de las secciones y antes de los botones:
               primero quién, después qué. */
            if (modelo.detalle) {
                cuerpo.appendChild(construirBarraDetalle(modelo.detalle, tabla));
                cuerpo.appendChild(elemento("div", { "class": "gDetalle", id: "gDet" + tabla }));
            }

            pie.appendChild(elemento("span", { "class": "MensajeError", id: "spnValida" + tabla }));
            n = popup.acciones.length;
            for (i = 0; i < n; i++) {
                accion = popup.acciones[i];
                pie.appendChild(elemento("button", {
                    type: "button", id: "btn" + accion.id + tabla,
                    "class": "boton boton--" + (accion.estilo || "secundario"),
                    "data-accion": accion.accion || ""
                }, accion.etiqueta));
            }

            ventana.appendChild(barra);
            ventana.appendChild(cuerpo);
            ventana.appendChild(pie);
            velo.appendChild(ventana);
            return velo;
        }

        function construirBarraDetalle(detalle, tabla) {
            var barra = elemento("div", { "class": "detalle__barra" });
            barra.appendChild(elemento("span", { "class": "detalle__titulo" }, detalle.titulo));
            barra.appendChild(elemento("span", { "class": "detalle__cuenta", id: "spnDet" + tabla }));
            return barra;
        }

        /* ------------------------------------------------ 3. enlazar ------ */

        /* Deja en la caja solo lo que puede ser una hora: cifras, un único
           par de puntos, hasta 'digitos' en las horas y dos en los minutos.
           Se respeta el cursor -se reescribe solo si algo cambió- para no
           mandarlo al final en mitad de una corrección. */
        function limpiarHora(caja) {
            var digitos = Number(caja.getAttribute("data-digitos") || 5);
            var crudo = String(caja.value);
            var solo = crudo.replace(/[^0-9:]/g, "");
            var partes = solo.split(":");
            var horas = partes[0].substring(0, digitos);
            var limpio;

            if (partes.length === 1) limpio = horas;
            else limpio = horas + ":" + partes.slice(1).join("").substring(0, 2);

            if (limpio !== crudo) caja.value = limpio;
        }

        /* Deja en una caja de número solo lo que puede ser un número: cifras,
           el signo menos si el campo admite negativos y un punto decimal si es
           decimal. El navegador deja escribir 'e', '+' y varios puntos en un
           <input type=number> y después devuelve la cadena vacía, así que sin
           esto el usuario ve lo que escribió y el aplicativo no recibe nada. */
        function limpiarNumero(caja) {
            var tipo = caja.getAttribute("data-tipo");
            var crudo, limpio, negativo, partes;

            if (tipo !== "entero" && tipo !== "decimal") return;
            crudo = String(caja.value);
            if (crudo === "") return;

            negativo = crudo.charAt(0) === "-" && Number(caja.getAttribute("data-minimo")) < 0;
            limpio = crudo.replace(/[^0-9.]/g, "");
            if (tipo === "entero") limpio = limpio.replace(/\./g, "");
            else {
                /* Un solo punto: el primero manda y los demás se descartan. */
                partes = limpio.split(".");
                if (partes.length > 1) limpio = partes[0] + "." + partes.slice(1).join("");
            }
            if (negativo) limpio = "-" + limpio;

            if (limpio !== crudo) caja.value = limpio;
        }

        function nodoConAtributo(nodo, atributo, tope) {
            var actual = nodo;
            while (actual && actual !== tope) {
                if (actual.getAttribute && actual.getAttribute(atributo) !== null) return actual;
                actual = actual.parentNode;
            }
            return null;
        }

        function enlazar(raiz, modelo, controlador) {
            /* Un solo manejador de clic para toda la ventana. */
            raiz.onclick = function (evento) {
                var e = evento || window.event;
                var origen = e.target || e.srcElement;
                var abridor = nodoConAtributo(origen, "data-abrir", raiz);
                var entrada, boton, accion;

                if (abridor) {
                    entrada = document.getElementById(abridor.getAttribute("data-abrir"));
                    if (entrada) entrada.click();
                    return;
                }

                boton = nodoConAtributo(origen, "data-accion", raiz);
                if (!boton) return;
                accion = boton.getAttribute("data-accion");
                /* Sin tercer argumento: las acciones de la pantalla no traen
                   fila. Antes iba el controlador y llegaba como si fuera una.
                   La lupa es la excepción: tiene que decir a qué campo vuelve
                   lo que el usuario elija. */
                Ventana.ejecutarAccion(accion, modelo, boton.getAttribute("data-lupa") || undefined);
            };

            /* Marca la pantalla como modificada y revalida el campo que ya
               estaba en rojo, para que el mensaje se borre al corregirlo.
               Antes esto vivía en el archivo de cada pantalla. */
            raiz.oninput = function (evento) {
                var e = evento || window.event;
                var origen = e.target || e.srcElement;
                var bloque;

                if (!origen || !origen.getAttribute) return;
                /* Una cantidad hh:mm solo admite cifras y un par de puntos. Se
                   limpia mientras se escribe y no al grabar: el control es de
                   texto -no de número, que se corta en 23:59- y sin esto
                   entraban el signo menos y la 'e' de la notación científica,
                   que Oracle recibe como una hora imposible. */
                if (origen.getAttribute("data-tipo") === "hora") limpiarHora(origen);
                else limpiarNumero(origen);
                bloque = nodoConAtributo(origen, "data-campo", raiz);
                if (!bloque) return;

                Ventana.marcarCambios(modelo.tabla, true);
                Formulario.refrescarContadores(modelo.tabla, bloque.getAttribute("data-campo"));
                if ((" " + bloque.className + " ").indexOf(" campo--error ") !== -1) {
                    Ventana.validarCampo(modelo.tabla, bloque.getAttribute("data-campo"));
                }
            };

            /* Al elegir un archivo, su nombre se muestra en la caja de texto. */
            raiz.onchange = function (evento) {
                var e = evento || window.event;
                var origen = e.target || e.srcElement;
                var caja, nArchivos;

                if (!origen || origen.type !== "file") return;
                caja = document.getElementById("txt" + origen.id.substring(3));
                if (!caja) return;
                /* origen, no orige; y la cantidad se lee después de comprobar
                   que la lista existe, porque en Chrome 49 files puede venir
                   nula si el usuario cancela el diálogo. */
                nArchivos = origen.files ? origen.files.length : 0;
                caja.value = nArchivos > 0 ? origen.files[0].name : "";
            };
        }

        /* --------------------------------------------------- entrada ------ */

        /* Construir es una cosa y llenar es otra. Aquí solo se arma el marcado
           con sus estilos; los datos no se piden hasta que esto termina, y por
           eso 'crear' avisa con alConcluir en lugar de que la pantalla suponga
           que ya está lista. */
        function crear(texto, controlador, tabla, tipoVentana, alConcluir) {
            var contenedor = document.getElementById("div" + (tipoVentana || "PantPri"));
            var modelo;

            if (!contenedor) return null;

            modelo = analizar(texto);
            if (!modelo.tabla) modelo.tabla = tabla || "";
            /* Queda en el modelo para que cargar y grabar sepan a qué
               controlador pedirle, sin que la pantalla lo repita. */
            modelo.controlador = controlador || "SAHE";
            /* Quien llene después necesita saber dónde quedó la pantalla. */
            modelo.contenedor = contenedor;

            contenedor.innerHTML = "";
            contenedor.className = "pantalla";
            contenedor.appendChild(construir(modelo));

            /* El modelo queda registrado ANTES de enlazar: los manejadores lo
               consultan para validar y para armar la trama. */
            Ventana.registrarModelo(modelo);
            enlazar(contenedor, modelo, controlador);

            /* Los multicombos se arman ahora y no al construir el campo: se
               buscan por id, y hasta este momento el marcado vivía en un
               fragmento suelto que no está en el documento. */
            armarMulticombos(modelo);

            if (modelo.grilla) armarGrilla(modelo);
            if (modelo.detalle) armarDetalle(modelo);

            concluir(modelo, alConcluir);
            return modelo;
        }

        /* Aquí termina la creación: el marcado ya está en el documento, los
           manejadores enlazados y la rejilla armada, aunque vacía. Se avisa en
           el siguiente cuadro para que el navegador alcance a aplicar los
           estilos y medir las columnas; recién entonces tiene sentido pedirle
           los datos al servidor. */
        function concluir(modelo, alConcluir) {
            modelo.contenedor.className = "pantalla pantalla--cargando";
            if (typeof alConcluir !== "function") {
                modelo.contenedor.className = "pantalla";
                return;
            }
            enCuadro(function () { alConcluir(modelo); });
        }

        /* Espera a que el navegador dibuje el cuadro, pero sin depender de que
           lo dibuje: requestAnimationFrame no se ejecuta si la pestaña está en
           segundo plano o el iframe oculto, y entonces la pantalla se quedaría
           construida y vacía para siempre. El temporizador es la red: corre el
           primero que llegue y el otro ya no hace nada. */
        function enCuadro(fn) {
            var hecho = false;

            function unaVez() {
                if (hecho) return;
                hecho = true;
                fn();
            }

            if (typeof window.requestAnimationFrame === "function") {
                window.requestAnimationFrame(unaVez);
            }
            window.setTimeout(unaVez, 30);
        }

        /* La grilla se crea con lo que declara la plantilla y avisa por una
           sola función: la pantalla no tiene que conocer al módulo. */
        function armarMulticombos(modelo) {
            var listas = [modelo.todos, modelo.popup ? modelo.popup.todos : []];
            var i, j, campos;

            for (i = 0; i < listas.length; i++) {
                campos = listas[i] || [];
                for (j = 0; j < campos.length; j++) {
                    if (campos[j].tipo === "multi") MultiCombo.armar(campos[j].id);
                }
            }
        }

        function armarGrilla(modelo) {
            var contenedor = document.getElementById("gPri" + modelo.tabla);
            if (!contenedor || typeof Grilla === "undefined") return;

            /* Quién puede hacer qué NO lo decide la plantilla: lo decide el
               perfil, que llega en hdfTabla desde el menú. Lo que declara el
               txt es el tope -qué acciones tiene sentido ofrecer en esta
               pantalla- y de ahí se toma la intersección. */

            modelo.grilla.alAccionar = function (accion, fila) {

                else avisarSinPermiso("Agregar Detalle", "RD");

    /* Punto de entrada único: construye la pantalla a partir de su plantilla

    Ventana.crear = function (datosControles, controlador, tabla, tipoVentana, alConcluir) {

            Ventana.registrar("La plantilla de " + tabla + " no está en formato de campos nombrados.");

        }

            if (origen.todos && origen.todos.length > 0) {
                for (i = 0; i < origen.todos.length; i++) lista.push(origen.todos[i]);

            /* Los códigos marcados, separados por coma. Vacío es 'todos'. */
            if (campo.tipo === "multi") return MultiCombo.valor(elemento);

                for (i = 0; i < mapeo.length && i < n; i++) {

                }

               valorDeControl como 'S/R' -es decir, lleno-, y con eso el
               'requerido=si' no llegaba a saltar nunca. */
            valor = String(valorEscrito(elemento, campo)).replace(/^\s+|\s+$/g, "");

            if (campo.requerido === "si" && valor === "") return "Este dato es obligatorio.";
            if (valor === "") return "";

            if (campo.tipo === "number") {
                numero = Number(valor);
                if (isNaN(numero)) return "Ingrese un número.";
                if (campo.decimales !== "si" && numero !== Math.round(numero)) {
                    return "Ingrese un número entero.";
                }
                minimo = campo.min;
                maximo = campo.max;
                if (minimo !== undefined && minimo !== "" && numero < Number(minimo)) {
                    return "El valor mínimo es " + minimo + ".";
                }
                if (maximo !== undefined && maximo !== "" && numero > Number(maximo)) {
                    return "El valor máximo es " + maximo + ".";
                }
            }

            if (campo.tipo === "fecha" && isNaN(Date.parse(valor))) return "La fecha no es válida.";
            if (campo.tipo === "hora") {
                return Grilla.hora.revisar(elemento.value, elemento.getAttribute("data-digitos"),
                                           campo.requerido === "si");
            }
            if (campo.tipo === "archivo") return revisarArchivo(campo);

            largo = campo.largo;
            if (largo !== undefined && largo !== "" && valor.length > Number(largo)) {
                return "No puede superar los " + largo + " caracteres.";
            }
            return "";
        }

        function validarUno(tabla, id) {
            var campo = campoPorId(tabla, id), mensaje;
            if (!campo) return true;
            mensaje = revisarCampo(campo);
            marcarError(campo, mensaje);
            return mensaje === "";
        }

        /* Marca todos los campos con problema, deja el foco en el primero y
           resume en el renglón de la barra de acciones. */
        function validar(tabla) {
            var lista = campos(tabla), i, n = lista.length, campo, mensaje;
            var errores = 0, primero = null;

            for (i = 0; i < n; i++) {
                campo = lista[i];
                mensaje = revisarCampo(campo);
                marcarError(campo, mensaje);
                if (mensaje !== "") {
                    errores++;
                    if (!primero) primero = campo;
                }
            }

            if (errores === 0) {
                avisar(tabla, "", "");
                return true;
            }
            if (primero && control(primero)) control(primero).focus();
            avisar(tabla, "E", errores === 1
                ? "Revise el dato marcado en rojo."
                : "Revise los " + errores + " datos marcados en rojo.");
            return false;
        }

        /* ----------------------------------------------------------- avisos -- */

        /* Mensaje devuelve false cuando la pantalla no tiene el diálogo ni lo
           puede pedir al padre; en ese caso el aviso va al renglón. */
        function avisar(tabla, tipo, mensaje) {
            var span;
            if (mensaje && typeof Mensaje !== "undefined" && Mensaje &&
                typeof Mensaje.mostrarMensaje === "function") {
                if (Mensaje.mostrarMensaje(tipo, mensaje) === true) return true;
            }
            span = document.getElementById("spnValida" + tabla);
            if (span) span.textContent = mensaje || "";
            return false;
        }

        /* ---------------------------------------------------- desplegables -- */

        /* Llena los select del modelo con las listas que devuelve el servidor.
           Cada lista son registros 'valor|texto' separados por ¬, y las listas
           entre sí por ¦. Se reparten en el orden en que la plantilla declara
           los select, salvo que el campo diga 'lista=n'. */
        function llenarListas(tabla, listas) {
            var lista = campos(tabla), i, campo, orden = 0;

            if (!listas || listas.length === 0) return;

            for (i = 0; i < lista.length; i++) {
                campo = lista[i];
                if (campo.tipo !== "select" && campo.tipo !== "multi") continue;
                /* El que declara sus opciones en el txt no cuenta para el
                   orden ni se rellena: si contara, correría un lugar a todos
                   los que sí vienen del paquete. */
                if (campo.opciones) continue;
                llenarUnaLista(campo, listas[campo.lista !== undefined ? Number(campo.lista) : orden]);
                orden++;
                /* El panel de casillas se rehace con las opciones recién
                   llegadas; hasta ahora estaba vacío. */
                if (campo.tipo === "multi") MultiCombo.refrescar(campo.id);
            }
        }

        function llenarUnaLista(campo, datos) {
            var elemento = control(campo);
            var registros, i, partes, opcion, seleccionado;

            if (!elemento || !datos) return;
            seleccionado = elemento.value;

            elemento.innerHTML = "";
            /* El multicombo no lleva 'Seleccione': no elegir nada ya significa
               'todos', y una opción vacía entre las casillas no querría decir
               nada. */
            if (campo.tipo !== "multi") {
                opcion = document.createElement("option");
                opcion.value = "";
                opcion.textContent = "Seleccione";
                elemento.appendChild(opcion);
            }

            registros = (typeof datos === "string") ? datos.split("¬") : datos;
            for (i = 0; i < registros.length; i++) {
                if (registros[i] === "") continue;
                partes = String(registros[i]).split("|");
                opcion = document.createElement("option");
                opcion.value = partes[0];
                /* textContent y no innerHTML: los rótulos vienen de la base. */
                opcion.textContent = partes.length > 1 ? partes[1] : partes[0];
                elemento.appendChild(opcion);
            }
            if (seleccionado && campo.tipo !== "multi") elemento.value = seleccionado;
        }

        /* -------------------------------------------------- estado visual -- */

        function habilitar(tabla, activo, ids) {
            var lista = campos(tabla), i, n = lista.length, campo, elemento, archivo, lupa, bloque;

            for (i = 0; i < n; i++) {
                campo = lista[i];
                if (ids && !contiene(ids, campo.id)) continue;
                elemento = control(campo);
                if (elemento) elemento.disabled = !activo;
                if (campo.tipo === "archivo") {
                    archivo = document.getElementById("btnArchivo" + campo.id);
                    if (archivo) archivo.disabled = !activo;
                }
                /* La lupa acompaña a su campo, y además se esconde: un botón
                   deshabilitado que sigue a la vista invita a pulsarlo y a
                   pensar que la pantalla está rota. Si el campo no se puede
                   cambiar, buscar tampoco tiene sentido. */
                lupa = document.getElementById("lup" + campo.id);
                if (lupa) {
                    lupa.disabled = !activo;
                    lupa.hidden = !activo;
                    bloque = lupa.parentNode;
                    if (bloque) {
                        bloque.className = activo
                            ? "campo__control campo__control--conLupa"
                            : "campo__control";
                    }
                }
            }
        }

        function contiene(lista, valor) {
            var i, n = lista.length;
            for (i = 0; i < n; i++) {
                if (lista[i] === valor) return true;
            }
            return false;
        }

        function separarLista(texto) {
            var partes = String(texto || "").split(","), salida = [], i, n = partes.length, dato;
            for (i = 0; i < n; i++) {
                dato = partes[i].replace(/^\s+|\s+$/g, "").toLowerCase();
                if (dato !== "") salida.push(dato);
            }
            return salida;
        }

        /* -------------------------------------------------------- auditoría -- */

        /* Campos ocultos de la plantilla: CodigoAccion, Id, EstadoRegistro,
           CreadoPor, ActualizadoPor. Se llenan los que existan.              */
        function auditoria(tabla, accion) {
            var usuario = usuarioDeSesion();
            var datos = { CodigoAccion: accion };

            if (accion === "I") {
                datos.Id = "0";
                datos.CreadoPor = usuario;
                datos.ActualizadoPor = "SYSTEM";
            } else {
                datos.ActualizadoPor = usuario;
            }
            poner(tabla, datos);
            return datos;
        }

        function usuarioDeSesion() {
            var datos;
            try {
                datos = window.sessionStorage.getItem("datosUsuario");
            } catch (e) {
                datos = null;
            }
            if (!datos) return "";
            return String(datos).split("|")[0];
        }

        /* --------------------------------------------- cambios sin guardar -- */

        function marcarCambios(tabla, activo) {
            var aviso = document.getElementById("spnCambios" + tabla);
            cambios[tabla] = activo === true;
            if (aviso) aviso.className = activo ? "pantalla__cambios visible" : "pantalla__cambios";
        }

        function hayCambios(tabla) {
            return cambios[tabla] === true;
        }

        return {
            registrar: registrar,
            modeloDe: modeloDe,
            campos: campos,
            valores: valores,
            trama: trama,
            tramaPosicional: tramaPosicional,
            poner: poner,
            limpiar: limpiar,
            validar: validar,
            validarUno: validarUno,
            avisar: avisar,
            ponerUno: ponerUno,
            ponerPorOrden: ponerPorOrden,
            refrescarContadores: refrescarContadores,
            llenarListas: llenarListas,
            habilitar: habilitar,
            auditoria: auditoria,
            usuario: usuarioDeSesion,
            marcarCambios: marcarCambios,
            hayCambios: hayCambios
        };
    })();

    /* ------------------------------------------------------------------------
       Funciones públicas. Cada una reparte entre el camino por modelo y el
       Lo que una pantalla necesita de Formulario sin conocerlo por dentro.
       --------------------------------------------------------------------- */

    Ventana.obtenerDatos = function (tabla) {
        return Formulario.trama(tabla);
    };

    /* Cada campo se valida con las reglas que declara su plantilla. */
    Ventana.validar = function (tabla) {
        return Formulario.validar(tabla);
    };

    Ventana.hayCambios = function (tabla) {
        return Formulario.hayCambios(tabla);
    };

    Ventana.marcarCambios = function (tabla, activo) {
        return Formulario.marcarCambios(tabla, activo);
    };

    Ventana.validarCampo = function (tabla, id) {
        return Formulario.validarUno(tabla, id);
    };

    /* Lo llama Plantilla.crear al terminar de construir: mientras la tabla no
       tenga modelo, cargar, grabar y validar no saben con qué trabajar. */
    Ventana.registrarModelo = function (modelo) {
        return Formulario.registrar(modelo);
    };

    /* El modelo de una tabla: lo que quedó de la construcción -campos, grilla,
       mapeos- más lo que dejó la carga. Lo consulta la pantalla cuando
       necesita su propia rejilla, como T01 para filtrar por sus combos. */
    Ventana.modeloDe = function (tabla) {
        return Formulario.modeloDe(tabla);
    };

    /* Registro de acciones por tabla: reemplaza al único hueco global
       alEjecutarAccion, que no servía con dos ventanas abiertas. */
    var manejadores = {};

    Ventana.acciones = function (tabla, mapa) {
        manejadores[tabla] = mapa || {};
    };

    Ventana.ejecutarAccion = function (accion, modelo, fila) {
        var tabla = modelo && modelo.tabla ? modelo.tabla : "";
        var mapa = manejadores[tabla];

        if (mapa && typeof mapa[accion] === "function") {
            mapa[accion](tabla, fila);
            return true;
        }
        if (typeof Ventana.alEjecutarAccion === "function") {
            Ventana.alEjecutarAccion(accion, modelo);
            return true;
        }
        /* Comportamiento por omisión: nuevo, editar, ver, grabar, cancelar y
           cerrar son iguales en todas las pantallas, así que solo hay que
           registrarlos cuando se quiere algo distinto. */
        if (typeof Ventana[accion] === "function") {
            Ventana[accion](tabla, fila);
            return true;
        }
        Ventana.registrar("Acción sin atender: " + accion + " en " + tabla);
        return false;
    };

    /* ========================================================================
       Ciclo de la pantalla: cargar, grabar y cancelar.

       Estaba repetido en el archivo de cada pantalla. Es idéntico en todas
       —pedir, descomprimir, repartir segmentos, colocar, validar, enviar—, así
       que vive aquí y la pantalla solo pone lo que le es propio.

       Respuesta del servidor, en segmentos separados por ~ :
           [0] mensaje 'C|..', 'A|..' o 'E|..'  ó la lista de combos
           [1] registros, separados por ¬
           [2] grillas de popup
           [3] ayudas
       cargar devuelve combos en el [0] y gestionar devuelve el mensaje; en
       ambos los registros van en el [1], así que un solo lector sirve.
       ===================================================================== */

    var SEP_SEGMENTO = "~";
    var SEP_REGISTRO = "¬";
    var SEP_LISTA = "¦";
    /* Las cuatro letras con que el paquete encabeza un mensaje:

         C  conforme     la operación se hizo
         A  advertencia  se hizo, con un reparo
         V  validación   NO se hizo: una regla del negocio lo impidió
         E  error        NO se hizo: algo falló

       La 'V' es la que usan las funciones dvpkg_fn* para devolver el reparo
       en palabras -"Ese trabajador ya tiene asignado ese concepto"- en vez de
       dejar que estalle el índice único. Sin ella en esta lista, el mensaje
       llegaba a la pantalla y se tomaba por datos: no se veía nada y el
       usuario creía que su grabado pasó. */
    var ES_MENSAJE = /^[CAEV]\|/;

    /* Códigos de operación del menú (columna 4 de las filas 'A' de Menu.txt)
       y la acción de la grilla que habilita cada uno. getPerfiles solo agrega
       al dato del menú los códigos que el perfil tiene en 'S', así que lo que
       llega en hdfTabla ya viene filtrado por perfil. */
    var CODIGOS_ACCION = {
        RE: "nuevo",
        EM: "eliminarMultiple",
        EX: "excel",
        MO: "editar",
        EL: "eliminar",
        VE: "ver",
        /* La grilla del detalle tiene sus propios permisos: se puede dejar
           modificar la cabecera sin dejar agregar ni quitar conceptos. */
        RD: "nuevoDetalle",
        ED: "eliminarDetalle"
    };

    /* hdfTabla llega como 'T12¦RE¦EX¦MO¦EL¦': la tabla y los códigos
       permitidos. */
    Ventana.permisos = function () {
        var partes = String(Ventana.valorDe("hdfTabla") || "").split("¦");
        var salida = {}, i, codigo;

        for (i = 1; i < partes.length; i++) {
            codigo = partes[i].replace(/^\s+|\s+$/g, "").toUpperCase();
            if (CODIGOS_ACCION[codigo]) salida[CODIGOS_ACCION[codigo]] = true;
        }
        return salida;
    };

    /* Intersección entre lo que la pantalla admite y lo que el perfil permite.
       Si la plantilla no declara nada, manda el perfil. */
    Ventana.accionesPermitidas = function (declaradas) {
        var permitidas = Ventana.permisos();
        var salida = {}, clave;

        if (!declaradas || Object.keys(declaradas).length === 0) return permitidas;

        for (clave in declaradas) {
            if (!Object.prototype.hasOwnProperty.call(declaradas, clave)) continue;
            if (permitidas[clave]) salida[clave] = true;
        }
        return salida;
    };

    /* Ayudante de DOM que cada pantalla venía redefiniendo. */
    Ventana.valorDe = function (id) {
        var el = document.getElementById(id);
        return el ? el.value : "";
    };

    Ventana.registrar = function (mensaje, detalle) {
        if (typeof console === "undefined" || !console || !console.error) return;
        if (detalle !== undefined) console.error("[Ventana] " + mensaje, detalle);
        else console.error("[Ventana] " + mensaje);
    };

    function controladorDe(tabla) {
        var modelo = Formulario.modeloDe(tabla);
        return (modelo && modelo.controlador) ? modelo.controlador : "SAHE";
    }

    function descomprimir(rpta) {
        if (typeof Descomprimir === "undefined" || !Descomprimir ||
            typeof Descomprimir.Deflate !== "function") {
            return String(rpta);
        }
        return Descomprimir.Deflate(rpta);
    }

    /* ¿El primer segmento es un mensaje o son datos? Depende de quién
       contesta, y por eso cada llamada dice desde dónde pregunta:

       'gestion'  la respuesta EMPIEZA por el mensaje, así que basta la forma
                  'X|texto'.

       'carga'    el segmento 0 son los desplegables, donde esa misma forma es
                  una opción legítima: la lista de estados empieza por
                  'A|Activo'. Solo se acepta como mensaje lo que interrumpe la
                  carga y no puede venir acompañado de datos: 'E|' siempre, y
                  'V|' únicamente cuando viene solo -sin separador de registro
                  ni de lista y con un solo texto detrás-, porque una lista
                  que empiece por un código 'V' trae más opciones detrás.

       'obtener'  no necesita trato aparte: el segmento 0 es el registro, que
                  empieza por la acción -'U|...' al modificar, 'O|...' al ver-
                  y ninguna de esas letras encabeza un mensaje. Por eso ver
                  dejó de mandar 'V': con esa letra, el registro que veía la
                  pantalla era indistinguible de una validación. */
    function esMensaje(cabecera, modo) {
        if (!ES_MENSAJE.test(cabecera)) return false;
        if (modo !== "carga") return true;
        if (cabecera.charAt(0) === "E") return true;
        if (cabecera.charAt(0) !== "V") return false;
        return cabecera.indexOf(SEP_REGISTRO) === -1 &&
               cabecera.indexOf(SEP_LISTA) === -1 &&
               cabecera.split("|").length === 2;
    }

    /* Lee la respuesta completa y devuelve lo ya separado, o null si vino un
       error, en cuyo caso el aviso ya se mostró. 'modo' dice desde dónde se
       pregunta -'carga' o nada-; lo usa esMensaje para saber si el primer
       segmento es un aviso o son datos. */
    function leerRespuesta(tabla, rpta, modo) {
        var texto, segmentos, cabecera, mensaje;

        if (!rpta) {
            Ventana.registrar("El servidor no devolvió datos.");
            return null;
        }

        try {
            texto = descomprimir(rpta);
        } catch (e) {
            Ventana.registrar("No se pudo descomprimir la respuesta.", e);
            Formulario.avisar(tabla, "E", "No se pudo leer la respuesta del servidor.");
            return null;
        }

        segmentos = String(texto).split(SEP_SEGMENTO);
        cabecera = segmentos[0] || "";

        if (esMensaje(cabecera, modo)) {
            mensaje = cabecera.split("|");
            /* Error y validación cortan por igual: en ambos casos el paquete
               no grabó nada y detrás del mensaje no viene ningún dato. Seguir
               adelante vaciaría la grilla y cerraría la ventana como si la
               operación hubiera salido bien. */
            if (mensaje[0] === "E" || mensaje[0] === "V") {
                Formulario.avisar(tabla, mensaje[0],
                    mensaje[1] || "La operación no se pudo realizar.");
                return null;
            }
            return { tipo: mensaje[0], mensaje: mensaje[1] || "", combos: null, segmentos: segmentos };
        }
        return { tipo: "", mensaje: "", combos: cabecera, segmentos: segmentos };
    }

    /* Cada lista llega como 'codigo|texto¬codigo|texto'; la grilla las quiere
       ya partidas en registros. */
    function separarListas(listas) {
        var salida = [], i;
        for (i = 0; i < listas.length; i++) {
            salida.push(String(listas[i] || "").split(SEP_REGISTRO));
        }
        return salida;
    }

    function primerRegistro(segmentos) {
        var registros = segmentos.length > 1 ? String(segmentos[1]).split(SEP_REGISTRO) : [];
        if (registros.length === 0 || registros[0] === "") return "";
        return registros[0];
    }

    /* ------------------------------------------------------------- cargar -- */

    /* La pantalla deja de verse apagada en cuanto llega -o falla- la carga. */
    function marcarCargando(tabla, cargando) {
        var modelo = Formulario.modeloDe(tabla);
        if (!modelo || !modelo.contenedor) return;
        modelo.contenedor.className = cargando ? "pantalla pantalla--cargando" : "pantalla";
    }

    /* Mientras llegan las tandas la pantalla NO se bloquea: el usuario ya
       puede filtrar y ordenar lo que tiene. Solo el contador avisa que
       todavía falta. */

    /* ---- el reparto, en el orden en que el paquete manda los segmentos ----

       1) listas    segmento 0 - de ellas salen las opciones de los
                                 desplegables y la traducción código→texto
                                 que necesita la grilla;
       2) ayudas    segmento 2 - las grillas de las lupas, que quedan a la
                                 mano para cuando el usuario abra una;
       3) datos     segmento 1 - las filas o el registro, que ya se pintan
                                 traducidos.

       El orden no es cosmético: si los datos entraran antes que las listas,
       la grilla mostraría 'A' donde debe decir 'Activo' y los desplegables
       quedarían en blanco por elegir un valor que todavía no existe. */

    function llenarListas(tabla, modelo, lectura) {
        var listas;

        if (!lectura.combos || !modelo) return;

        listas = lectura.combos.split(SEP_LISTA);
        Formulario.llenarListas(tabla, listas);
        listas = separarListas(listas);
        if (modelo.instanciaGrilla) modelo.instanciaGrilla.listas(listas);
        /* El detalle también las necesita: sus celdas de tipo 'cbo' se llenan
           con estas mismas listas. Sin esto el combo del concepto quedaba con
           una sola opción, 'Seleccione'. */
        if (modelo.instanciaDetalle) modelo.instanciaDetalle.listas(listas);
    }

    /* Las ayudas se guardan en el modelo tal como llegan. No se pintan ahora:
       la lupa las pide cuando el usuario la abre, y así una pantalla con
       varias ayudas no arma cuatro grillas que quizá nadie mire. */
    function llenarAyudas(tabla, modelo, lectura) {
        /* 'ayudas' son las definiciones del txt; los datos van aparte para no
           pisarlas. */
        if (!modelo) return;
        modelo.datosAyuda = lectura.segmentos.length > 2 ? String(lectura.segmentos[2]).split(SEP_LISTA) : [];
    }

    function llenarDatos(tabla, modelo, lectura) {
        var filas = lectura.segmentos.length > 1 ? lectura.segmentos[1] : "";
        var registro;

        /* Con grilla el segundo segmento son TODAS las filas; sin grilla es un
           registro y va a los controles. */
        if (modelo && modelo.instanciaGrilla) {
            modelo.instanciaGrilla.datos(filas);
            return;
        }

        registro = primerRegistro(lectura.segmentos);
        if (registro === "") {
            /* Sin fila vigente la pantalla queda en blanco para dar de alta. */
            Formulario.auditoria(tabla, "I");
            Formulario.avisar(tabla, "A", "No hay datos registrados. Complete la pantalla y grabe.");
            return;
        }
        Formulario.poner(tabla, registro);
        Formulario.auditoria(tabla, "U");
    }

    function repartir(tabla, lectura) {
        var modelo = Formulario.modeloDe(tabla);
        llenarListas(tabla, modelo, lectura);
        llenarAyudas(tabla, modelo, lectura);
        guardarPorDefecto(tabla, modelo, lectura);
        llenarDatos(tabla, modelo, lectura);
    }

    /* Los valores con que arranca la pantalla, en el quinto segmento:
           Periodo=202609¦PeriodoPop=202609¦Replicar=N
       Los decide el paquete y no la plantilla porque dependen del día en que
       se abre -el periodo en curso- o del estado de la base. Se guardan en el
       modelo y se aplican dos veces: aquí, a los campos de la pantalla, y otra
       vez en cada alta, a los de la ventana de mantenimiento. */
    function guardarPorDefecto(tabla, modelo, lectura) {
        var crudo = segmentoPorDefecto(lectura.segmentos);
        var partes, i, corte, clave;

        if (!modelo) return;
        modelo.porDefecto = {};
        if (crudo === "") return;

        partes = crudo.split(SEP_LISTA);
        for (i = 0; i < partes.length; i++) {
            corte = partes[i].indexOf("=");
            if (corte < 1) continue;
            clave = partes[i].substring(0, corte).replace(/^\s+|\s+$/g, "");
            if (clave !== "") modelo.porDefecto[clave] = partes[i].substring(corte + 1);
        }
        aplicarPorDefecto(tabla, modelo);
    }

    /* Los valores por omisión se reconocen por su forma y no por su número de
       segmento: hay paquetes que mandan el total de registros -para la carga
