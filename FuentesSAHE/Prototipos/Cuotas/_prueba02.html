       por bloques- y hay paquetes que no, así que el mismo dato cae unas veces
       en el cuarto segmento y otras en el quinto. Lo que no cambia es que los
       valores llevan '=' y el total es un número pelado. */
    function segmentoPorDefecto(segmentos) {
        var i, trozo;

        for (i = 3; i < segmentos.length; i++) {
            trozo = String(segmentos[i] || "");
            if (trozo.indexOf("=") > 0) return trozo;
        }
        return "";
    }

    function tipoCampo(tabla, id) {
        var lista = Formulario.campos(tabla), i;
        for (i = 0; i < lista.length; i++) {
            if (lista[i].id === id) return lista[i].tipo;
        }
        return "";
    }

    /* ¿El campo quedó sin responder? Para uno común es el blanco. Para un
       desplegable múltiple hay que mirar las casillas y no el valor, porque
       su valor es 'T' tanto si el usuario marcó todas como si no tocó nada:
       lo primero es una elección y lo segundo no. */
    function sinElegir(tabla, id, valor) {
        if (tipoCampo(tabla, id) !== "multi") {
            return valor === undefined || valor === null || String(valor) === "";
        }
        return MultiCombo.marcados(id) === 0;
    }

    /* Solo se ponen los que estén en blanco: si el usuario ya eligió otro
       periodo y vuelve a consultar, su elección manda sobre la del paquete. */
    function aplicarPorDefecto(tabla, modelo, forzar) {
        var valores, clave;

        if (!modelo || !modelo.porDefecto) return;
        valores = Formulario.valores(tabla);
        for (clave in modelo.porDefecto) {
            if (!modelo.porDefecto.hasOwnProperty(clave)) continue;
            if (forzar !== true && !sinElegir(tabla, clave, valores[clave])) continue;
            Formulario.ponerUno(tabla, clave, modelo.porDefecto[clave]);
        }
    }

    /* Cuántas filas por viaje declara la pantalla. Cero significa que no se
       trae por bloques: la tabla es chica y entra de una vez. */
    function tamanoBloque(tabla) {
        var modelo = Formulario.modeloDe(tabla);
        return (modelo && modelo.grilla && modelo.grilla.bloque) ? modelo.grilla.bloque : 0;
    }

    /* El id de la última fila del bloque. Es la llave con la que se pide el
       siguiente: se paginan por llave y no por número de página, así el viaje
       18 cuesta lo mismo que el primero. */
    function ultimoIdDe(tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaGrilla : null;
        var filas, posicion;

        if (!rejilla) return 0;
        filas = rejilla.filas();
        if (filas.length === 0) return 0;
        posicion = posicionEnMapeo(modelo.mapeo || [], camposPk(modelo)[0]);
        if (posicion === -1) posicion = 0;
        return Number(filas[filas.length - 1][posicion]) || 0;
    }

    function pedirBloque(tabla, accion, alLlegar) {
        var frm = new FormData();

        frm.append("data", tabla + "|" + accion);
        Http.postBytes(controladorDe(tabla) + "/Cargar", function (rpta) {
            var lectura = leerRespuesta(tabla, rpta, "carga");
            if (!lectura) { marcarCargando(tabla, false); return; }
            alLlegar(lectura);
        }, frm, {
            error: function (falla) {
                marcarCargando(tabla, false);
                Formulario.avisar(tabla, "E", falla.mensaje);
            }
        });
    }

    /* Trae el resto de las tandas, una detrás de otra. No se lanzan en
       paralelo a propósito: cada bloque necesita el último id del anterior, y
       además así el servidor atiende una consulta por vez en lugar de
       dieciocho. La pantalla ya está usable desde el primer bloque. */
    function traerResto(tabla, total, bloque, alTerminar) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaGrilla : null;

        function siguiente() {
            if (rejilla.filas().length >= total) { terminar(); return; }
            pedirBloque(tabla, "B" + SEP_REGISTRO + ultimoIdDe(tabla) + SEP_REGISTRO + bloque,
                function (lectura) {
                    var datos = lectura.segmentos.length > 1 ? lectura.segmentos[1] : "";
                    var antes = rejilla.filas().length;

                    if (datos === "" || rejilla.agregar(datos) === antes) { terminar(); return; }
                    siguiente();
                });
        }

        function terminar() {
            rejilla.esperar(0);
            if (typeof alTerminar === "function") alTerminar(null);
        }

        if (!rejilla) return;
        siguiente();
    }

    /* accion es 'C' en la carga inicial y 'B' cuando se pide una tanda. Lo que
       acompaña a la acción viaja después del separador de registro, porque el
       controlador parte el 'data' por el primer | y se quedaría solo con lo
       que hay antes del segundo. */
    /* Lo que una pantalla concreta necesita agregarle a la trama de la carga,
       detrás de la acción. Lo registra Sistema.js -'Ventana.datosDeCarga.T01FUN
       = function () {...}'- y la librería no sabe qué es: solo lo concatena.

       Existe porque hay datos que la carga necesita y la pantalla no tiene:
       T01FUN manda con qué trabajador y sobre qué ubicación se está
       entrando, que salen de la sesión. Poner eso en la librería sería
       obligar a todas las pantallas a cargar con la forma de una. */
    Ventana.datosDeCarga = {};

    function extraDeCarga(tabla) {
        var fn = Ventana.datosDeCarga[tabla];
        var extra;

        if (typeof fn !== "function") return "";
        try {
            extra = fn();
        } catch (e) {
            Ventana.registrar("No se pudieron armar los datos de carga de " + tabla + ".", e);
            return "";
        }
        return (extra === undefined || extra === null) ? "" : String(extra);
    }

    Ventana.cargar = function (tabla, alTerminar, filtro) {
        var frm = new FormData();
        var bloque = tamanoBloque(tabla);
        /* 'C' es pedir la pantalla entera; con 'datosDeCarga' la pantalla le
           agrega lo suyo -'C|0277592|7800'- y el bloque, si lo hay, sigue
           yendo al final tras el separador de registro. */
        var accion = "C" + extraDeCarga(tabla);

        if (filtro !== undefined && filtro !== null && filtro !== "") accion = "B" + SEP_REGISTRO + filtro;
        else if (bloque > 0) accion += SEP_REGISTRO + bloque;

        frm.append("data", tabla + "|" + accion);
        marcarCargando(tabla, true);

        Http.postBytes(controladorDe(tabla) + "/Cargar", function (rpta) {
            var lectura = leerRespuesta(tabla, rpta, "carga");
            var modelo, rejilla, total;

            if (!lectura) { marcarCargando(tabla, false); return; }

            repartir(tabla, lectura);

            /* El paquete informa el total en el cuarto segmento. Si hay más de
               lo que trajo, se sigue pidiendo mientras el usuario ya mira el
               primer bloque. */
            modelo = Formulario.modeloDe(tabla);
            rejilla = modelo ? modelo.instanciaGrilla : null;
            total = lectura.segmentos.length > 3 ? Number(lectura.segmentos[3]) : 0;

            if (bloque > 0 && rejilla && total > rejilla.filas().length) {
                /* La pantalla se desbloquea con el PRIMER bloque: el usuario
                   ya puede filtrar, ordenar y abrir un registro mientras el
                   resto sigue llegando. Lo único que avisa que falta es el
                   contador. */
                marcarCargando(tabla, false);
                rejilla.esperar(total);
                if (typeof alTerminar === "function") alTerminar(lectura);
                traerResto(tabla, total, bloque, null);
                return;
            }

            marcarCargando(tabla, false);
            if (typeof alTerminar === "function") alTerminar(lectura);
        }, frm, {
            error: function (falla) {
                marcarCargando(tabla, false);
                Formulario.avisar(tabla, "E", falla.mensaje);
            }
        });
    };

    /* ------------------------------------------------------------- grabar -- */

    /* Los archivos elegidos viajan aparte del texto; el controlador los recoge
       de Request.Files. */
    function adjuntarArchivos(tabla, frm) {
        var lista = Formulario.campos(tabla), i, n = lista.length, tipo, entrada, total = 0;

        for (i = 0; i < n; i++) {
            tipo = lista[i].tipo;
            /* Los dos tipos que llevan archivo detrás. Cuando se agregó
               'adjunto' esta comparación se quedó mirando solo 'archivo', y el
               documento nunca subía: el controlador veía Request.Files.Count
               en cero y grababa la trama con el nombre de un archivo que no
               estaba en el servidor. */
            if (tipo !== "archivo" && tipo !== "adjunto") continue;
            entrada = document.getElementById("fup" + lista[i].id);
            if (entrada && entrada.files && entrada.files.length > 0) {
                frm.append("archivo" + total, entrada.files[0]);
                total++;
            }
        }
        return total;
    }

    /* El formulario guarda códigos -'HORA'- y la trama de la grilla puede
       traer la descripción -'Por Hora'-. Los dos lados se pasan por la
       traducción de la columna, que deja el valor sin tocar cuando no está en
       ninguna lista, y así se comparan cosas comparables. */
    function comparable(rejilla, mapeo, id, valor) {
        var posicion = posicionEnMapeo(mapeo, id);
        var texto = valor === undefined || valor === null ? "" : String(valor);

        if (posicion === -1 || !rejilla.textoDe) return texto;
        return String(rejilla.textoDe(posicion, texto));
    }

    /* Los valores que el formulario tiene ahora para una lista de campos. */
    function valoresDe(rejilla, mapeo, tabla, ids) {
        var datos = Formulario.valores(tabla), salida = [], i;
        for (i = 0; i < ids.length; i++) {
            salida.push(comparable(rejilla, mapeo, ids[i], datos[ids[i]]));
        }
        return salida;
    }

    /* Los mismos campos, pero tomados de una fila de la grilla, que viene en
       el orden del mapeo de carga. */
    function valoresDeFila(rejilla, mapeo, fila, ids) {
        var salida = [], i, posicion;
        for (i = 0; i < ids.length; i++) {
            posicion = posicionEnMapeo(mapeo, ids[i]);
            salida.push(posicion === -1 ? "" : comparable(rejilla, mapeo, ids[i], fila[posicion]));
        }
        return salida;
    }

    function mismosValores(a, b) {
        var i;
        if (a.length !== b.length) return false;
        for (i = 0; i < a.length; i++) {
            if (String(a[i]).toLowerCase() !== String(b[i]).toLowerCase()) return false;
        }
        return true;
    }

    /* Comprueba la clave única contra lo que ya está en la grilla. Se hace
       antes de mandar para dar un mensaje entendible: Oracle devolvería un
       ORA-00001 con el nombre del índice, que al usuario no le dice nada.
       No reemplaza a la restricción de la base -otro usuario puede haber
       grabado lo mismo hace un segundo-, la adelanta. */
    function repiteClaveUnica(tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaGrilla : null;
        var uk = modelo && modelo.grilla ? modelo.grilla.uk : null;
        var mapeo, pk, valores, llaveActual, filas, i;

        if (!rejilla || !uk || uk.length === 0) return false;

        mapeo = modelo.mapeo || [];
        pk = camposPk(modelo);
        valores = valoresDe(rejilla, mapeo, tabla, uk);
        llaveActual = valoresDe(rejilla, mapeo, tabla, pk);
        filas = rejilla.filas();

        for (i = 0; i < filas.length; i++) {
            if (!mismosValores(valores, valoresDeFila(rejilla, mapeo, filas[i], uk))) continue;
            /* La propia fila que se está modificando no cuenta como repetida. */
            if (mismosValores(llaveActual, valoresDeFila(rejilla, mapeo, filas[i], pk))) continue;
            return true;
        }
        return false;
    }

    function rotuloDe(tabla, ids) {
        var lista = Formulario.campos(tabla), textos = [], i, j;

        for (i = 0; i < ids.length; i++) {
            for (j = 0; j < lista.length; j++) {
                if (lista[j].id === ids[i]) { textos.push(lista[j].etiqueta || ids[i]); break; }
            }
        }
        return textos.join(" + ");
    }

    Ventana.grabar = function (tabla, alTerminar) {
        var trama, modelo, problema, detalle;

        if (!Ventana.validar(tabla)) return false;

        modelo = Formulario.modeloDe(tabla);

        /* Con detalle, la pantalla graba la cabecera Y sus líneas: revisarlas
           antes evita mandar un movimiento a medias que el paquete tendría que
           rechazar. */
        if (modelo && modelo.detalle) {
            problema = revisarDetalle(modelo);
            if (problema !== "") { Formulario.avisar(tabla, "A", problema); return false; }
        }

        if (repiteClaveUnica(tabla)) {
            Formulario.avisar(tabla, "A", "Ya existe un registro con ese " +
                rotuloDe(tabla, modelo.grilla.uk) + ".");
            return false;
        }

        /* La acción decide la rama del paquete: 'I' alta, 'U' modificación. */
        Formulario.auditoria(tabla, Ventana.valorDe("hdnCodigoAccion") || "U");

        trama = Formulario.tramaPosicional(tabla);
        if (trama === null) {
            Ventana.registrar("La plantilla de " + tabla + " no declara la línea 'mapeo'; no se puede armar la trama.");
            Formulario.avisar(tabla, "E", "La pantalla no está configurada para grabar.");
            return false;
        }
        /* La cabecera va en 'data' con el mapeo de siempre; el detalle, si la
           pantalla lo declara, en 'dataDetalle'. */
        if (modelo && modelo.detalle) {
            detalle = Ventana.tramaDetalle(tabla);
            /* Si no cambió ninguna línea no hay nada que grabar: mandar la
               cabecera sola generaría una versión nueva del movimiento sin
               ningún cambio detrás. */
            if (detalle === "") {
                Formulario.avisar(tabla, "A", "No hay cambios que grabar.");
                return false;
            }
            return enviarGestion(tabla, trama, alTerminar, detalle);
        }
        return enviarGestion(tabla, trama, alTerminar, null);
    };

    /* Envío a gestionar. Lo comparten grabar, eliminar y eliminar múltiple:
       la única diferencia entre ellos es la acción que lleva la trama. */
    function enviarGestion(tabla, trama, alTerminar, detalle) {
        var frm;

        if (trama === undefined || trama === null) trama = Formulario.tramaPosicional(tabla);
        if (trama === null) return false;

        frm = new FormData();
        frm.append("data", tabla + SEP_REGISTRO + trama);
        /* El detalle va en su propio campo y no pegado a 'data': el
           controlador parte 'data' por ¬ y se queda con el primer trozo, así
           que un detalle metido ahí llegaría cortado. Con dataDetalle el
           controlador lo agrega detrás del ¯ sin tocarlo. */
        if (detalle !== undefined && detalle !== null && detalle !== "") {
            frm.append("dataDetalle", detalle);
        }
        adjuntarArchivos(tabla, frm);

        Http.postBytes(controladorDe(tabla) + "/gestionar", function (rpta) {
            var lectura = leerRespuesta(tabla, rpta);
            var modelo = Formulario.modeloDe(tabla);
            var registro;

            if (!lectura) return;

            /* El paquete devuelve el mensaje y, detrás, los datos ya grabados:
               se vuelven a colocar para que la pantalla quede con lo que quedó
               en la base y no con lo que el usuario tenía escrito. */
            if (modelo && modelo.instanciaGrilla) {
                modelo.instanciaGrilla.datos(lectura.segmentos.length > 1 ? lectura.segmentos[1] : "");
                Ventana.cerrar(tabla);
            } else {
                registro = primerRegistro(lectura.segmentos);
                if (registro !== "") {
                    Formulario.poner(tabla, registro);
                    Formulario.auditoria(tabla, "U");
                }
            }
            Formulario.marcarCambios(tabla, false);

            /* Solo se anuncia lo que el paquete anunció. Antes, cuando la
               respuesta no traía mensaje, la pantalla ponía "Los datos se
               grabaron" por su cuenta: si el paquete devolvía cualquier otra
               cosa, el usuario leía un éxito que nunca ocurrió. Un grabado sin
               mensaje es una respuesta rara y queda anotada, no disfrazada. */
            if (lectura.tipo !== "") {
                Formulario.avisar(tabla, lectura.tipo, lectura.mensaje);
            } else {
                Ventana.registrar("El paquete de " + tabla +
                                  " respondió sin mensaje a una operación de grabado.");
            }
            if (typeof alTerminar === "function") alTerminar(lectura);

            /* Un gancho aparte del de la carga, y solo para la pantalla que
               lo declare. Es para el caso en que el paquete devuelve, detrás
               del mensaje, algo más que las filas -T01FUN manda también el
               resumen de la cuota-. La pantalla que no lo declara no se entera
               de nada y se comporta como siempre. */
            if (modelo && typeof modelo.alGestionar === "function") {
                modelo.alGestionar(lectura);
            }
        }, frm, {
            error: function (falla) { Formulario.avisar(tabla, "E", falla.mensaje); }
        });
        return true;
    }

    /* ------------------------------------------- ventana de mantenimiento -- */

    function velosDe(tabla) {
        return document.getElementById("divVelo" + tabla);
    }

    Ventana.abrirPopup = function (tabla, titulo) {
        var velo = velosDe(tabla);
        var rotulo = document.getElementById("spnBarraTitulo" + tabla);
        var primero;

        if (!velo) return false;
        if (titulo && rotulo) rotulo.textContent = titulo;
        velo.className = "velo abierto";

        primero = velo.querySelector(".control:not([readonly]):not([type=hidden])");
        if (primero) primero.focus();
        return true;
    };

    Ventana.cerrarPopup = function (tabla) {
        var velo = velosDe(tabla);
        if (velo) velo.className = "velo";
        return true;
    };

    /* ------------------------------------------------ ventana de ayuda ---- */

    /* La lupa abre una ventana aparte -en divPantPop, no en la del
       mantenimiento- con la lista que mandó el paquete en el segmento 2. No
       tiene acciones ni selección múltiple: lo único que se puede hacer es
       elegir una fila con doble clic. */

    var ID_AYUDA = "divPantPop";
    /* Una instancia por lupa, para no rearmar la grilla en cada apertura. */
    var ayudasAbiertas = {};

    function campoDe(modelo, id) {
        var lugares = [modelo], i, j, k, secciones, campos;

        if (modelo.popup) lugares.push(modelo.popup);
        for (i = 0; i < lugares.length; i++) {
            secciones = lugares[i].secciones || [];
            for (j = 0; j < secciones.length; j++) {
                campos = secciones[j].campos || [];
                for (k = 0; k < campos.length; k++) {
                    if (campos[k].id === id) return campos[k];
                }
            }
        }
        return null;
    }

    function contenedorAyuda() {
        var caja = document.getElementById(ID_AYUDA);
        if (!caja) Ventana.registrar("Falta el div " + ID_AYUDA + " para las ayudas.");
        return caja;
    }

    function armarAyuda(tabla, indice, definicion) {
        var caja = contenedorAyuda();
        var clave = tabla + "-" + indice;
        var velo, ventana, barra, cerrar, cuerpo, rejilla;

        if (!caja) return null;
        if (ayudasAbiertas[clave]) return ayudasAbiertas[clave];

        velo = document.createElement("div");
        velo.className = "velo";
        velo.id = "divVeloAyuda" + clave;

        ventana = document.createElement("div");
        ventana.className = "ventana ventana--ayuda";
        ventana.style.maxWidth = definicion.ancho + "px";

        barra = document.createElement("div");
        barra.className = "ventana__barra";
        cerrar = document.createElement("button");
        cerrar.type = "button";
        cerrar.className = "ventana__cerrar";
        cerrar.title = "Cerrar";
        cerrar.innerHTML = "&#215;";
        cerrar.onclick = function () { Ventana.cerrarAyuda(tabla, indice); };
        barra.appendChild(rotulo(definicion.titulo));
        barra.appendChild(cerrar);

        cuerpo = document.createElement("div");
        cuerpo.className = "ventana__cuerpo";
        rejilla = document.createElement("div");
        rejilla.className = "gAyuda";
        cuerpo.appendChild(rejilla);

        ventana.appendChild(barra);
        ventana.appendChild(cuerpo);
        velo.appendChild(ventana);
        caja.appendChild(velo);

        ayudasAbiertas[clave] = {
            velo: velo,
            grilla: Grilla.crear(rejilla, {
                tabla: "AYU" + clave,
                columnas: definicion.columnas,
                porPagina: definicion.porPagina,
                filtros: true,
                /* Sin acciones: ni botones de fila, ni marcas, ni nuevo. */
                acciones: {},
                alElegir: function (fila) { elegirDeAyuda(tabla, definicion, fila); }
            })
        };
        return ayudasAbiertas[clave];
    }

    function rotulo(texto) {
        var span = document.createElement("span");
        span.className = "ventana__titulo";
        span.textContent = texto;
        return span;
    }

    /* Doble clic: cada columna de la ayuda cae en el campo que le toca por
       posición, según 'destino' del txt, y la ventana se cierra. */
    function elegirDeAyuda(tabla, definicion, fila) {
        var destino = definicion.destino || [], i;

        for (i = 0; i < destino.length; i++) {
            if (destino[i] === "") continue;
            Formulario.ponerUno(tabla, destino[i], fila[i]);
        }
        Ventana.cerrarAyuda(tabla, definicion.indice);
    }

    /* El paquete manda la ayuda de dos maneras y las dos son válidas:
         - por registros, 'codigo|texto¬codigo|texto', como la grilla; o
         - como lista plana, '|codigo|texto|codigo|texto...', que es la forma
           heredada de EDDO.
       En la plana no hay separador de fila, así que se agrupa de a tantos
       valores como columnas declare la ayuda. El primer campo suele venir
       vacío -la trama empieza con |- y se descarta. */
    function filasAyuda(texto, cuantasColumnas) {
        var crudo = String(texto || "");
        var partes, salida = [], fila, i;

        if (crudo === "") return [];
        if (crudo.indexOf(SEP_REGISTRO) !== -1) {
            partes = crudo.split(SEP_REGISTRO);
            for (i = 0; i < partes.length; i++) {
                if (partes[i] !== "") salida.push(partes[i].split("|"));
            }
            return salida;
        }

        partes = crudo.split("|");
        while (partes.length > 0 && partes[0] === "") partes.shift();

        fila = [];
        for (i = 0; i < partes.length; i++) {
            fila.push(partes[i]);
            if (fila.length === cuantasColumnas) { salida.push(fila); fila = []; }
        }
        /* Una cola incompleta se completa en blanco antes que perderla. */
        if (fila.length > 0) {
            while (fila.length < cuantasColumnas) fila.push("");
            salida.push(fila);
        }
        return salida;
    }

    /* La acción 'buscar' que emite la lupa. El campo dice con qué ayuda se
       busca; los datos ya llegaron en la carga. */
    Ventana.buscar = function (tabla, campoId) {
        var modelo = Formulario.modeloDe(tabla);
        var campo = modelo ? campoDe(modelo, campoId) : null;
        var indice, definicion, datos, ayuda;

        if (!campo) { Ventana.registrar("La lupa no encontró el campo " + campoId); return false; }

        indice = Number(campo.lupa);
        definicion = (modelo.ayudas || [])[indice];
        if (!definicion) {
            Formulario.avisar(tabla, "A", "Esta búsqueda todavía no está configurada.");
            return false;
        }
        definicion.indice = indice;

        ayuda = armarAyuda(tabla, indice, definicion);
        if (!ayuda) return false;

        datos = (modelo.datosAyuda || [])[indice] || "";
        ayuda.grilla.datos(filasAyuda(datos, definicion.columnas.length));
        /* La ventana se arma una sola vez y se reusa, así que el filtro de la
           búsqueda anterior seguía puesto: el usuario volvía a abrir la lupa y
           veía tres registros de doscientos, sin entender por qué. Se abre
           siempre desde cero. */
        ayuda.grilla.limpiarFiltros();
        ayuda.velo.className = "velo abierto";
        return true;
    };

    Ventana.cerrarAyuda = function (tabla, indice) {
        var ayuda = ayudasAbiertas[tabla + "-" + indice];
        if (ayuda) ayuda.velo.className = "velo";
        return true;
    };

    /* Vuelve a pedir la grilla con lo que el usuario escribió en el campo de
       filtro. Es la acción 'consultar' del txt. Sin filtro declarado se
       comporta como una recarga normal. */
    /* Vuelve a pedir la lista con lo que digan los campos de filtro. Va por
       Gestionar y no por Cargar, con la acción 'C' delante igual que la 'I' de
       insertar o la 'U' de actualizar: para el paquete es una operación más
       del mismo procedimiento, y así no hay dos caminos que mantener.

           data = T01¬C|202607,202608|1000,2000

       'filtro=' admite varios campos separados por coma; sus valores viajan en
       ese orden separados por palote, que es como el paquete parte cualquier
       trama. Un campo de selección múltiple aporta sus códigos separados por
       coma dentro de su propio lugar.

       La respuesta se reparte igual que la de Cargar, así que con ella llegan
       también las listas de los combos: el desplegable de la ventana de
       mantenimiento queda al día -por ejemplo, con solo las gerencias que aún
       no tienen cuota en el periodo consultado- sin pedir nada más. */
    Ventana.consultar = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var ids = (modelo && modelo.grilla && modelo.grilla.filtro)
                  ? String(modelo.grilla.filtro).split(",") : [];
        var valores, partes = [], i, id, obligatorio, valor;

        if (ids.length === 0) {
            enviarConsulta(tabla, "");
            return true;
        }

        valores = Formulario.valores(tabla);
        for (i = 0; i < ids.length; i++) {
            id = ids[i].replace(/^\s+|\s+$/g, "");
            /* Un filtro obligatorio se declara con un '!' delante del nombre:
               'filtro=!Periodo,Oficina' exige el periodo y deja la oficina
               libre. */
            obligatorio = id.charAt(0) === "!";
            if (obligatorio) id = id.substring(1);
            if (id === "") continue;

            valor = valores[id];
            valor = (valor === undefined || valor === null) ? "" : String(valor).replace(/^\s+|\s+$/g, "");
            /* Un filtro obligatorio se satisface marcando algo, y marcar
               'Todos' es marcar algo: viaja como 'T' y la consulta sale. Lo
               que no pasa es dejarlo sin tocar, que en un desplegable múltiple
               también vale 'T' -de ahí que no alcance con mirar el valor-. */
            if (obligatorio && sinElegir(tabla, id, valor)) {
                Formulario.avisar(tabla, "A", "Indique " + rotuloCampo(tabla, id) + " para consultar.");
                return false;
            }
            partes.push(valor);
        }

        enviarConsulta(tabla, partes.join("|"));
        return true;
    };

    /* Las filas que trajo una consulta. El paquete puede contestar de dos
       maneras y las dos se aceptan: con las filas peladas -lo normal, porque
       una consulta no tiene nada que anunciar- o con un mensaje delante y las
       filas detrás. Se mira lo que vino en vez de exigir una de las dos. */
    function filasDeConsulta(lectura) {
        if (lectura.tipo !== "") {
            return lectura.segmentos.length > 1 ? lectura.segmentos[1] : "";
        }
        return lectura.segmentos[0] || "";
    }

    /* Pinta el resultado de una consulta. Con grilla son sus filas; sin
       grilla -una pantalla de un solo registro- es el registro. */
    function pintarConsulta(tabla, filas) {
        var modelo = Formulario.modeloDe(tabla);
        var registro;

        if (modelo && modelo.instanciaGrilla) {
            modelo.instanciaGrilla.datos(filas);
            return;
        }
        registro = String(filas || "").split(SEP_REGISTRO)[0];
        if (registro === "") return;
        Formulario.poner(tabla, registro);
        Formulario.auditoria(tabla, "U");
    }

    /* El envío de la consulta.

       Consultar refresca la LISTA y nada más: los desplegables con que se
       consulta, las lupas y los valores por omisión ya están puestos desde la
       carga, y volver a pisarlos con cada consulta le movría al usuario los
       filtros que acaba de elegir. Por eso lo normal es que el paquete
       conteste con las filas peladas y aquí solo se repinte la grilla.

       La pantalla que necesite lo otro -que consultar también cambie lo que
       ofrecen los combos o las lupas- lo declara en su txt:

           accion|id=Consultar|...|accion=consultar|devuelve=todo

       y entonces la respuesta se reparte igual que la de la carga. */
    function enviarConsulta(tabla, filtro) {
        var frm = new FormData();

        frm.append("data", tabla + SEP_REGISTRO + "C|" + filtro);
        marcarCargando(tabla, true);

        Http.postBytes(controladorDe(tabla) + "/gestionar", function (rpta) {
            var modelo = Formulario.modeloDe(tabla);
            var lectura, todo;

            marcarCargando(tabla, false);

            /* Una consulta sin resultados contesta vacío, y eso es una
               respuesta: la grilla tiene que quedar vacía también. Si se
               tratara como 'no llegó nada', el usuario se quedaría mirando el
               resultado de la consulta anterior y lo creería vigente. */
            if (!rpta) {
                pintarConsulta(tabla, "");
                return;
            }

            /* Cómo se lee depende de lo que la pantalla espere:

               con 'devuelve=todo' llega una carga, y ahí el segmento 0 son los
               combos -donde 'A|Activo' es una opción y no un aviso-;

               en el caso normal llegan las filas, que empiezan por la pk, así
               que un 'C|', 'A|', 'V|' o 'E|' delante sí es un mensaje del
               paquete y se lee como en gestionar. */
            todo = !!(modelo && modelo.consultaDevuelve === "todo");
            lectura = leerRespuesta(tabla, rpta, todo ? "carga" : "gestion");
            if (!lectura) return;

            if (todo) {
                repartir(tabla, lectura);
                /* Trajo lo mismo que la carga, así que la pantalla lo trata
                   igual: es lo que deja al día lo que no es un control ni una
                   fila -en T01FUN, el resumen de la cuota-. */
                if (modelo && typeof modelo.alCargar === "function") modelo.alCargar(lectura);
            } else {
                pintarConsulta(tabla, filasDeConsulta(lectura));
            }

            if (lectura.tipo !== "") Formulario.avisar(tabla, lectura.tipo, lectura.mensaje);
        }, frm, {
            error: function (falla) {
                marcarCargando(tabla, false);
                Formulario.avisar(tabla, "E", falla.mensaje);
            }
        });
    }

    function rotuloCampo(tabla, id) {
        var lista = Formulario.campos(tabla), i;
        for (i = 0; i < lista.length; i++) {
            if (lista[i].id === id) return (lista[i].etiqueta || id).toLowerCase();
        }
        return id;
    }

    /* ------------------------------------------------ detalle de la ventana */

    /* Agrega una fila en blanco al detalle. No abre otra ventana: lo que hay
       que completar son las celdas editables, y elegir el concepto en la
       propia fila es un paso menos que un popup encima de otro popup. */
    Ventana.nuevoDetalle = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaDetalle : null;

        if (!rejilla) { Ventana.registrar("La pantalla " + tabla + " no declara 'detalle'."); return false; }
        rejilla.agregarFila(valoresDeLineaNueva(modelo));
        Ventana.marcarCambios(tabla, true);
        return true;
    };

    /* Con qué valores nace una línea. Las fechas arrancan en hoy: es la fecha
       del movimiento que se está registrando, y dejarla vacía obligaba a
       completarla a mano en cada línea -o a descubrir al grabar que faltaba-. */
    function valoresDeLineaNueva(modelo) {
        var editables = modelo.detalle.editables || [];
        var valores = [], i;

        for (i = 0; i < editables.length; i++) {
            if (editables[i].tipo === "fecha") valores[editables[i].columna] = hoyDetalle();
        }
        return valores;
    }

    /* Quitar una línea del detalle borra EN LA BASE en el momento, no al
       grabar. Es lo que se decidió para esta pantalla, así que el aviso lo
       dice con todas las letras: cancelar la ventana después ya no la
       recupera. Una línea que todavía no se grabó se descarta sin viajar. */
    Ventana.eliminarDetalle = function (tabla, fila) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaDetalle : null;
        var llave;

        if (!rejilla || !fila) return false;
        llave = llaveDetalle(modelo, fila);

        if (llave === "") {
            confirmar("¿Quita esta línea?", function () {
                rejilla.quitarFila(fila);
                Ventana.marcarCambios(tabla, true);
            });
            return true;
        }

        confirmar("Se eliminará " + nombreLinea(modelo, fila) +
                  " de la base de datos ahora mismo. Cancelar la ventana después no lo recupera. ¿Continúa?",
            function () { borrarLineaDetalle(tabla, modelo, rejilla, fila, llave); });
        return true;
    };

    /* Cómo se llama la línea en el aviso: se usa el texto de la primera
       columna visible traducida, que es la que el usuario reconoce. */
    function nombreLinea(modelo, fila) {
        var rejilla = modelo.instanciaDetalle;
        var columnas = rejilla.columnas(), i;

        for (i = 0; i < columnas.length; i++) {
            if (!columnas[i].oculto) return "«" + rejilla.textoDe(i, fila[i]) + "»";
        }
        return "esta línea";
    }

    function borrarLineaDetalle(tabla, modelo, rejilla, fila, llave) {
        var frm = new FormData();

        /* La baja de una LÍNEA lleva su propio código, 'DD', y no el 'D' de
           la pantalla: con el mismo código, el paquete no podría distinguir
           entre borrar un concepto y borrar al trabajador entero. La llave y
           la auditoría que agrega el controlador son todo lo que necesita. */
        frm.append("data", tabla + SEP_REGISTRO + "DD|" + llave);

        Http.postBytes(controladorDe(tabla) + "/gestionar", function (rpta) {
            var lectura = leerRespuesta(tabla, rpta);
            if (!lectura) return;

            rejilla.quitarFila(fila);
            olvidarOriginal(modelo, llave);
            if (lectura.mensaje) Formulario.avisar(tabla, lectura.tipo, lectura.mensaje);
            /* La grilla principal muestra el consolidado: si se borró una
               línea, sus totales quedaron viejos. */
            Ventana.cargar(tabla);
        }, frm, {
            error: function (falla) { Formulario.avisar(tabla, "E", falla.mensaje); }
        });
    }

    /* La línea borrada sale de la copia original: si no, al grabar se la
       compararía contra algo que ya no existe. */
    function olvidarOriginal(modelo, llave) {
        var originales = modelo.detalleOriginal || [], i;
        for (i = 0; i < originales.length; i++) {
            if (llaveDetalle(modelo, originales[i]) === llave) { originales.splice(i, 1); return; }
        }
    }

    /* Una copia de las líneas tal como llegaron de la base. Sirve para dos
       cosas al grabar: saber cuáles cambiaron -y no mandar las ocho para
       modificar una- y saber qué importe tenían, que es el que hay que
       guardar como importe anterior. */
    function recordarDetalle(modelo) {
        var filas = modelo.instanciaDetalle.filas(), copia = [], i;

        for (i = 0; i < filas.length; i++) copia.push(filas[i].slice(0));
        modelo.detalleOriginal = copia;
        modelo.bajasDetalle = [];
    }

    /* La línea original que corresponde a una fila, buscada por su llave. */
    function originalDe(modelo, fila) {
        var originales = modelo.detalleOriginal || [];
        var llave = llaveDetalle(modelo, fila), i;

        if (llave === "") return null;
        for (i = 0; i < originales.length; i++) {
            if (llaveDetalle(modelo, originales[i]) === llave) return originales[i];
        }
        return null;
    }

    function igualesLineas(a, b) {
        var i;
        if (!a || !b || a.length !== b.length) return false;
        for (i = 0; i < a.length; i++) {
            if (String(a[i] === undefined ? "" : a[i]) !== String(b[i] === undefined ? "" : b[i])) return false;
        }
        return true;
    }

    /* La llave de una línea del detalle: el primer campo de su 'campos='.
       Vacía significa que la línea es nueva y todavía no está en la base. */
    function llaveDetalle(modelo, fila) {
        var valor;
        if (!modelo || !modelo.detalle || !fila) return "";
        valor = fila[0];
        if (valor === undefined || valor === null) return "";
        valor = String(valor).replace(/^\s+|\s+$/g, "");
        return (valor === "" || valor === "0") ? "" : valor;
    }

    /* Una línea del detalle, con su acción adelante:
           I  la línea es nueva
           U  la línea ya existía y se está grabando de nuevo
           D  la línea se quitó
       El paquete no tiene que adivinar qué hacer con cada una. */
    function lineaDetalle(modelo, fila, accion) {
        var mapeo = modelo.detalle.mapeo || [];
        var enviar = modelo.detalle.enviar || [];
        var partes = [accion], j, posicion, valor;

        /* Sin 'enviar=' viajan todos los campos, que es como se comportaba
           antes. Con 'enviar=' viajan solo los declarados y en ese orden: lo
           que la base ya sabe -el importe vigente, la secuencia, quién creó el
           registro- no tiene por qué venir del navegador, donde además se
           podría alterar. */
        if (enviar.length === 0) {
            for (j = 0; j < fila.length; j++) {
                partes.push(fila[j] === undefined || fila[j] === null ? "" : String(fila[j]));
            }
            return partes.join("|");
        }

        for (j = 0; j < enviar.length; j++) {
            posicion = posicionEnMapeo(mapeo, enviar[j]);
            valor = (posicion === -1) ? "" : fila[posicion];
            partes.push(valor === undefined || valor === null ? "" : String(valor));
        }
        return partes.join("|");
    }

    /* Las líneas del detalle, una por registro:
           I|<campos>  ¬  U|<campos>  ¬  D|<campos>
       Viajan en 'dataDetalle', que es un campo aparte del formulario, así que
       aquí sí se puede usar el separador de registro: el controlador no lo
       parte, solo lo engancha detrás del ¯.
       La cabecera no se repite: va en 'data' con su propio mapeo. */
    Ventana.tramaDetalle = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaDetalle : null;
        var partes = [], filas, original, i;

        if (!rejilla) return "";

        filas = rejilla.filas();
        for (i = 0; i < filas.length; i++) {
            original = originalDe(modelo, filas[i]);

            if (!original) {
                /* Sin llave o sin original: es una línea nueva. */
                partes.push(lineaDetalle(modelo, filas[i], "I"));
                continue;
            }
            /* Lo que no cambió no se manda: con una tabla que versiona cada
               fila, remandar las ocho líneas para tocar una generaría ocho
               versiones nuevas y ninguna diría nada. */
            if (igualesLineas(filas[i], original)) continue;
            partes.push(lineaDetalle(modelo, filas[i], "U"));
        }
        return partes.join(SEP_REGISTRO);
    };

    /* Busca otra línea con los mismos valores en las columnas de 'uk='.
       Devuelve su posición, o -1 si no hay repetida. */
    function repiteEnDetalle(modelo, filas, indice) {
        var uk = modelo.detalle.uk || [];
        var i, j, iguales;

        if (uk.length === 0) return -1;
        for (i = 0; i < filas.length; i++) {
            if (i === indice) continue;
            iguales = true;
            for (j = 0; j < uk.length; j++) {
                if (String(filas[i][uk[j]] || "") !== String(filas[indice][uk[j]] || "")) {
                    iguales = false;
                    break;
                }
            }
            /* Una línea a medio llenar no cuenta como repetida: molestaría al
               usuario apenas agrega la fila, antes de que elija nada. */
            if (iguales && String(filas[indice][uk[0]] || "") !== "") return i;
        }
        return -1;
    }

    function rotuloColumnas(rejilla, indices) {
        var columnas = rejilla.columnas(), textos = [], i;
        for (i = 0; i < indices.length; i++) {
            if (columnas[indices[i]]) textos.push(columnas[indices[i]].titulo);
        }
        return textos.join(" + ").toLowerCase();
    }

    /* Se llama en cuanto cambia una celda de la clave única. Avisa y deja la
       celda vacía, para que el usuario no siga cargando sobre un duplicado. */
    Ventana.revisarUnicoDetalle = function (tabla, indiceFila, indiceColumna) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaDetalle : null;
        var uk = (modelo && modelo.detalle) ? (modelo.detalle.uk || []) : [];
        var filas, i, esClave = false;

        if (!rejilla || uk.length === 0) return false;
        for (i = 0; i < uk.length; i++) {
            if (uk[i] === indiceColumna) esClave = true;
        }
        if (!esClave) return false;

        filas = rejilla.filas();
        if (repiteEnDetalle(modelo, filas, indiceFila) === -1) return false;

        Formulario.avisar(tabla, "A", "Ese " + rotuloColumnas(rejilla, uk) +
                          " ya está en el detalle. No se puede repetir.");
        for (i = 0; i < uk.length; i++) filas[indiceFila][uk[i]] = "";
        rejilla.refrescar();
        return true;
    };

    /* Revisa el detalle antes de mandarlo. Devuelve el mensaje del primer
       problema, o "" si está en condiciones. */
    function revisarDetalle(modelo) {
        var rejilla = modelo ? modelo.instanciaDetalle : null;
        var columnas, filas, editables, i, j, valor;

        if (!rejilla) return "";
        filas = rejilla.filas();
        if (filas.length === 0) return "Agregue al menos una línea al detalle.";

        columnas = rejilla.columnas();
        editables = modelo.detalle.editables || [];

        for (i = 0; i < filas.length; i++) {
            for (j = 0; j < editables.length; j++) {
                valor = filas[i][editables[j].columna];
                valor = (valor === undefined || valor === null) ? "" : String(valor);
                if (valor === "") {
                    return "Línea " + (i + 1) + ": falta " +
                           (columnas[editables[j].columna] || {}).titulo + ".";
                }
                if (editables[j].tipo === "fecha") {
                    /* Donde el navegador no dibuja el calendario, el control
                       de fecha se comporta como una caja de texto y devuelve
                       lo que el usuario alcanzó a teclear: un '2026' suelto
                       llegó así hasta Oracle y volvió como ORA-01840. Se
                       exige la fecha entera antes de salir del navegador. */
                    if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(valor)) {
                        return "Línea " + (i + 1) + ": la fecha está incompleta; " +
                               "escríbala como año-mes-día, por ejemplo " + hoyDetalle() + ".";
                    }
                    if (valor > hoyDetalle()) {
                        return "Línea " + (i + 1) + ": la fecha no puede ser posterior a hoy.";
                    }
                }
            }
            /* Última red antes de mandar: la base tiene su índice único y
               conviene decirlo con los rótulos de la pantalla y no con el
               nombre del índice. */
            if (repiteEnDetalle(modelo, filas, i) !== -1) {
                return "Línea " + (i + 1) + ": ese " +
                       rotuloColumnas(rejilla, modelo.detalle.uk) + " está repetido en el detalle.";
            }
        }
        return "";
    }

    function hoyDetalle() {
        var d = new Date();
        var m = d.getMonth() + 1;
        var dia = d.getDate();
        return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (dia < 10 ? "0" + dia : dia);
    }

    /* Alta: pantalla en blanco y acción 'I'. */
    Ventana.nuevo = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);
        Formulario.limpiar(tabla);
        /* La ventana acaba de quedar en blanco, así que los valores del
           paquete se ponen siempre: el periodo en curso, el 'No' de replicar,
           lo que la pantalla haya declarado. */
        aplicarPorDefecto(tabla, modelo, true);
        if (modelo) modelo.bajasDetalle = [];
        if (modelo && modelo.instanciaDetalle) modelo.instanciaDetalle.datos("");
        Formulario.auditoria(tabla, "I");
        aplicarBloqueo(tabla, "nuevo");
        Ventana.abrirPopup(tabla, (modelo && modelo.popup ? modelo.popup.titulo : "Nuevo"));
    };

    /* ------------------------------------------------------------ obtener -- */

    /* La llave de la fila. Sale de 'pk=' en la línea grilla del txt -o del
       primer campo del mapeo si no se declara-. Cada nombre se busca primero
       por posición dentro de la fila, que viene en el orden del mapeo de
       carga, y si no está ahí, entre los campos de la pantalla. */
    function llaveDe(modelo, fila) {
        var mapeo = modelo.mapeo || [];
        var llaves = camposPk(modelo);
        var datos = Formulario.valores(modelo.tabla);
        var partes = [], i, posicion, valor;

        for (i = 0; i < llaves.length; i++) {
            posicion = posicionEnMapeo(mapeo, llaves[i]);
            /* Lo normal es que la llave salga de la FILA: es el registro que
               el usuario señaló. Lo que no esté declarado en el mapeo de la
               carga se busca entre los campos de la pantalla -hay pantallas
               donde parte de la llave es un filtro-, y si tampoco está queda
               anotado: un nombre mal escrito viajaba vacío sin que nadie se
               enterara. */
            valor = (posicion === -1) ? valorDePantalla(modelo, datos, llaves[i]) : fila[posicion];
            partes.push(valor === undefined || valor === null ? "" : String(valor));
        }
        return partes.join("|");
    }

    /* El valor de un campo de la llave que no es una columna de la grilla. Si
       la pantalla tampoco lo tiene, se avisa: es casi siempre un nombre que no
       coincide con el del mapeo. */
    function valorDePantalla(modelo, datos, id) {
        if (datos[id] !== undefined) return datos[id];
        Ventana.registrar("La llave '" + id + "' de " + (modelo.tabla || "") +
                          " no está en el mapeo de la carga ni entre los campos de la pantalla.");
        return "";
    }

    /* La pk declarada, o el primer campo del mapeo si el txt no la declara. */
    function camposPk(modelo) {
        var mapeo = modelo.mapeo || [];
        if (modelo.grilla && modelo.grilla.pk && modelo.grilla.pk.length > 0) return modelo.grilla.pk;
        return mapeo.length > 0 ? [mapeo[0]] : [];
    }

    function posicionEnMapeo(mapeo, id) {
        var i;
        for (i = 0; i < mapeo.length; i++) {
            if (mapeo[i] === id) return i;
        }
        return -1;
    }

    /* Trae UN registro del paquete. La grilla ya tiene los datos a la vista,
       pero pueden estar viejos -otro usuario grabó mientras tanto- y además no
       trae las columnas que no se muestran. Por eso modificar y ver preguntan
       en vez de copiar la fila.

       La trama lleva delante PARA QUÉ se pide el registro:

           U|<llave>   se va a modificar
           O|<llave>   solo se va a mirar

       Ver no manda 'V' a propósito: esa letra es la de las validaciones que
       devuelve el paquete, y una misma letra para dos cosas distintas fue
       exactamente lo que hizo que la ventana de ver no abriera.

       Es la misma forma de gestionar -la acción primero- y le sirve al
       paquete para dos cosas que desde aquí no se pueden hacer: dejar la
       consulta anotada como tal y devolver lo que corresponde a cada caso
       -por ejemplo, no bloquear el registro cuando solo se está mirando-. */
    Ventana.obtener = function (tabla, llave, alTerminar, accion) {
        var frm = new FormData();
        var modelo = Formulario.modeloDe(tabla);

        frm.append("tabla", tabla);
        frm.append("data", (accion || "U") + "|" + llave);

        Http.postBytes(controladorDe(tabla) + "/Obtener", function (rpta) {
            /* Sin modo: aquí un 'V|' es una validación del paquete como en
               cualquier otra respuesta, porque el registro llega encabezado
               por 'U' o por 'O'. */
            var lectura = leerRespuesta(tabla, rpta);
            var registro;

            if (!lectura) return;
            registro = registroDeObtener(lectura, !!(modelo && modelo.detalle));
            if (registro === "") {
                Formulario.avisar(tabla, "A", "El registro ya no está disponible. Actualice la pantalla.");
                return;
            }
            /* Se pasa también la lectura completa: con detalle, las líneas
               vienen en el segundo segmento y la cabecera sola no alcanza. */
            if (typeof alTerminar === "function") alTerminar(registro, lectura);
        }, frm, {
            error: function (falla) { Formulario.avisar(tabla, "E", falla.mensaje); }
        });
    };

    /* Obtener devuelve un solo registro y no siempre en el mismo segmento:
       si el paquete antepone un mensaje, el registro queda en el segmento 1;
       si contesta pelado, viene en el 0. Se acepta cualquiera de las dos en
       vez de exigir una. */
    function registroDeObtener(lectura, conDetalle) {
        var registro;

        /* Con detalle la respuesta es 'dataPadre~dataDetalle': la cabecera es
           el segmento 0 y el 1 son las líneas. Sin detalle se acepta
           cualquiera de las dos formas, que es como venía funcionando. */
        if (conDetalle) {
            if (lectura.tipo !== "") return "";      /* vino solo un mensaje */
            return String(lectura.segmentos[0] || "").split(SEP_REGISTRO)[0] || "";
        }

        registro = primerRegistro(lectura.segmentos);
        if (registro !== "") return registro;
        if (lectura.tipo !== "") return "";
        return String(lectura.segmentos[0] || "").split(SEP_REGISTRO)[0] || "";
    }

    /* Deja la ventana como la quiere la pantalla para esa acción: todo
       habilitado y, encima, apagados los campos que el txt declara para ella.
       Un campo deshabilitado igual viaja en la trama -su valor se lee del
       control, no del envío del formulario-, así que sigue llegando al
       paquete. */
    function aplicarBloqueo(tabla, accion) {
        var modelo = Formulario.modeloDe(tabla);
        var reglas = modelo && modelo.popup ? modelo.popup.deshabilitar : null;
        var ids = [];

        Formulario.habilitar(tabla, true);
        if (!reglas) return;

        if (reglas.todas) ids = ids.concat(reglas.todas);
        if (reglas[accion]) ids = ids.concat(reglas[accion]);
        if (ids.length > 0) Formulario.habilitar(tabla, false, ids);
    }

    /* Modificar y ver piden el registro al paquete y, cuando llega, lo colocan
       con el mismo mapeo con que se lee la carga. */
    function abrirConRegistro(tabla, fila, soloLectura) {
        var modelo = Formulario.modeloDe(tabla);
        var titulo = modelo && modelo.popup ? modelo.popup.titulo : (soloLectura ? "Ver" : "Modificar");

        if (!fila) return;
        Ventana.obtener(tabla, llaveDe(modelo, fila), function (registro, lectura) {
            /* La ventana ya está construida desde el arranque: aquí solo se
               limpian los controles y se les asignan los valores, en el orden
               en que la plantilla los declara -o el que diga
               'mapeo|origen=obtener' si el paquete usa otro-. */
            Formulario.limpiar(tabla);
            /* Las bajas son de la ventana que se está abriendo, no de la
               anterior: si no se limpian, al modificar otro trabajador se
               mandarían las líneas que se quitaron del primero. */
            modelo.bajasDetalle = [];
            Formulario.ponerPorOrden(tabla, registro, modelo.mapeoObtener);
            Formulario.auditoria(tabla, "U");

            /* Las líneas del detalle llegan en el segundo segmento de la
               respuesta de 'obtener', separadas por ¬ como cualquier grilla. */
            if (modelo.instanciaDetalle) {
                modelo.instanciaDetalle.datos(
                    (lectura && lectura.segmentos.length > 1) ? lectura.segmentos[1] : "");
                recordarDetalle(modelo);
            }

            /* Ver bloquea todo; modificar solo lo que declare el txt. */
            if (soloLectura) Formulario.habilitar(tabla, false);
            else aplicarBloqueo(tabla, "editar");
            Ventana.abrirPopup(tabla, titulo);
        }, soloLectura ? "O" : "U");
    }

    Ventana.editar = function (tabla, fila) {
        abrirConRegistro(tabla, fila, false);
    };

    Ventana.ver = function (tabla, fila) {
        abrirConRegistro(tabla, fila, true);
    };

    /* ----------------------------------------------------------- exportar -- */

    /* Tipos que entiende Cadena.ConvertirTabla: los concatena a 'System.' y
       hace Convert.ChangeType, que revienta con una celda vacía. Por eso una
       columna solo viaja como número si TODOS sus valores lo son. */
    var TIPOS_NET = { numero: "Int32", decimal: "Decimal", fecha: "DateTime" };

    function tipoExportado(columna, filas, indice) {
        var nombre = TIPOS_NET[columna.tipo], i, valor;

        if (!nombre) return "String";
        for (i = 0; i < filas.length; i++) {
            valor = filas[i][indice];
            if (valor === "" || valor === null || valor === undefined) return "String";
            if (nombre !== "DateTime" && isNaN(Number(valor))) return "String";
        }
        return nombre;
    }

    /* El servidor espera cuatro bloques separados por el separador de
       registro: títulos, anchos, tipos y después una línea por fila. */
    function tramaExportacion(columnas, filas) {
        var titulos = [], anchos = [], tipos = [], lineas = [], i, j, fila;

        for (j = 0; j < columnas.length; j++) {
            if (columnas[j].oculto) continue;
            titulos.push(columnas[j].titulo);
            anchos.push(columnas[j].ancho || "120");
            tipos.push(tipoExportado(columnas[j], filas, j));
        }
        for (i = 0; i < filas.length; i++) {
            fila = [];
            for (j = 0; j < columnas.length; j++) {
                if (columnas[j].oculto) continue;
                fila.push(limpiarSeparadores(filas[i][j]));
            }
            lineas.push(fila.join("|"));
        }
        return [titulos.join("|"), anchos.join("|"), tipos.join("|")].concat(lineas).join(SEP_REGISTRO);
    }

    /* Un dato que traiga un separador partiría la trama en dos. */
    var SEPARADORES = new RegExp("[|" + SEP_REGISTRO + SEP_SEGMENTO + SEP_LISTA + "]", "g");

    function limpiarSeparadores(valor) {
        return String(valor === null || valor === undefined ? "" : valor).replace(SEPARADORES, " ");
    }

    var MIME_EXCEL = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

    /* Va por Http.postBytes y no por un formulario porque FiltroUrl exige la
       cabecera 'xhr', que un submit normal no manda: sin ella el filtro
       redirige al Login y el usuario baja la página de ingreso en vez del
       Excel. postBytes ya pide arraybuffer, así que llega el binario entero. */
    Ventana.excel = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaGrilla : null;
        var nombre = nombreArchivo(modelo, tabla);
        var filas, frm;

        if (!rejilla) { Ventana.registrar("No hay grilla que exportar en " + tabla); return false; }

        filas = rejilla.visibles();
        if (filas.length === 0) {
            Formulario.avisar(tabla, "A", "No hay registros que exportar.");
            return false;
        }

        frm = new FormData();
        frm.append("archivo", nombre);
        frm.append("data", tramaExportacion(rejilla.columnas(), filas));

        Http.postBytes(controladorDe(tabla) + "/Exportar", function (rpta) {
            /* Aquí no se descomprime ni se parte en segmentos: lo que vuelve
               es el .xlsx tal cual lo armó ExcelMemory. */
            if (!descargar(rpta, nombre)) {
                Formulario.avisar(tabla, "E", "El servidor no devolvió el archivo.");
            }
        }, frm, {
            error: function (falla) { Formulario.avisar(tabla, "E", falla.mensaje); }
        });
        return true;
    };

    /* El documento adjunto de una fila. Lo dispara el icono de la columna
       'adjunto', que manda el NOMBRE del archivo y no la fila: es lo único que
       la grilla tiene de él, porque la trama solo trae el nombre.

       El binario lo devuelve el controlador; aquí solo se pide y se guarda. */
    var MIME_PDF = "application/pdf";

    Ventana.adjunto = function (tabla, archivo) {
        var nombre = Grilla.adjunto.deTrama(archivo), frm;

        if (nombre === "") {
            Formulario.avisar(tabla, "A", "El registro no tiene documento adjunto.");
            return false;
        }

        frm = new FormData();
        frm.append("archivo", limpiarSeparadores(nombre));

        Http.postBytes(controladorDe(tabla) + "/Adjunto", function (rpta) {
            /* Vuelve el archivo tal cual: no se descomprime ni se parte en
               segmentos. */
            if (!descargar(rpta, nombre, MIME_PDF)) {
                Formulario.avisar(tabla, "E", "El servidor no devolvió el documento " + nombre + ".");
            }
        }, frm, {
            error: function (falla) { Formulario.avisar(tabla, "E", falla.mensaje); }
        });
        return true;
    };

    /* Guarda un binario como archivo. Chrome 49 tiene Blob, createObjectURL y
       el atributo download; el enlace se pulsa por código y se retira. La URL
       del objeto se libera después, si no el archivo queda en memoria hasta
       que se cierre la pestaña. */
    function descargar(datos, nombre, mime) {
        var bloque, url, enlace;

        if (!datos || (datos.byteLength !== undefined && datos.byteLength === 0)) return false;
        if (typeof Blob !== "function" && typeof Blob !== "object") return false;

        bloque = new Blob([datos], { type: mime || MIME_EXCEL });
        if (window.navigator && window.navigator.msSaveBlob) {
            window.navigator.msSaveBlob(bloque, nombre);
            return true;
        }

        url = window.URL.createObjectURL(bloque);
        enlace = document.createElement("a");
        enlace.href = url;
        enlace.download = nombre;
        enlace.style.display = "none";
        document.body.appendChild(enlace);
        enlace.click();
        document.body.removeChild(enlace);
        window.setTimeout(function () { window.URL.revokeObjectURL(url); }, 1000);
        return true;
    }

    /* El nombre sale de 'archivo=' en la línea grilla del txt; si no está, se
       usa el título de la pantalla. Viaja al servidor y vuelve como nombre de
       descarga, así que se le quitan barras y saltos de línea. */
    function nombreArchivo(modelo, tabla) {
        var declarado = modelo && modelo.grilla ? modelo.grilla.archivo : "";
        var base = declarado !== "" ? declarado : (modelo && modelo.titulo ? modelo.titulo : tabla);
        var limpio = base.replace(/[^0-9A-Za-zÁÉÍÓÚÑáéíóúñ ._-]/g, "").replace(/\s+/g, "_");

        if (limpio === "") limpio = tabla;
        return /\.[0-9A-Za-z]+$/.test(limpio) ? limpio : limpio + ".xlsx";
    }

    Ventana.cerrar = function (tabla) {
        Ventana.cerrarPopup(tabla);
        /* Se devuelve la ventana a su estado normal: el bloqueo es de la
           acción con que se abrió, no de la pantalla. */
        Formulario.habilitar(tabla, true);
    };

    /* ---------------------------------------------------------- eliminar -- */

    function confirmar(mensaje, alAceptar) {
        var mostrado = false;
        if (typeof Mensaje !== "undefined" && Mensaje && typeof Mensaje.mostrarMensaje === "function") {
            mostrado = Mensaje.mostrarMensaje("A", mensaje, function (rpta) {
                if (rpta) alAceptar();
            }) === true;
        }
        if (mostrado) return;
        if (window.confirm(mensaje)) alAceptar();
    }

    /* El nombre de la fila para los mensajes. Sale de 'rotulo=' en la línea
       grilla del txt: dice qué campo la identifica para una persona. Se pasa
       por la traducción de la columna, así el aviso dice 'Activo' y no 'A'. */
    function rotuloDeFila(modelo, fila) {
        var id = modelo && modelo.grilla ? modelo.grilla.rotulo : "";
        var posicion, texto;

        if (!id || !fila) return "";
        posicion = posicionEnMapeo(modelo.mapeo || [], id);
        if (posicion === -1) return "";

        texto = fila[posicion] === undefined || fila[posicion] === null ? "" : String(fila[posicion]);
        if (modelo.instanciaGrilla && modelo.instanciaGrilla.textoDe) {
            texto = String(modelo.instanciaGrilla.textoDe(posicion, texto));
        }
        return texto.replace(/^\s+|\s+$/g, "");
    }

    /* Los campos que viajan al dar de baja. Por omisión, la pk y quién la
       hace: para cerrar la vigencia de un registro alcanza con decir cuál es,
       y la auditoría necesita saber de quién fue la mano. Si un paquete
       necesita algo más -o menos-, el txt lo declara con
       'mapeo|origen=eliminar'. */
    function camposDeBaja(modelo) {
        if (modelo.mapeoEliminar && modelo.mapeoEliminar.length > 0) return modelo.mapeoEliminar;
        return camposPk(modelo).concat(["ActualizadoPor"]);
    }

    /* La trama de una baja, armada DESDE LA FILA de la grilla:

           D|<llave>

       Antes se volcaba la fila entera en los controles y se mandaba la trama
       de grabar, así que para borrar el registro 4 viajaban también el
       periodo, la oficina, las horas, el adjunto y el motivo. Eso es trabajo
       de más para el paquete y, sobre todo, es dato que el navegador no tiene
       por qué estar dictando: la baja no cambia el contenido del registro. De
       paso desaparece un efecto raro -pisar los controles de la ventana de
       mantenimiento con la fila que se estaba borrando-. */
    function tramaDeBaja(tabla, fila) {
        var modelo = Formulario.modeloDe(tabla);
        var mapeo, campos, partes = [], i, posicion, valor, datos;

        if (!modelo || !fila) return null;
        mapeo = modelo.mapeo || [];
        datos = Formulario.valores(tabla);
        campos = camposDeBaja(modelo);
        if (campos.length === 0) {
            Ventana.registrar("La plantilla de " + tabla +
                              " no declara pk ni 'mapeo|origen=eliminar'; no se sabe qué registro borrar.");
            return null;
        }

        /* La acción encabeza la trama, como en grabar. Si el txt la nombra
           entre los campos se respeta su lugar; si no, va adelante. */
        if (posicionEnLista(campos, "CodigoAccion") === -1) partes.push("D");

        for (i = 0; i < campos.length; i++) {
            if (campos[i] === "CodigoAccion") { partes.push("D"); continue; }
            /* Quién borra sale de la sesión y no de la fila: la grilla trae lo
               que dice el registro -quién lo tocó la vez anterior-, y lo que la
               auditoría de la baja necesita es el usuario que la está haciendo
               ahora. Es el mismo dato que 'auditoria' pone al modificar. */
            if (campos[i] === "ActualizadoPor") { partes.push(Formulario.usuario()); continue; }
            posicion = posicionEnMapeo(mapeo, campos[i]);
            /* Lo que no viene en la fila se toma de la pantalla: hay datos que
               la grilla no muestra pero el paquete necesita, y que viven en un
               campo oculto. */
            valor = (posicion === -1) ? valorDePantalla(modelo, datos, campos[i]) : fila[posicion];
            partes.push(valor === undefined || valor === null ? "" : String(valor));
        }
        return partes.join("|");
    }

    function posicionEnLista(lista, texto) {
        var i;
        for (i = 0; i < lista.length; i++) if (lista[i] === texto) return i;
        return -1;
    }

    /* Eliminar no borra: cierra la vigencia del registro que se señala. */
    Ventana.eliminar = function (tabla, fila) {
        var nombre = rotuloDeFila(Formulario.modeloDe(tabla), fila);
        var aviso = nombre === ""
            ? "¿Confirma la eliminación del registro seleccionado?"
            : "¿Confirma la eliminación del registro " + nombre + "?";

        if (!fila) return;
        confirmar(aviso, function () {
            var trama = tramaDeBaja(tabla, fila);
            if (trama === null) {
                Formulario.avisar(tabla, "E", "La pantalla no está configurada para eliminar.");
                return;
            }
            enviarGestion(tabla, trama);
        });
    };

    Ventana.eliminarMultiple = function (tabla, filas) {
        var cantidad = filas ? filas.length : 0;

        if (cantidad === 0) {
            Formulario.avisar(tabla, "A", "No hay registros marcados.");
            return;
        }
        confirmar("¿Confirma la eliminación de " + cantidad + " registro(s)?", function () {
            var tramas = [], i, trama;
            for (i = 0; i < filas.length; i++) {
                trama = tramaDeBaja(tabla, filas[i]);
                if (trama === null) {
                    Formulario.avisar(tabla, "E", "La pantalla no está configurada para eliminar.");
                    return;
                }
                tramas.push(trama);
            }
            enviarGestion(tabla, tramas.join(SEP_REGISTRO));
        });
    };

    /* ----------------------------------------------------------- cancelar -- */

    /* Con ventana de mantenimiento, Cancelar la cierra y descarta lo escrito.
       Sin ella, deshace volviendo a pedir lo que hay en la base. */
    Ventana.cancelar = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);

        if (modelo && modelo.popup) {
            Formulario.limpiar(tabla);
            Ventana.cerrar(tabla);
            return;
        }
        Formulario.limpiar(tabla);
        if (Ventana.hayCambios(tabla)) Ventana.cargar(tabla);
    };

    return Ventana;
})();

var Descomprimir = (function () {
    function Descomprimir() { }

    Descomprimir.Deflate = function (bytesComprimido) {
        var arrayComprimido = new Uint8Array(bytesComprimido);
        var bytesDescomprimido = pako.inflate(arrayComprimido, { raw: true });
        var dataDescomprimida = ab2str(bytesDescomprimido);
        return dataDescomprimida;
    }

    function ab2str(bytes) {
        var rpta = "";
        for (var k = 0; k < bytes.length; k++) {
            rpta += String.fromCharCode(bytes[k]);
        }
        return rpta;
    }

    return Descomprimir;
})();

var Mensaje = (function () {
    /* El marcado del diálogo vive UNA sola vez, en Escritorio.cshtml, con el id
       divPantMensaje. Una pantalla cargada dentro de #ifrPagina no lo tiene en
       su propio documento: le pide el diálogo al padre, y así el velo cubre
       toda la ventana en vez del rectángulo del marco.

       Antes el overlay se buscaba una sola vez al cargar el archivo y se
       guardaba en una variable; en una vista sin el marcado quedaba en null
       para siempre. Ahora se resuelve en cada llamada.                       */
    var ID_DIALOGO = "divPantMensaje";
    var respuestaCallback = null;

    function Mensaje() {
    }

    function overlayPropio() {
        return document.getElementById(ID_DIALOGO);
    }

    /* Mensaje del documento padre, cuando esta pantalla corre dentro del marco
       y no tiene diálogo propio. Same-origin; si no lo fuera, el try lo cubre. */
    function mensajeDelPadre() {
        try {
            if (window.parent && window.parent !== window &&
                window.parent.Mensaje && window.parent.document &&
                window.parent.document.getElementById(ID_DIALOGO)) {
                return window.parent.Mensaje;
            }
        } catch (e) {
            /* otro origen: se trabaja solo con el documento actual */
        }
        return null;
    }

    Mensaje.configurarMensaje = function () {
        var popupOverlay = overlayPropio();
        /* Sin marcado propio no hay nada que enganchar: los botones que atienden
           la respuesta son los del padre y los engancha el padre. */
        if (!popupOverlay) return false;
        closePopup();
        var popupCloseBtn = document.getElementById('popupCloseBtn');
        var popupCancelBtn = document.getElementById('popupCancelBtn');
        if (popupCloseBtn) {
            popupCloseBtn.onclick = function () {
                if (respuestaCallback) respuestaCallback(false);
                closePopup();
            }
        }
        if (popupCancelBtn) {
            popupCancelBtn.onclick = function () {
                if (respuestaCallback) respuestaCallback(false);
                closePopup();
            }
        }
        var popupOkBtn = document.getElementById('popupOkBtn');
        if (popupOkBtn){
            popupOkBtn.onclick = function(){
                if (respuestaCallback) respuestaCallback(true);
                closePopup();
            }
        }
    }

    function closePopup() {
        var popupOverlay = overlayPropio();
        if (popupOverlay) {
            popupOverlay.style.display = "none";
            popupOverlay.classList.remove('active');
            respuestaCallback = null;
        }
    }

    function openPopup() {
        var popupOverlay = overlayPropio();
        if (popupOverlay) {
            popupOverlay.style.display = "flex";
            popupOverlay.classList.add('active');
        }
    }
    
    var ICONOS_MENSAJE = {
        confirmacion: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
        advertencia: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
        error: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>'
    };

    /* Devuelve true si alcanzó a mostrar el mensaje y false si la pantalla no
       tiene el marcado del popup (divPM). Antes no se validaba: en una vista
       sin divPM, divPMW quedaba null y la primera línea lanzaba TypeError, con
       lo que se perdía el clic completo -por ejemplo el de Cerrar sesión- sin
       ningún aviso. Quien llama puede usar el false para caer a confirm().   */
    Mensaje.mostrarMensaje = function (tipo, mensaje, callback) {
        var popupOverlay = overlayPropio();
        var delPadre, divPMW, popupTitleIcon, popupOkBtn, popupTitleText,
            popupMessageText, popupCancelBtn;

        /* Sin diálogo propio se delega COMPLETO al padre, no solo el dibujo:
           así la respuesta del usuario y el callback quedan en el mismo módulo
           que enganchó los botones. */
        if (!popupOverlay) {
            delPadre = mensajeDelPadre();
            if (delPadre) return delPadre.mostrarMensaje(tipo, mensaje, callback);
            if (typeof console !== "undefined" && console && console.warn) {
                console.warn("[Mensaje] No hay diálogo (" + ID_DIALOGO + ") en esta pantalla ni en la que la contiene; no se pudo mostrar: " + mensaje);
            }
            return false;
        }

        divPMW = document.getElementById("divPMW");
        popupTitleIcon = document.getElementById('popupTitleIcon');
        popupOkBtn = document.getElementById('popupOkBtn');
        popupTitleText = document.getElementById('popupTitleText');
        popupMessageText = document.getElementById('popupMessageText');
        popupCancelBtn = document.getElementById('popupCancelBtn');

        if (!divPMW || !popupTitleIcon || !popupOkBtn || !popupTitleText || !popupMessageText) {
            if (typeof console !== "undefined" && console && console.warn) {
                console.warn("[Mensaje] El marcado de " + ID_DIALOGO + " está incompleto; no se pudo mostrar: " + mensaje);
            }
            return false;
        }

        respuestaCallback = (typeof callback === "function") ? callback : null;
        divPMW.classList.remove('confirmacion', 'advertencia', 'error');
        switch (tipo) {
            case "C":
                divPMW.classList.add('confirmacion');
                popupTitleIcon.innerHTML = ICONOS_MENSAJE.confirmacion;
                popupTitleText.textContent = "Confirmación";
                popupOkBtn.textContent = 'Aceptar';
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
            case "A":
                divPMW.classList.add('advertencia');
                popupTitleIcon.innerHTML = ICONOS_MENSAJE.advertencia;
                popupTitleText.textContent = "Advertencia";
                /* La misma 'A' sirve para preguntar -"¿Confirma la
                   eliminación?"- y para avisar -"No hay datos con los
                   parámetros seleccionados"-. Lo que las distingue es si quien
                   llamó espera una respuesta: solo entonces tiene sentido
                   ofrecer Cancelar. Un aviso con dos botones obliga a elegir
                   entre dos caminos que llevan al mismo sitio. */
                popupOkBtn.textContent = respuestaCallback ? 'Continuar' : 'Aceptar';
                if (popupCancelBtn) {
                    popupCancelBtn.style.display = respuestaCallback ? "inline-block" : "none";
                }
                break;
            /* La validación se ve como una advertencia -no es una falla del
               sistema sino un reparo a lo que se pidió- pero con un solo botón:
               no hay nada que confirmar, la operación ya no se hizo. */
            case "V":
                divPMW.classList.add('advertencia');
                popupTitleIcon.innerHTML = ICONOS_MENSAJE.advertencia;
                popupTitleText.textContent = "Validación";
                popupOkBtn.textContent = 'Aceptar';
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
            case "E":
                divPMW.classList.add('error');
                popupTitleIcon.innerHTML = ICONOS_MENSAJE.error;
                popupTitleText.textContent = "Error";
                popupOkBtn.textContent = 'Continuar';
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
            case "U":
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
            default:
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
        }
        popupMessageText.textContent = mensaje;
        openPopup();
        return true;
    }

    return Mensaje;
})();

</script>
<script>

/* Servidor falso: responde como el paquete dvpkg_spT01FUN.
       combos ~ grilla ~ ayuda ~ valores por defecto ~ resumen           */
Descomprimir.Deflate = function (x) { return x; };

var PERIODOS = "202612|202612¬202611|202611¬202610|202610¬202609|202609¬202608|202608¬202607|202607¬202606|202606¬202605|202605¬202604|202604¬202603|202603¬202602|202602¬202601|202601";
var FILAS = "1|202609|7800|7900|GERENCIA BANCA DIGITAL|1220:00¬2|202609|7800|8300|GERENCIA DE TECNOLOGÍAS DE INFORMACIÓN|612:30¬3|202609|7800|7800|GERENCIA DE INNOVACIÓN Y TRANSFORMACIÓN DIGITAL|209:30¬4|202608|7800|7900|GERENCIA BANCA DIGITAL|1180:00".split("\u00ac");
var AYUDA = "|7800|GERENCIA DE INNOVACIÓN Y TRANSFORMACIÓN DIGITAL|8600|SUBGERENCIA DE ARQUITECTURA|8700|SUBGERENCIA DE CIBERSEGURIDAD";
var CUOTAS = { "202609": "2636:00", "202608": "2400:00" };

function aMin(h) {
    var p = String(h || "0:00").split(":");
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
}
function aHora(m) {
    var mm = Math.abs(m) % 60;
    return (m < 0 ? "-" : "") + Math.floor(Math.abs(m) / 60) + ":" + (mm < 10 ? "0" + mm : mm);
}

/* Las filas del periodo. Las dos cantidades suman: una linea es global o
   individual, y la otra viene en 0:00. */
function filasDe(periodo) {
    var visibles = [], usados = 0, i, c;
    for (i = 0; i < FILAS.length; i++) {
        c = FILAS[i].split("|");
        if (c[1] !== periodo) continue;
        visibles.push(FILAS[i]);
        usados += aMin(c[5]);
    }
    return { filas: visibles.join("\u00ac"), usados: usados };
}

function resumenDe(periodo) {
    var asignada = CUOTAS[periodo] || "0:00";
    var usados = filasDe(periodo).usados;
    return asignada + "|" + aHora(usados) + "|" + aHora(aMin(asignada) - usados);
}

/* La respuesta de cargar y de consultar: cinco segmentos. */
function responder(periodo) {
    return PERIODOS + "~" + filasDe(periodo).filas + "~" + AYUDA +
           "~Periodo=" + periodo + "\u00a6PeriodoPop=" + periodo +
           "~" + resumenDe(periodo);
}

/* La de gestionar: mensaje ~ datosGrilla ~ datosResumen. */
function responderGestion(mensaje, periodo) {
    return mensaje + "~" + filasDe(periodo).filas + "~" + resumenDe(periodo);
}

window.__pedidos = [];

Http.postBytes = function (url, callback, data) {
