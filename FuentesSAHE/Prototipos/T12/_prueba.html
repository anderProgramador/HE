       Las funciones heredadas (obtenerDatos, limpiarDatos, setearDatos,
       deshabilitarControles, ocultarControles, setearDatosAuditoria) rastrean
       el DOM por clases de una letra: G+tabla para grabar, R+tabla requerido,
       N+tabla número, F+tabla fecha, S+tabla setear, V/D/L+tabla para
       habilitar u ocultar. Cada letra es un canal distinto y sin documentar, y
       obtenerDatos además depende del ORDEN en que los controles quedaron en
       el DOM: mover un campo en la plantilla cambia en silencio la trama que
       recibe Oracle.

       Aquí se trabaja contra el modelo que ya devolvió Plantilla, donde cada
       campo tiene nombre, tipo y reglas. Las funciones públicas de Ventana
       reparten: si la tabla tiene modelo usan esto, y si no, siguen con el
       camino heredado, de modo que las pantallas copiadas de EDDO no se tocan.

       ES5 en modo estricto, sin librerías. Cierre único para el registro de
       modelos, funciones cortas de una sola responsabilidad y ningún global.
       ===================================================================== */
    var Formulario = (function () {
        "use strict";

        /* En 'archivo' el valor lo lleva la caja de texto (txt), no el input
           de tipo file (fup), que solo sirve para elegir el archivo. */
        var PREFIJOS = {
            number: "num", text: "txt", textarea: "txa", archivo: "txt",
            select: "cbo", checkbox: "chk", fecha: "dat", oculto: "hdn"
        };

        var modelos = {};
        var cambios = {};

        /* ------------------------------------------------------- registro -- */

        function registrar(modelo) {
            if (modelo && modelo.tabla) {
                modelos[modelo.tabla] = modelo;
                cambios[modelo.tabla] = false;
            }
            return modelo;
        }

        function modeloDe(tabla) {
            return modelos[tabla] || null;
        }

        /* Lista plana: los campos de todas las secciones más los ocultos, tanto
           de la pantalla principal como de la ventana de mantenimiento. Los del
           popup también se validan, se leen y se graban. */
        function campos(tabla) {
            var modelo = modeloDe(tabla);
            var lista = [];

            if (!modelo) return lista;
            acumularCampos(modelo, lista);
            if (modelo.popup) acumularCampos(modelo.popup, lista);
            return lista;
        }

        function acumularCampos(origen, lista) {
            var i, j, seccion, nSecciones, nCampos, nOcultos;

            /* Con 'todos' se conserva el orden del txt. Sin él -formato
               heredado- se cae al orden viejo: visibles y después ocultos. */
            if (origen.todos && origen.todos.length > 0) {
                for (i = 0; i < origen.todos.length; i++) lista.push(origen.todos[i]);
                return;
            }

            nSecciones = origen.secciones.length;
            for (i = 0; i < nSecciones; i++) {
                seccion = origen.secciones[i];
                nCampos = seccion.campos.length;
                for (j = 0; j < nCampos; j++) lista.push(seccion.campos[j]);
            }
            nOcultos = origen.ocultos.length;
            for (i = 0; i < nOcultos; i++) lista.push(origen.ocultos[i]);
        }

        function control(campo) {
            return document.getElementById((PREFIJOS[campo.tipo] || "txt") + campo.id);
        }

        function campoPorId(tabla, id) {
            var lista = campos(tabla), i, n = lista.length;
            for (i = 0; i < n; i++) {
                if (lista[i].id === id) return lista[i];
            }
            return null;
        }

        /* ------------------------------------------------- leer y escribir -- */

        function valorDeControl(elemento, campo) {
            if (!elemento) return "";
            if (campo.tipo === "checkbox") return elemento.checked ? (campo.valor || "1") : "";
            return elemento.value;
        }

        /* Devuelve un objeto { idCampo: valor }. */
        function valores(tabla) {
            var lista = campos(tabla), salida = {}, i, n = lista.length, campo, elemento;

            for (i = 0; i < n; i++) {
                campo = lista[i];
                elemento = control(campo);
                salida[campo.id] = valorDeControl(elemento, campo);
            }
            return salida;
        }

        /* Trama con claves: reordenar la pantalla ya no cambia lo que llega al
           procedimiento almacenado. */
        function trama(tabla) {
            var datos = valores(tabla), claves = Object.keys(datos), partes = [], i, n = claves.length;

            for (i = 0; i < n; i++) {
                partes.push(claves[i] + "=" + datos[claves[i]]);
            }
            return partes.join("|");
        }

        /* Acepta tres formas:
             - objeto            { MultiploMinutos: "15", ... }
             - trama con claves  "MultiploMinutos=15|MinutosIniciales=15"
             - trama posicional  "U|190|15|15|..."  (la que devuelve Oracle),
               que se traduce con el mapeo declarado en la plantilla.        */
        /* Trama posicional en el orden que declara la línea 'mapeo' de la
           plantilla, que es el que espera el paquete de Oracle. Devuelve null
           si la plantilla no lo declara, para no mandar una trama al azar. */
        function tramaPosicional(tabla) {
            var modelo = modeloDe(tabla);
            var datos, mapeo, partes = [], i, n, valor;

            if (!modelo) return null;
            mapeo = (modelo.mapeoGrabar && modelo.mapeoGrabar.length > 0) ? modelo.mapeoGrabar : modelo.mapeo;
            if (!mapeo || mapeo.length === 0) return null;

            datos = valores(tabla);
            n = mapeo.length;
            for (i = 0; i < n; i++) {
                valor = datos[mapeo[i]];
                partes.push(valor === undefined || valor === null ? "" : valor);
            }
            return partes.join("|");
        }

        function comoObjeto(datos, tabla) {
            var salida = {}, partes, i, n, corte, par, modelo, mapeo;

            if (!datos) return salida;
            if (typeof datos === "object") return datos;

            partes = String(datos).split("|");
            n = partes.length;

            if (String(datos).indexOf("=") === -1) {
                modelo = modeloDe(tabla);
                mapeo = modelo ? modelo.mapeo : null;
                if (!mapeo || mapeo.length === 0) return salida;
                for (i = 0; i < mapeo.length && i < n; i++) {
                    salida[mapeo[i]] = partes[i];
                }
                return salida;
            }

            for (i = 0; i < n; i++) {
                par = partes[i];
                if (par === undefined || par === "") continue;
                corte = par.indexOf("=");
                if (corte === -1) continue;
                salida[par.substring(0, corte)] = par.substring(corte + 1);
            }
            return salida;
        }

        /* Oracle a veces manda el código -'A'- y a veces la descripción
           -'Activo'-. Un select se queda vacío si el valor no es el de ninguna
           opción, así que cuando no calza por valor se busca por texto. */
        function asignar(campo, elemento, valor) {
            var texto = valor === null || valor === undefined ? "" : String(valor);
            var i;

            if (campo.tipo === "checkbox") { elemento.checked = (texto !== "" && texto !== "0"); return; }

            elemento.value = texto;
            if (elemento.tagName !== "SELECT" || texto === "" || elemento.value === texto) return;

            for (i = 0; i < elemento.options.length; i++) {
                if (String(elemento.options[i].text) === texto) {
                    elemento.selectedIndex = i;
                    return;
                }
            }
        }

        function poner(tabla, datos) {
            var valoresNuevos = comoObjeto(datos, tabla);
            var lista = campos(tabla), i, n = lista.length, campo, elemento;

            for (i = 0; i < n; i++) {
                campo = lista[i];
                if (!(campo.id in valoresNuevos)) continue;
                elemento = control(campo);
                if (!elemento) continue;
                asignar(campo, elemento, valoresNuevos[campo.id]);
            }
            refrescarContadores(tabla);
            limpiarErrores(tabla);
            marcarCambios(tabla, false);
        }

        /* Un solo campo, sin tocar el resto ni borrar los errores: es lo que
           necesita la lupa al devolver lo que el usuario eligió. */
        function ponerUno(tabla, id, valor) {
            var lista = campos(tabla), i, n = lista.length, elemento;

            for (i = 0; i < n; i++) {
                if (lista[i].id !== id) continue;
                elemento = control(lista[i]);
                if (!elemento) return false;
                asignar(lista[i], elemento, valor);
                marcarCambios(tabla, true);
                return true;
            }
            return false;
        }

        /* Los ids de los controles en el orden en que la plantilla los
           declara: primero los de la pantalla, después los del popup, y en
           cada uno los visibles antes que los ocultos. Es el orden en que se
           construyó la ventana, y por lo tanto el que espera 'obtener'
           cuando el txt no declara un mapeo propio. */
        function ordenDeControles(tabla) {
            var modelo = modeloDe(tabla);
            var lista = [], salida = [], i;

            /* Solo los controles de la ventana de mantenimiento: 'obtener'
               llena ESA ventana. Si se tomaran todos los campos, un filtro de
               la pantalla principal -como el trabajador de T17- se comería la
               primera posición y todo lo demás llegaría corrido. */
            if (modelo && modelo.popup) acumularCampos(modelo.popup, lista);
            else lista = campos(tabla);

            for (i = 0; i < lista.length; i++) salida.push(lista[i].id);
            return salida;
        }

        /* Coloca una trama posicional sobre los controles ya construidos. No
           se rehace la ventana: solo se asignan valores. */
        function ponerPorOrden(tabla, datos, ids) {
            var partes = String(datos === null || datos === undefined ? "" : datos).split("|");
            var orden = (ids && ids.length > 0) ? ids : ordenDeControles(tabla);
            var i, campo, elemento;

            for (i = 0; i < orden.length && i < partes.length; i++) {
                campo = campoPorId(tabla, orden[i]);
                if (!campo) continue;
                elemento = control(campo);
                if (elemento) asignar(campo, elemento, partes[i]);
            }
            refrescarContadores(tabla);
            limpiarErrores(tabla);
            marcarCambios(tabla, false);
        }

        /* Pinta el contador de un campo con lo que tiene escrito. Se llama al
           teclear y también después de colocar datos: al abrir el popup para
           modificar, el número tiene que arrancar con lo que ya hay. */
        function refrescarContador(campo) {
            var caja = document.getElementById("cnt" + campo.id);
            var elemento, usado, tope;

            if (!caja) return;
            elemento = control(campo);
            if (!elemento) return;

            usado = String(elemento.value || "").length;
            tope = Number(campo.contador === "si" ? campo.largo : campo.contador) || 0;
            caja.firstChild.innerHTML = "";
            caja.firstChild.appendChild(document.createTextNode(String(usado)));
            /* Se avisa al acercarse al tope, no cuando ya no entra: para
               entonces el navegador dejó de aceptar teclas y el usuario no
               sabe por qué. */
            caja.className = (tope > 0 && usado >= tope * 0.9)
                ? "campo__contador campo__contador--al-limite"
                : "campo__contador";
        }

        function refrescarContadores(tabla, id) {
            var lista = campos(tabla), i;
            for (i = 0; i < lista.length; i++) {
                if (id !== undefined && lista[i].id !== id) continue;
                refrescarContador(lista[i]);
            }
        }

        function limpiar(tabla) {
            var lista = campos(tabla), i, n = lista.length, campo, elemento, archivo, porDefecto;

            for (i = 0; i < n; i++) {
                campo = lista[i];
                elemento = control(campo);
                if (!elemento) continue;

                porDefecto = elemento.getAttribute("data-default");
                if (campo.tipo === "checkbox") elemento.checked = false;
                else elemento.value = porDefecto === null ? "" : porDefecto;

                /* El input de archivo va aparte: la caja de texto solo muestra
                   el nombre y hay que soltar también el archivo elegido. */
                if (campo.tipo === "archivo") {
                    archivo = document.getElementById("fup" + campo.id);
                    if (archivo) archivo.value = "";
                }
            }
            refrescarContadores(tabla);
            limpiarErrores(tabla);
            avisar(tabla, "", "");
            marcarCambios(tabla, false);
        }

        /* ------------------------------------------------------- validación -- */

        function bloqueDe(campo) {
            return document.querySelector("[data-campo='" + campo.id + "']");
        }

        function marcarError(campo, mensaje) {
            var bloque = bloqueDe(campo), parrafo;

            if (!bloque) return;
            parrafo = bloque.querySelector(".campo__error");
            if (parrafo) parrafo.textContent = mensaje || "";

            if (mensaje) {
                if ((" " + bloque.className + " ").indexOf(" campo--error ") === -1) {
                    bloque.className += " campo--error";
                }
            } else {
                bloque.className = bloque.className.replace(" campo--error", "");
            }
        }

        function limpiarErrores(tabla) {
            var lista = campos(tabla), i, n = lista.length;
            for (i = 0; i < n; i++) marcarError(lista[i], "");
        }

        /* El documento se revisa antes de enviarlo: extensión y tamaño según lo
           que declara la plantilla. Así el usuario ve el problema en el campo y
           no después de subir diez megas para nada. El servidor vuelve a
           revisarlo, porque esto es comodidad y no seguridad.                */
        function revisarArchivo(campo) {
            var entrada = document.getElementById("fup" + campo.id);
            var archivo, nombre, punto, extension, permitidas, maximo;

            if (!entrada || !entrada.files || entrada.files.length === 0) return "";

            archivo = entrada.files[0];
            nombre = String(archivo.name || "");

            permitidas = campo.extensiones ? separarLista(campo.extensiones) : [];
            if (permitidas.length > 0) {
                punto = nombre.lastIndexOf(".");
                extension = punto === -1 ? "" : nombre.substring(punto).toLowerCase();
                if (!contiene(permitidas, extension)) {
                    return "Solo se admiten archivos " + permitidas.join(", ") + ".";
                }
            }

            maximo = Number(campo.tamMax);
            if (!isNaN(maximo) && maximo > 0 && archivo.size > maximo * 1024 * 1024) {
                return "El archivo supera los " + maximo + " MB.";
            }
            return "";
        }

        /* Una sola regla por campo, tomada de la plantilla. Devuelve el mensaje
           o cadena vacía si el dato es correcto. */
        function revisarCampo(campo) {
            var elemento = control(campo);
            var valor, numero, minimo, maximo, largo;

            if (!elemento || campo.tipo === "oculto") return "";
            if (elemento.disabled || elemento.hidden) return "";

            valor = String(valorDeControl(elemento, campo)).replace(/^\s+|\s+$/g, "");

            if (campo.requerido === "si" && valor === "") return "Este dato es obligatorio.";
            if (valor === "") return "";

            if (campo.tipo === "number") {
                numero = Number(valor);
                if (isNaN(numero)) return "Ingrese un número.";
                minimo = campo.min;
                maximo = campo.max;
                if (minimo !== undefined && minimo !== "" && numero < Number(minimo)) {
                    return "El valor mínimo es " + minimo + ".";
                }
                if (maximo !== undefined && maximo !== "" && numero > Number(maximo)) {
                    return "El valor máximo es " + maximo + ".";
                }
            }

            if (campo.tipo === "fecha" && isNaN(Date.parse(valor))) return "La fecha no es válida.";
            if (campo.tipo === "archivo") return revisarArchivo(campo);

            largo = campo.largo;
            if (largo !== undefined && largo !== "" && valor.length > Number(largo)) {
                return "No puede superar los " + largo + " caracteres.";
            }
            return "";
        }

        function validarUno(tabla, id) {
            var campo = campoPorId(tabla, id), mensaje;
            if (!campo) return true;
            mensaje = revisarCampo(campo);
            marcarError(campo, mensaje);
            return mensaje === "";
        }

        /* Marca todos los campos con problema, deja el foco en el primero y
           resume en el renglón de la barra de acciones. */
        function validar(tabla) {
            var lista = campos(tabla), i, n = lista.length, campo, mensaje;
            var errores = 0, primero = null;

            for (i = 0; i < n; i++) {
                campo = lista[i];
                mensaje = revisarCampo(campo);
                marcarError(campo, mensaje);
                if (mensaje !== "") {
                    errores++;
                    if (!primero) primero = campo;
                }
            }

            if (errores === 0) {
                avisar(tabla, "", "");
                return true;
            }
            if (primero && control(primero)) control(primero).focus();
            avisar(tabla, "E", errores === 1
                ? "Revise el dato marcado en rojo."
                : "Revise los " + errores + " datos marcados en rojo.");
            return false;
        }

        /* ----------------------------------------------------------- avisos -- */

        /* Mensaje devuelve false cuando la pantalla no tiene el diálogo ni lo
           puede pedir al padre; en ese caso el aviso va al renglón. */
        function avisar(tabla, tipo, mensaje) {
            var span;
            if (mensaje && typeof Mensaje !== "undefined" && Mensaje &&
                typeof Mensaje.mostrarMensaje === "function") {
                if (Mensaje.mostrarMensaje(tipo, mensaje) === true) return true;
            }
            span = document.getElementById("spnValida" + tabla);
            if (span) span.textContent = mensaje || "";
            return false;
        }

        /* ---------------------------------------------------- desplegables -- */

        /* Llena los select del modelo con las listas que devuelve el servidor.
           Cada lista son registros 'valor|texto' separados por ¬, y las listas
           entre sí por ¦. Se reparten en el orden en que la plantilla declara
           los select, salvo que el campo diga 'lista=n'. */
        function llenarListas(tabla, listas) {
            var lista = campos(tabla), i, campo, orden = 0;

            if (!listas || listas.length === 0) return;

            for (i = 0; i < lista.length; i++) {
                campo = lista[i];
                if (campo.tipo !== "select") continue;
                llenarUnaLista(campo, listas[campo.lista !== undefined ? Number(campo.lista) : orden]);
                orden++;
            }
        }

        function llenarUnaLista(campo, datos) {
            var elemento = control(campo);
            var registros, i, partes, opcion, seleccionado;

            if (!elemento || !datos) return;
            seleccionado = elemento.value;

            elemento.innerHTML = "";
            opcion = document.createElement("option");
            opcion.value = "";
            opcion.textContent = "Seleccione";
            elemento.appendChild(opcion);

            registros = (typeof datos === "string") ? datos.split("¬") : datos;
            for (i = 0; i < registros.length; i++) {
                if (registros[i] === "") continue;
                partes = String(registros[i]).split("|");
                opcion = document.createElement("option");
                opcion.value = partes[0];
                /* textContent y no innerHTML: los rótulos vienen de la base. */
                opcion.textContent = partes.length > 1 ? partes[1] : partes[0];
                elemento.appendChild(opcion);
            }
            if (seleccionado) elemento.value = seleccionado;
        }

        /* -------------------------------------------------- estado visual -- */

        function habilitar(tabla, activo, ids) {
            var lista = campos(tabla), i, n = lista.length, campo, elemento, archivo, lupa;

            for (i = 0; i < n; i++) {
                campo = lista[i];
                if (ids && !contiene(ids, campo.id)) continue;
                elemento = control(campo);
                if (elemento) elemento.disabled = !activo;
                if (campo.tipo === "archivo") {
                    archivo = document.getElementById("btnArchivo" + campo.id);
                    if (archivo) archivo.disabled = !activo;
                }
                /* La lupa acompaña a su caja: bloquear el código y dejar el
                   botón de búsqueda vivo sería una puerta abierta. */
                lupa = document.getElementById("lup" + campo.id);
                if (lupa) lupa.disabled = !activo;
            }
        }

        function ocultar(tabla, ids, oculto) {
            var lista = campos(tabla), i, n = lista.length, campo, bloque;

            for (i = 0; i < n; i++) {
                campo = lista[i];
                if (ids && !contiene(ids, campo.id)) continue;
                bloque = bloqueDe(campo);
                /* Se oculta el bloque completo: etiqueta, control, unidad,
                   ayuda y error. Antes había que ocultar el control y buscar
                   su label por separado. */
                if (bloque) bloque.hidden = oculto === true;
            }
        }

        function contiene(lista, valor) {
            var i, n = lista.length;
            for (i = 0; i < n; i++) {
                if (lista[i] === valor) return true;
            }
            return false;
        }

        function separarLista(texto) {
            var partes = String(texto || "").split(","), salida = [], i, n = partes.length, dato;
            for (i = 0; i < n; i++) {
                dato = partes[i].replace(/^\s+|\s+$/g, "").toLowerCase();
                if (dato !== "") salida.push(dato);
            }
            return salida;
        }

        /* -------------------------------------------------------- auditoría -- */

        /* Campos ocultos de la plantilla: CodigoAccion, Id, EstadoRegistro,
           CreadoPor, ActualizadoPor. Se llenan los que existan.              */
        function auditoria(tabla, accion) {
            var usuario = usuarioDeSesion();
            var datos = { CodigoAccion: accion };

            if (accion === "I") {
                datos.Id = "0";
                datos.CreadoPor = usuario;
                datos.ActualizadoPor = "SYSTEM";
            } else {
                datos.ActualizadoPor = usuario;
            }
            poner(tabla, datos);
            return datos;
        }

        function usuarioDeSesion() {
            var datos;
            try {
                datos = window.sessionStorage.getItem("datosUsuario");
            } catch (e) {
                datos = null;
            }
            if (!datos) return "";
            return String(datos).split("|")[0];
        }

        /* --------------------------------------------- cambios sin guardar -- */

        function marcarCambios(tabla, activo) {
            var aviso = document.getElementById("spnCambios" + tabla);
            cambios[tabla] = activo === true;
            if (aviso) aviso.className = activo ? "pantalla__cambios visible" : "pantalla__cambios";
        }

        function hayCambios(tabla) {
            return cambios[tabla] === true;
        }

        return {
            registrar: registrar,
            modeloDe: modeloDe,
            campos: campos,
            valores: valores,
            trama: trama,
            tramaPosicional: tramaPosicional,
            poner: poner,
            limpiar: limpiar,
            validar: validar,
            validarUno: validarUno,
            avisar: avisar,
            ponerUno: ponerUno,
            ponerPorOrden: ponerPorOrden,
            ordenDeControles: ordenDeControles,
            refrescarContadores: refrescarContadores,
            llenarListas: llenarListas,
            habilitar: habilitar,
            ocultar: ocultar,
            auditoria: auditoria,
            marcarCambios: marcarCambios,
            hayCambios: hayCambios
        };
    })();

    /* ------------------------------------------------------------------------
       Funciones públicas. Cada una reparte entre el camino por modelo y el
       heredado según la tabla tenga plantilla nombrada o no.
       --------------------------------------------------------------------- */

    Ventana.obtenerDatos = function (tabla) {
        if (Formulario.modeloDe(tabla)) return Formulario.trama(tabla);
        return obtenerDatosPosicional(tabla);
    };

    Ventana.obtenerValores = function (tabla) {
        return Formulario.valores(tabla);
    };

    Ventana.limpiarDatos = function (tabla) {
        if (Formulario.modeloDe(tabla)) return Formulario.limpiar(tabla);
        return limpiarDatosPosicional(tabla);
    };

    Ventana.setearDatos = function (tabla, datos, accion) {
        if (Formulario.modeloDe(tabla)) return Formulario.poner(tabla, datos);
        return setearDatosPosicional(tabla, datos, accion);
    };

    Ventana.setearDatosAuditoria = function (tabla, accion) {
        if (Formulario.modeloDe(tabla)) return Formulario.auditoria(tabla, accion);
        return setearDatosAuditoriaPosicional(accion, tabla);
    };

    Ventana.deshabilitarControles = function (accion, tabla, estado) {
        if (Formulario.modeloDe(tabla)) return Formulario.habilitar(tabla, !estado);
        return deshabilitarControlesPosicional(accion, tabla, estado);
    };

    Ventana.habilitarControles = function (tabla, activo, ids) {
        return Formulario.habilitar(tabla, activo !== false, ids);
    };

    Ventana.ocultarControles = function (accion, tabla, estado) {
        if (Formulario.modeloDe(tabla)) return Formulario.ocultar(tabla, null, estado);
        return ocultarControlesPosicional(accion, tabla, estado);
    };

    /* Validación: con modelo se valida campo por campo con las reglas de la
       plantilla; sin modelo se usa el módulo Validacion de siempre. */
    Ventana.validar = function (tabla) {
        if (Formulario.modeloDe(tabla)) return Formulario.validar(tabla);
        if (typeof Validacion !== "undefined" && Validacion) return Validacion.validarDatos(tabla);
        return true;
    };

    Ventana.avisar = function (tabla, tipo, mensaje) {
        return Formulario.avisar(tabla, tipo, mensaje);
    };

    Ventana.hayCambios = function (tabla) {
        return Formulario.hayCambios(tabla);
    };

    Ventana.marcarCambios = function (tabla, activo) {
        return Formulario.marcarCambios(tabla, activo);
    };

    Ventana.validarCampo = function (tabla, id) {
        return Formulario.validarUno(tabla, id);
    };

    /* Lo llama Plantilla.crear: sin esto la tabla no tendría modelo y todas
       las funciones de arriba caerían al camino heredado. */
    Ventana.registrarModelo = function (modelo) {
        return Formulario.registrar(modelo);
    };

    /* El modelo de una tabla: lo que quedó de la construcción -campos, grilla,
       mapeos- más lo que dejó la carga, como las ayudas. Lo necesita la lupa
       y cualquier pantalla que quiera consultar su propia definición. */
    Ventana.modeloDe = function (tabla) {
        return Formulario.modeloDe(tabla);
    };

    /* Registro de acciones por tabla: reemplaza al único hueco global
       alEjecutarAccion, que no servía con dos ventanas abiertas. */
    var manejadores = {};

    Ventana.acciones = function (tabla, mapa) {
        manejadores[tabla] = mapa || {};
    };

    Ventana.ejecutarAccion = function (accion, modelo, fila) {
        var tabla = modelo && modelo.tabla ? modelo.tabla : "";
        var mapa = manejadores[tabla];

        if (mapa && typeof mapa[accion] === "function") {
            mapa[accion](tabla, fila);
            return true;
        }
        if (typeof Ventana.alEjecutarAccion === "function") {
            Ventana.alEjecutarAccion(accion, modelo);
            return true;
        }
        /* Comportamiento por omisión: nuevo, editar, ver, grabar, cancelar y
           cerrar son iguales en todas las pantallas, así que solo hay que
           registrarlos cuando se quiere algo distinto. */
        if (typeof Ventana[accion] === "function") {
            Ventana[accion](tabla, fila);
            return true;
        }
        Ventana.registrar("Acción sin atender: " + accion + " en " + tabla);
        return false;
    };

    /* ========================================================================
       Ciclo de la pantalla: cargar, grabar y cancelar.

       Estaba repetido en el archivo de cada pantalla. Es idéntico en todas
       —pedir, descomprimir, repartir segmentos, colocar, validar, enviar—, así
       que vive aquí y la pantalla solo pone lo que le es propio.

       Respuesta del servidor, en segmentos separados por ~ :
           [0] mensaje 'C|..', 'A|..' o 'E|..'  ó la lista de combos
           [1] registros, separados por ¬
           [2] grillas de popup
           [3] ayudas
       cargar devuelve combos en el [0] y gestionar devuelve el mensaje; en
       ambos los registros van en el [1], así que un solo lector sirve.
       ===================================================================== */

    var SEP_SEGMENTO = "~";
    var SEP_REGISTRO = "¬";
    var SEP_LISTA = "¦";
    var ES_MENSAJE = /^[CAE]\|/;

    /* Códigos de operación del menú (columna 4 de las filas 'A' de Menu.txt)
       y la acción de la grilla que habilita cada uno. getPerfiles solo agrega
       al dato del menú los códigos que el perfil tiene en 'S', así que lo que
       llega en hdfTabla ya viene filtrado por perfil. */
    var CODIGOS_ACCION = {
        RE: "nuevo",
        EM: "eliminarMultiple",
        EX: "excel",
        MO: "editar",
        EL: "eliminar",
        VE: "ver"
    };

    /* hdfTabla llega como 'T12¦RE¦EX¦MO¦EL¦': la tabla y los códigos
       permitidos. */
    Ventana.permisos = function () {
        var partes = String(Ventana.valorDe("hdfTabla") || "").split("¦");
        var salida = {}, i, codigo;

        for (i = 1; i < partes.length; i++) {
            codigo = partes[i].replace(/^\s+|\s+$/g, "").toUpperCase();
            if (CODIGOS_ACCION[codigo]) salida[CODIGOS_ACCION[codigo]] = true;
        }
        return salida;
    };

    /* Intersección entre lo que la pantalla admite y lo que el perfil permite.
       Si la plantilla no declara nada, manda el perfil. */
    Ventana.accionesPermitidas = function (declaradas) {
        var permitidas = Ventana.permisos();
        var salida = {}, clave;

        if (!declaradas || Object.keys(declaradas).length === 0) return permitidas;

        for (clave in declaradas) {
            if (!Object.prototype.hasOwnProperty.call(declaradas, clave)) continue;
            if (permitidas[clave]) salida[clave] = true;
        }
        return salida;
    };

    /* Ayudante de DOM que cada pantalla venía redefiniendo. */
    Ventana.valorDe = function (id) {
        var el = document.getElementById(id);
        return el ? el.value : "";
    };

    Ventana.registrar = function (mensaje, detalle) {
        if (typeof console === "undefined" || !console || !console.error) return;
        if (detalle !== undefined) console.error("[Ventana] " + mensaje, detalle);
        else console.error("[Ventana] " + mensaje);
    };

    function controladorDe(tabla) {
        var modelo = Formulario.modeloDe(tabla);
        return (modelo && modelo.controlador) ? modelo.controlador : "SAHE";
    }

    function descomprimir(rpta) {
        if (typeof Descomprimir === "undefined" || !Descomprimir ||
            typeof Descomprimir.Deflate !== "function") {
            return String(rpta);
        }
        return Descomprimir.Deflate(rpta);
    }

    /* Lee la respuesta completa y devuelve lo ya separado, o null si vino un
       error, en cuyo caso el aviso ya se mostró. */
    /* esCarga distingue quién contesta. En una carga el segmento 0 son SIEMPRE
       los combos, y solo un 'E|' es mensaje: la lista de estados empieza por
       'A|Activo', que si no se confundía con un aviso y la pantalla se quedaba
       sin desplegables. En gestionar, en cambio, el segmento 0 es el mensaje. */
    function leerRespuesta(tabla, rpta, esCarga) {
        var texto, segmentos, cabecera, mensaje;

        if (!rpta) {
            Ventana.registrar("El servidor no devolvió datos.");
            return null;
        }

        try {
            texto = descomprimir(rpta);
        } catch (e) {
            Ventana.registrar("No se pudo descomprimir la respuesta.", e);
            Formulario.avisar(tabla, "E", "No se pudo leer la respuesta del servidor.");
            return null;
        }

        segmentos = String(texto).split(SEP_SEGMENTO);
        cabecera = segmentos[0] || "";

        if (ES_MENSAJE.test(cabecera) && !(esCarga === true && cabecera.charAt(0) !== "E")) {
            mensaje = cabecera.split("|");
            if (mensaje[0] === "E") {
                Formulario.avisar(tabla, "E", mensaje[1] || "La operación no se pudo realizar.");
                return null;
            }
            return { tipo: mensaje[0], mensaje: mensaje[1] || "", combos: null, segmentos: segmentos };
        }
        return { tipo: "", mensaje: "", combos: cabecera, segmentos: segmentos };
    }

    /* Cada lista llega como 'codigo|texto¬codigo|texto'; la grilla las quiere
       ya partidas en registros. */
    function separarListas(listas) {
        var salida = [], i;
        for (i = 0; i < listas.length; i++) {
            salida.push(String(listas[i] || "").split(SEP_REGISTRO));
        }
        return salida;
    }

    function primerRegistro(segmentos) {
        var registros = segmentos.length > 1 ? String(segmentos[1]).split(SEP_REGISTRO) : [];
        if (registros.length === 0 || registros[0] === "") return "";
        return registros[0];
    }

    /* ------------------------------------------------------------- cargar -- */

    /* La pantalla deja de verse apagada en cuanto llega -o falla- la carga. */
    function marcarCargando(tabla, cargando) {
        var modelo = Formulario.modeloDe(tabla);
        if (!modelo || !modelo.contenedor) return;
        modelo.contenedor.className = cargando ? "pantalla pantalla--cargando" : "pantalla";
    }

    /* Mientras llegan las tandas la pantalla NO se bloquea: el usuario ya
       puede filtrar y ordenar lo que tiene. Solo el contador avisa que
       todavía falta. */

    /* ---- el reparto, en el orden en que el paquete manda los segmentos ----

       1) listas    segmento 0 - de ellas salen las opciones de los
                                 desplegables y la traducción código→texto
                                 que necesita la grilla;
       2) ayudas    segmento 2 - las grillas de las lupas, que quedan a la
                                 mano para cuando el usuario abra una;
       3) datos     segmento 1 - las filas o el registro, que ya se pintan
                                 traducidos.

       El orden no es cosmético: si los datos entraran antes que las listas,
       la grilla mostraría 'A' donde debe decir 'Activo' y los desplegables
       quedarían en blanco por elegir un valor que todavía no existe. */

    function llenarListas(tabla, modelo, lectura) {
        var listas;

        if (!lectura.combos) return;
        if (!modelo) {
            /* Pantalla heredada: llenarLista busca los select por las clases
               de EDDO. */
            if (typeof Ventana.llenarLista === "function") {
                Ventana.llenarLista(lectura.combos.split(SEP_LISTA), tabla);
            }
            return;
        }

        listas = lectura.combos.split(SEP_LISTA);
        Formulario.llenarListas(tabla, listas);
        if (modelo.instanciaGrilla) modelo.instanciaGrilla.listas(separarListas(listas));
    }

    /* Las ayudas se guardan en el modelo tal como llegan. No se pintan ahora:
       la lupa las pide cuando el usuario la abre, y así una pantalla con
       varias ayudas no arma cuatro grillas que quizá nadie mire. */
    function llenarAyudas(tabla, modelo, lectura) {
        /* 'ayudas' son las definiciones del txt; los datos van aparte para no
           pisarlas. */
        if (!modelo) return;
        modelo.datosAyuda = lectura.segmentos.length > 2 ? String(lectura.segmentos[2]).split(SEP_LISTA) : [];
    }

    function llenarDatos(tabla, modelo, lectura) {
        var filas = lectura.segmentos.length > 1 ? lectura.segmentos[1] : "";
        var registro;

        /* Con grilla el segundo segmento son TODAS las filas; sin grilla es un
           registro y va a los controles. */
        if (modelo && modelo.instanciaGrilla) {
            modelo.instanciaGrilla.datos(filas);
            return;
        }

        registro = primerRegistro(lectura.segmentos);
        if (registro === "") {
            /* Sin fila vigente la pantalla queda en blanco para dar de alta. */
            Formulario.auditoria(tabla, "I");
            Formulario.avisar(tabla, "A", "No hay datos registrados. Complete la pantalla y grabe.");
            return;
        }
        Formulario.poner(tabla, registro);
        Formulario.auditoria(tabla, "U");
    }

    function repartir(tabla, lectura) {
        var modelo = Formulario.modeloDe(tabla);
        llenarListas(tabla, modelo, lectura);
        llenarAyudas(tabla, modelo, lectura);
        llenarDatos(tabla, modelo, lectura);
    }

    /* Cuántas filas por viaje declara la pantalla. Cero significa que no se
       trae por bloques: la tabla es chica y entra de una vez. */
    function tamanoBloque(tabla) {
        var modelo = Formulario.modeloDe(tabla);
        return (modelo && modelo.grilla && modelo.grilla.bloque) ? modelo.grilla.bloque : 0;
    }

    /* El id de la última fila del bloque. Es la llave con la que se pide el
       siguiente: se paginan por llave y no por número de página, así el viaje
       18 cuesta lo mismo que el primero. */
    function ultimoIdDe(tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaGrilla : null;
        var filas, posicion;

        if (!rejilla) return 0;
        filas = rejilla.filas();
        if (filas.length === 0) return 0;
        posicion = posicionEnMapeo(modelo.mapeo || [], camposPk(modelo)[0]);
        if (posicion === -1) posicion = 0;
        return Number(filas[filas.length - 1][posicion]) || 0;
    }

    function pedirBloque(tabla, accion, alLlegar) {
        var frm = new FormData();

        frm.append("data", tabla + "|" + accion);
        Http.postBytes(controladorDe(tabla) + "/Cargar", function (rpta) {
            var lectura = leerRespuesta(tabla, rpta, true);
            if (!lectura) { marcarCargando(tabla, false); return; }
            alLlegar(lectura);
        }, frm, {
            error: function (falla) {
                marcarCargando(tabla, false);
                Formulario.avisar(tabla, "E", falla.mensaje);
            }
        });
    }

    /* Trae el resto de las tandas, una detrás de otra. No se lanzan en
       paralelo a propósito: cada bloque necesita el último id del anterior, y
       además así el servidor atiende una consulta por vez en lugar de
       dieciocho. La pantalla ya está usable desde el primer bloque. */
    function traerResto(tabla, total, bloque, alTerminar) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaGrilla : null;

        function siguiente() {
            if (rejilla.filas().length >= total) { terminar(); return; }
            pedirBloque(tabla, "B" + SEP_REGISTRO + ultimoIdDe(tabla) + SEP_REGISTRO + bloque,
                function (lectura) {
                    var datos = lectura.segmentos.length > 1 ? lectura.segmentos[1] : "";
                    var antes = rejilla.filas().length;

                    if (datos === "" || rejilla.agregar(datos) === antes) { terminar(); return; }
                    siguiente();
                });
        }

        function terminar() {
            rejilla.esperar(0);
            if (typeof alTerminar === "function") alTerminar(null);
        }

        if (!rejilla) return;
        siguiente();
    }

    /* accion es 'C' en la carga inicial y 'B' cuando se pide una tanda. Lo que
       acompaña a la acción viaja después del separador de registro, porque el
       controlador parte el 'data' por el primer | y se quedaría solo con lo
       que hay antes del segundo. */
    Ventana.cargar = function (tabla, alTerminar, filtro) {
        var frm = new FormData();
        var bloque = tamanoBloque(tabla);
        var accion = "C";

        if (filtro !== undefined && filtro !== null && filtro !== "") accion = "B" + SEP_REGISTRO + filtro;
        else if (bloque > 0) accion = "C" + SEP_REGISTRO + bloque;

        frm.append("data", tabla + "|" + accion);
        marcarCargando(tabla, true);

        Http.postBytes(controladorDe(tabla) + "/Cargar", function (rpta) {
            var lectura = leerRespuesta(tabla, rpta, true);
            var modelo, rejilla, total;

            if (!lectura) { marcarCargando(tabla, false); return; }

            repartir(tabla, lectura);

            /* El paquete informa el total en el cuarto segmento. Si hay más de
               lo que trajo, se sigue pidiendo mientras el usuario ya mira el
               primer bloque. */
            modelo = Formulario.modeloDe(tabla);
            rejilla = modelo ? modelo.instanciaGrilla : null;
            total = lectura.segmentos.length > 3 ? Number(lectura.segmentos[3]) : 0;

            if (bloque > 0 && rejilla && total > rejilla.filas().length) {
                /* La pantalla se desbloquea con el PRIMER bloque: el usuario
                   ya puede filtrar, ordenar y abrir un registro mientras el
                   resto sigue llegando. Lo único que avisa que falta es el
                   contador. */
                marcarCargando(tabla, false);
                rejilla.esperar(total);
                if (typeof alTerminar === "function") alTerminar(lectura);
                traerResto(tabla, total, bloque, null);
                return;
            }

            marcarCargando(tabla, false);
            if (typeof alTerminar === "function") alTerminar(lectura);
        }, frm, {
            error: function (falla) {
                marcarCargando(tabla, false);
                Formulario.avisar(tabla, "E", falla.mensaje);
            }
        });
    };

    /* ------------------------------------------------------------- grabar -- */

    /* Los archivos elegidos viajan aparte del texto; el controlador los recoge
       de Request.Files. */
    function adjuntarArchivos(tabla, frm) {
        var lista = Formulario.campos(tabla), i, n = lista.length, entrada, total = 0;

        for (i = 0; i < n; i++) {
            if (lista[i].tipo !== "archivo") continue;
            entrada = document.getElementById("fup" + lista[i].id);
            if (entrada && entrada.files && entrada.files.length > 0) {
                frm.append("archivo" + total, entrada.files[0]);
                total++;
            }
        }
        return total;
    }

    /* El formulario guarda códigos -'HORA'- y la trama de la grilla puede
       traer la descripción -'Por Hora'-. Los dos lados se pasan por la
       traducción de la columna, que deja el valor sin tocar cuando no está en
       ninguna lista, y así se comparan cosas comparables. */
    function comparable(rejilla, mapeo, id, valor) {
        var posicion = posicionEnMapeo(mapeo, id);
        var texto = valor === undefined || valor === null ? "" : String(valor);

        if (posicion === -1 || !rejilla.textoDe) return texto;
        return String(rejilla.textoDe(posicion, texto));
    }

    /* Los valores que el formulario tiene ahora para una lista de campos. */
    function valoresDe(rejilla, mapeo, tabla, ids) {
        var datos = Formulario.valores(tabla), salida = [], i;
        for (i = 0; i < ids.length; i++) {
            salida.push(comparable(rejilla, mapeo, ids[i], datos[ids[i]]));
        }
        return salida;
    }

    /* Los mismos campos, pero tomados de una fila de la grilla, que viene en
       el orden del mapeo de carga. */
    function valoresDeFila(rejilla, mapeo, fila, ids) {
        var salida = [], i, posicion;
        for (i = 0; i < ids.length; i++) {
            posicion = posicionEnMapeo(mapeo, ids[i]);
            salida.push(posicion === -1 ? "" : comparable(rejilla, mapeo, ids[i], fila[posicion]));
        }
        return salida;
    }

    function mismosValores(a, b) {
        var i;
        if (a.length !== b.length) return false;
        for (i = 0; i < a.length; i++) {
            if (String(a[i]).toLowerCase() !== String(b[i]).toLowerCase()) return false;
        }
        return true;
    }

    /* Comprueba la clave única contra lo que ya está en la grilla. Se hace
       antes de mandar para dar un mensaje entendible: Oracle devolvería un
       ORA-00001 con el nombre del índice, que al usuario no le dice nada.
       No reemplaza a la restricción de la base -otro usuario puede haber
       grabado lo mismo hace un segundo-, la adelanta. */
    function repiteClaveUnica(tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaGrilla : null;
        var uk = modelo && modelo.grilla ? modelo.grilla.uk : null;
        var mapeo, pk, valores, llaveActual, filas, i;

        if (!rejilla || !uk || uk.length === 0) return false;

        mapeo = modelo.mapeo || [];
        pk = camposPk(modelo);
        valores = valoresDe(rejilla, mapeo, tabla, uk);
        llaveActual = valoresDe(rejilla, mapeo, tabla, pk);
        filas = rejilla.filas();

        for (i = 0; i < filas.length; i++) {
            if (!mismosValores(valores, valoresDeFila(rejilla, mapeo, filas[i], uk))) continue;
            /* La propia fila que se está modificando no cuenta como repetida. */
            if (mismosValores(llaveActual, valoresDeFila(rejilla, mapeo, filas[i], pk))) continue;
            return true;
        }
        return false;
    }

    function rotuloDe(tabla, ids) {
        var lista = Formulario.campos(tabla), textos = [], i, j;

        for (i = 0; i < ids.length; i++) {
            for (j = 0; j < lista.length; j++) {
                if (lista[j].id === ids[i]) { textos.push(lista[j].etiqueta || ids[i]); break; }
            }
        }
        return textos.join(" + ");
    }

    Ventana.grabar = function (tabla, alTerminar) {
        var trama, modelo;

        if (!Ventana.validar(tabla)) return false;

        if (repiteClaveUnica(tabla)) {
            modelo = Formulario.modeloDe(tabla);
            Formulario.avisar(tabla, "A", "Ya existe un registro con ese " +
                rotuloDe(tabla, modelo.grilla.uk) + ".");
            return false;
        }

        /* La acción decide la rama del paquete: 'I' alta, 'U' modificación. */
        Formulario.auditoria(tabla, Ventana.valorDe("hdnCodigoAccion") || "U");

        trama = Formulario.tramaPosicional(tabla);
        if (trama === null) {
            Ventana.registrar("La plantilla de " + tabla + " no declara la línea 'mapeo'; no se puede armar la trama.");
            Formulario.avisar(tabla, "E", "La pantalla no está configurada para grabar.");
            return false;
        }
        return enviarGestion(tabla, trama, alTerminar);
    };

    /* Envío a gestionar. Lo comparten grabar, eliminar y eliminar múltiple:
       la única diferencia entre ellos es la acción que lleva la trama. */
    function enviarGestion(tabla, trama, alTerminar) {
        var frm;

        if (trama === undefined || trama === null) trama = Formulario.tramaPosicional(tabla);
        if (trama === null) return false;

        frm = new FormData();
        frm.append("data", tabla + SEP_REGISTRO + trama);
        adjuntarArchivos(tabla, frm);

        Http.postBytes(controladorDe(tabla) + "/gestionar", function (rpta) {
            var lectura = leerRespuesta(tabla, rpta);
            var modelo = Formulario.modeloDe(tabla);
            var registro;

            if (!lectura) return;

            /* El paquete devuelve el mensaje y, detrás, los datos ya grabados:
               se vuelven a colocar para que la pantalla quede con lo que quedó
               en la base y no con lo que el usuario tenía escrito. */
            if (modelo && modelo.instanciaGrilla) {
                modelo.instanciaGrilla.datos(lectura.segmentos.length > 1 ? lectura.segmentos[1] : "");
                Ventana.cerrar(tabla);
            } else {
                registro = primerRegistro(lectura.segmentos);
                if (registro !== "") {
                    Formulario.poner(tabla, registro);
                    Formulario.auditoria(tabla, "U");
                }
            }
            Formulario.marcarCambios(tabla, false);
            Formulario.avisar(tabla, lectura.tipo || "C", lectura.mensaje || "Los datos se grabaron.");
            if (typeof alTerminar === "function") alTerminar(lectura);
        }, frm, {
            error: function (falla) { Formulario.avisar(tabla, "E", falla.mensaje); }
        });
        return true;
    }

    /* ------------------------------------------- ventana de mantenimiento -- */

    function velosDe(tabla) {
        return document.getElementById("divVelo" + tabla);
    }

    Ventana.abrirPopup = function (tabla, titulo) {
        var velo = velosDe(tabla);
        var rotulo = document.getElementById("spnBarraTitulo" + tabla);
        var primero;

        if (!velo) return false;
        if (titulo && rotulo) rotulo.textContent = titulo;
        velo.className = "velo abierto";

        primero = velo.querySelector(".control:not([readonly]):not([type=hidden])");
        if (primero) primero.focus();
        return true;
    };

    Ventana.cerrarPopup = function (tabla) {
        var velo = velosDe(tabla);
        if (velo) velo.className = "velo";
        return true;
    };

    /* ------------------------------------------------ ventana de ayuda ---- */

    /* La lupa abre una ventana aparte -en divPantPop, no en la del
       mantenimiento- con la lista que mandó el paquete en el segmento 2. No
       tiene acciones ni selección múltiple: lo único que se puede hacer es
       elegir una fila con doble clic. */

    var ID_AYUDA = "divPantPop";
    /* Una instancia por lupa, para no rearmar la grilla en cada apertura. */
    var ayudasAbiertas = {};

    function campoDe(modelo, id) {
        var lugares = [modelo], i, j, k, secciones, campos;

        if (modelo.popup) lugares.push(modelo.popup);
        for (i = 0; i < lugares.length; i++) {
            secciones = lugares[i].secciones || [];
            for (j = 0; j < secciones.length; j++) {
                campos = secciones[j].campos || [];
                for (k = 0; k < campos.length; k++) {
                    if (campos[k].id === id) return campos[k];
                }
            }
        }
        return null;
    }

    function contenedorAyuda() {
        var caja = document.getElementById(ID_AYUDA);
        if (!caja) Ventana.registrar("Falta el div " + ID_AYUDA + " para las ayudas.");
        return caja;
    }

    function armarAyuda(tabla, indice, definicion) {
        var caja = contenedorAyuda();
        var clave = tabla + "-" + indice;
        var velo, ventana, barra, cerrar, cuerpo, rejilla;

        if (!caja) return null;
        if (ayudasAbiertas[clave]) return ayudasAbiertas[clave];

        velo = document.createElement("div");
        velo.className = "velo";
        velo.id = "divVeloAyuda" + clave;

        ventana = document.createElement("div");
        ventana.className = "ventana ventana--ayuda";
        ventana.style.maxWidth = definicion.ancho + "px";

        barra = document.createElement("div");
        barra.className = "ventana__barra";
        cerrar = document.createElement("button");
        cerrar.type = "button";
        cerrar.className = "ventana__cerrar";
        cerrar.title = "Cerrar";
        cerrar.innerHTML = "&#215;";
        cerrar.onclick = function () { Ventana.cerrarAyuda(tabla, indice); };
        barra.appendChild(rotulo(definicion.titulo));
        barra.appendChild(cerrar);

        cuerpo = document.createElement("div");
        cuerpo.className = "ventana__cuerpo";
        rejilla = document.createElement("div");
        rejilla.className = "gAyuda";
        cuerpo.appendChild(rejilla);

        ventana.appendChild(barra);
        ventana.appendChild(cuerpo);
        velo.appendChild(ventana);
        caja.appendChild(velo);

        ayudasAbiertas[clave] = {
            velo: velo,
            grilla: Grilla.crear(rejilla, {
                tabla: "AYU" + clave,
                columnas: definicion.columnas,
                porPagina: definicion.porPagina,
                filtros: true,
                /* Sin acciones: ni botones de fila, ni marcas, ni nuevo. */
                acciones: {},
                alElegir: function (fila) { elegirDeAyuda(tabla, definicion, fila); }
            })
        };
        return ayudasAbiertas[clave];
    }

    function rotulo(texto) {
        var span = document.createElement("span");
        span.className = "ventana__titulo";
        span.textContent = texto;
        return span;
    }

    /* Doble clic: cada columna de la ayuda cae en el campo que le toca por
       posición, según 'destino' del txt, y la ventana se cierra. */
    function elegirDeAyuda(tabla, definicion, fila) {
        var destino = definicion.destino || [], i;

        for (i = 0; i < destino.length; i++) {
            if (destino[i] === "") continue;
            Formulario.ponerUno(tabla, destino[i], fila[i]);
        }
        Ventana.cerrarAyuda(tabla, definicion.indice);
    }

    /* El paquete manda la ayuda de dos maneras y las dos son válidas:
         - por registros, 'codigo|texto¬codigo|texto', como la grilla; o
         - como lista plana, '|codigo|texto|codigo|texto...', que es la forma
           heredada de EDDO.
       En la plana no hay separador de fila, así que se agrupa de a tantos
       valores como columnas declare la ayuda. El primer campo suele venir
       vacío -la trama empieza con |- y se descarta. */
    function filasAyuda(texto, cuantasColumnas) {
        var crudo = String(texto || "");
        var partes, salida = [], fila, i;

        if (crudo === "") return [];
        if (crudo.indexOf(SEP_REGISTRO) !== -1) {
            partes = crudo.split(SEP_REGISTRO);
            for (i = 0; i < partes.length; i++) {
                if (partes[i] !== "") salida.push(partes[i].split("|"));
            }
            return salida;
        }

        partes = crudo.split("|");
        while (partes.length > 0 && partes[0] === "") partes.shift();

        fila = [];
        for (i = 0; i < partes.length; i++) {
            fila.push(partes[i]);
            if (fila.length === cuantasColumnas) { salida.push(fila); fila = []; }
        }
        /* Una cola incompleta se completa en blanco antes que perderla. */
        if (fila.length > 0) {
            while (fila.length < cuantasColumnas) fila.push("");
            salida.push(fila);
        }
        return salida;
    }

    /* La acción 'buscar' que emite la lupa. El campo dice con qué ayuda se
       busca; los datos ya llegaron en la carga. */
    Ventana.buscar = function (tabla, campoId) {
        var modelo = Formulario.modeloDe(tabla);
        var campo = modelo ? campoDe(modelo, campoId) : null;
        var indice, definicion, datos, ayuda;

        if (!campo) { Ventana.registrar("La lupa no encontró el campo " + campoId); return false; }

        indice = Number(campo.lupa);
        definicion = (modelo.ayudas || [])[indice];
        if (!definicion) {
            Formulario.avisar(tabla, "A", "Esta búsqueda todavía no está configurada.");
            return false;
        }
        definicion.indice = indice;

        ayuda = armarAyuda(tabla, indice, definicion);
        if (!ayuda) return false;

        datos = (modelo.datosAyuda || [])[indice] || "";
        ayuda.grilla.datos(filasAyuda(datos, definicion.columnas.length));
        ayuda.velo.className = "velo abierto";
        return true;
    };

    Ventana.cerrarAyuda = function (tabla, indice) {
        var ayuda = ayudasAbiertas[tabla + "-" + indice];
        if (ayuda) ayuda.velo.className = "velo";
        return true;
    };

    /* Vuelve a pedir la grilla con lo que el usuario escribió en el campo de
       filtro. Es la acción 'consultar' del txt. Sin filtro declarado se
       comporta como una recarga normal. */
    Ventana.consultar = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var id = modelo && modelo.grilla ? modelo.grilla.filtro : "";
        var valor = "";

        if (id) {
            valor = Formulario.valores(tabla)[id];
            valor = (valor === undefined || valor === null) ? "" : String(valor).replace(/^\s+|\s+$/g, "");
            if (valor === "") {
                Formulario.avisar(tabla, "A", "Indique " + rotuloCampo(tabla, id) + " para consultar.");
                return false;
            }
        }
        Ventana.cargar(tabla, null, valor);
        return true;
    };

    function rotuloCampo(tabla, id) {
        var lista = Formulario.campos(tabla), i;
        for (i = 0; i < lista.length; i++) {
            if (lista[i].id === id) return (lista[i].etiqueta || id).toLowerCase();
        }
        return id;
    }

    /* Alta: pantalla en blanco y acción 'I'. */
    Ventana.nuevo = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);
        Formulario.limpiar(tabla);
        Formulario.auditoria(tabla, "I");
        aplicarBloqueo(tabla, "nuevo");
        Ventana.abrirPopup(tabla, (modelo && modelo.popup ? modelo.popup.titulo : "Nuevo"));
    };

    /* ------------------------------------------------------------ obtener -- */

    /* La llave de la fila. Sale de 'llave=' en la línea grilla del txt -o del
       primer campo del mapeo si no se declara- y se busca por posición dentro
       de la fila, que viene en el orden del mapeo de carga. */
    function llaveDe(modelo, fila) {
        var mapeo = modelo.mapeo || [];
        var llaves = camposPk(modelo);
        var partes = [], i, posicion;

        for (i = 0; i < llaves.length; i++) {
            posicion = posicionEnMapeo(mapeo, llaves[i]);
            partes.push(posicion === -1 ? "" : (fila[posicion] === undefined ? "" : fila[posicion]));
        }
        return partes.join("|");
    }

    /* La pk declarada, o el primer campo del mapeo si el txt no la declara. */
    function camposPk(modelo) {
        var mapeo = modelo.mapeo || [];
        if (modelo.grilla && modelo.grilla.pk && modelo.grilla.pk.length > 0) return modelo.grilla.pk;
        return mapeo.length > 0 ? [mapeo[0]] : [];
    }

    function posicionEnMapeo(mapeo, id) {
        var i;
        for (i = 0; i < mapeo.length; i++) {
            if (mapeo[i] === id) return i;
        }
        return -1;
    }

    /* Trae UN registro del paquete. La grilla ya tiene los datos a la vista,
       pero pueden estar viejos -otro usuario grabó mientras tanto- y además no
       trae las columnas que no se muestran. Por eso modificar y ver preguntan
       en vez de copiar la fila. */
    Ventana.obtener = function (tabla, llave, alTerminar) {
        var frm = new FormData();

        frm.append("tabla", tabla);
        frm.append("data", llave);

        Http.postBytes(controladorDe(tabla) + "/Obtener", function (rpta) {
            var lectura = leerRespuesta(tabla, rpta);
            var registro;

            if (!lectura) return;
            registro = registroDeObtener(lectura);
            if (registro === "") {
                Formulario.avisar(tabla, "A", "El registro ya no está disponible. Actualice la pantalla.");
                return;
            }
            if (typeof alTerminar === "function") alTerminar(registro);
        }, frm, {
            error: function (falla) { Formulario.avisar(tabla, "E", falla.mensaje); }
        });
    };

    /* Obtener devuelve un solo registro y no siempre en el mismo segmento:
       si el paquete antepone un mensaje, el registro queda en el segmento 1;
       si contesta pelado, viene en el 0. Se acepta cualquiera de las dos en
       vez de exigir una. */
    function registroDeObtener(lectura) {
        var registro = primerRegistro(lectura.segmentos);

        if (registro !== "") return registro;
        if (lectura.tipo !== "") return "";          /* vino solo un mensaje */
        return String(lectura.segmentos[0] || "").split(SEP_REGISTRO)[0] || "";
    }

    /* Deja la ventana como la quiere la pantalla para esa acción: todo
       habilitado y, encima, apagados los campos que el txt declara para ella.
       Un campo deshabilitado igual viaja en la trama -su valor se lee del
       control, no del envío del formulario-, así que sigue llegando al
       paquete. */
    function aplicarBloqueo(tabla, accion) {
        var modelo = Formulario.modeloDe(tabla);
        var reglas = modelo && modelo.popup ? modelo.popup.deshabilitar : null;
        var ids = [];

        Formulario.habilitar(tabla, true);
        if (!reglas) return;

        if (reglas.todas) ids = ids.concat(reglas.todas);
        if (reglas[accion]) ids = ids.concat(reglas[accion]);
        if (ids.length > 0) Formulario.habilitar(tabla, false, ids);
    }

    /* Modificar y ver piden el registro al paquete y, cuando llega, lo colocan
       con el mismo mapeo con que se lee la carga. */
    function abrirConRegistro(tabla, fila, soloLectura) {
        var modelo = Formulario.modeloDe(tabla);
        var titulo = modelo && modelo.popup ? modelo.popup.titulo : (soloLectura ? "Ver" : "Modificar");

        if (!fila) return;
        Ventana.obtener(tabla, llaveDe(modelo, fila), function (registro) {
            /* La ventana ya está construida desde el arranque: aquí solo se
               limpian los controles y se les asignan los valores, en el orden
               en que la plantilla los declara -o el que diga
               'mapeo|origen=obtener' si el paquete usa otro-. */
            Formulario.limpiar(tabla);
            Formulario.ponerPorOrden(tabla, registro, modelo.mapeoObtener);
            Formulario.auditoria(tabla, "U");
            /* Ver bloquea todo; modificar solo lo que declare el txt. */
            if (soloLectura) Formulario.habilitar(tabla, false);
            else aplicarBloqueo(tabla, "editar");
            Ventana.abrirPopup(tabla, titulo);
        });
    }

    Ventana.editar = function (tabla, fila) {
        abrirConRegistro(tabla, fila, false);
    };

    Ventana.ver = function (tabla, fila) {
        abrirConRegistro(tabla, fila, true);
    };

    /* ----------------------------------------------------------- exportar -- */

    /* Tipos que entiende Cadena.ConvertirTabla: los concatena a 'System.' y
       hace Convert.ChangeType, que revienta con una celda vacía. Por eso una
       columna solo viaja como número si TODOS sus valores lo son. */
    var TIPOS_NET = { numero: "Int32", decimal: "Decimal", fecha: "DateTime" };

    function tipoExportado(columna, filas, indice) {
        var nombre = TIPOS_NET[columna.tipo], i, valor;

        if (!nombre) return "String";
        for (i = 0; i < filas.length; i++) {
            valor = filas[i][indice];
            if (valor === "" || valor === null || valor === undefined) return "String";
            if (nombre !== "DateTime" && isNaN(Number(valor))) return "String";
        }
        return nombre;
    }

    /* El servidor espera cuatro bloques separados por el separador de
       registro: títulos, anchos, tipos y después una línea por fila. */
    function tramaExportacion(columnas, filas) {
        var titulos = [], anchos = [], tipos = [], lineas = [], i, j, fila;

        for (j = 0; j < columnas.length; j++) {
            if (columnas[j].oculto) continue;
            titulos.push(columnas[j].titulo);
            anchos.push(columnas[j].ancho || "120");
            tipos.push(tipoExportado(columnas[j], filas, j));
        }
        for (i = 0; i < filas.length; i++) {
            fila = [];
            for (j = 0; j < columnas.length; j++) {
                if (columnas[j].oculto) continue;
                fila.push(limpiarSeparadores(filas[i][j]));
            }
            lineas.push(fila.join("|"));
        }
        return [titulos.join("|"), anchos.join("|"), tipos.join("|")].concat(lineas).join(SEP_REGISTRO);
    }

    /* Un dato que traiga un separador partiría la trama en dos. */
    var SEPARADORES = new RegExp("[|" + SEP_REGISTRO + SEP_SEGMENTO + SEP_LISTA + "]", "g");

    function limpiarSeparadores(valor) {
        return String(valor === null || valor === undefined ? "" : valor).replace(SEPARADORES, " ");
    }

    var MIME_EXCEL = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

    /* Va por Http.postBytes y no por un formulario porque FiltroUrl exige la
       cabecera 'xhr', que un submit normal no manda: sin ella el filtro
       redirige al Login y el usuario baja la página de ingreso en vez del
       Excel. postBytes ya pide arraybuffer, así que llega el binario entero. */
    Ventana.excel = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);
        var rejilla = modelo ? modelo.instanciaGrilla : null;
        var nombre = nombreArchivo(modelo, tabla);
        var filas, frm;

        if (!rejilla) { Ventana.registrar("No hay grilla que exportar en " + tabla); return false; }

        filas = rejilla.visibles();
        if (filas.length === 0) {
            Formulario.avisar(tabla, "A", "No hay registros que exportar.");
            return false;
        }

        frm = new FormData();
        frm.append("archivo", nombre);
        frm.append("data", tramaExportacion(rejilla.columnas(), filas));

        Http.postBytes(controladorDe(tabla) + "/Exportar", function (rpta) {
            /* Aquí no se descomprime ni se parte en segmentos: lo que vuelve
               es el .xlsx tal cual lo armó ExcelMemory. */
            if (!descargar(rpta, nombre)) {
                Formulario.avisar(tabla, "E", "El servidor no devolvió el archivo.");
            }
        }, frm, {
            error: function (falla) { Formulario.avisar(tabla, "E", falla.mensaje); }
        });
        return true;
    };

    /* Guarda un binario como archivo. Chrome 49 tiene Blob, createObjectURL y
       el atributo download; el enlace se pulsa por código y se retira. La URL
       del objeto se libera después, si no el archivo queda en memoria hasta
       que se cierre la pestaña. */
    function descargar(datos, nombre) {
        var bloque, url, enlace;

        if (!datos || (datos.byteLength !== undefined && datos.byteLength === 0)) return false;
        if (typeof Blob !== "function" && typeof Blob !== "object") return false;

        bloque = new Blob([datos], { type: MIME_EXCEL });
        if (window.navigator && window.navigator.msSaveBlob) {
            window.navigator.msSaveBlob(bloque, nombre);
            return true;
        }

        url = window.URL.createObjectURL(bloque);
        enlace = document.createElement("a");
        enlace.href = url;
        enlace.download = nombre;
        enlace.style.display = "none";
        document.body.appendChild(enlace);
        enlace.click();
        document.body.removeChild(enlace);
        window.setTimeout(function () { window.URL.revokeObjectURL(url); }, 1000);
        return true;
    }

    /* El nombre sale de 'archivo=' en la línea grilla del txt; si no está, se
       usa el título de la pantalla. Viaja al servidor y vuelve como nombre de
       descarga, así que se le quitan barras y saltos de línea. */
    function nombreArchivo(modelo, tabla) {
        var declarado = modelo && modelo.grilla ? modelo.grilla.archivo : "";
        var base = declarado !== "" ? declarado : (modelo && modelo.titulo ? modelo.titulo : tabla);
        var limpio = base.replace(/[^0-9A-Za-zÁÉÍÓÚÑáéíóúñ ._-]/g, "").replace(/\s+/g, "_");

        if (limpio === "") limpio = tabla;
        return /\.[0-9A-Za-z]+$/.test(limpio) ? limpio : limpio + ".xlsx";
    }

    Ventana.cerrar = function (tabla) {
        Ventana.cerrarPopup(tabla);
        /* Se devuelve la ventana a su estado normal: el bloqueo es de la
           acción con que se abrió, no de la pantalla. */
        Formulario.habilitar(tabla, true);
    };

    /* ---------------------------------------------------------- eliminar -- */

    function confirmar(mensaje, alAceptar) {
        var mostrado = false;
        if (typeof Mensaje !== "undefined" && Mensaje && typeof Mensaje.mostrarMensaje === "function") {
            mostrado = Mensaje.mostrarMensaje("A", mensaje, function (rpta) {
                if (rpta) alAceptar();
            }) === true;
        }
        if (mostrado) return;
        if (window.confirm(mensaje)) alAceptar();
    }

    /* El nombre de la fila para los mensajes. Sale de 'rotulo=' en la línea
       grilla del txt: dice qué campo la identifica para una persona. Se pasa
       por la traducción de la columna, así el aviso dice 'Activo' y no 'A'. */
    function rotuloDeFila(modelo, fila) {
        var id = modelo && modelo.grilla ? modelo.grilla.rotulo : "";
        var posicion, texto;

        if (!id || !fila) return "";
        posicion = posicionEnMapeo(modelo.mapeo || [], id);
        if (posicion === -1) return "";

        texto = fila[posicion] === undefined || fila[posicion] === null ? "" : String(fila[posicion]);
        if (modelo.instanciaGrilla && modelo.instanciaGrilla.textoDe) {
            texto = String(modelo.instanciaGrilla.textoDe(posicion, texto));
        }
        return texto.replace(/^\s+|\s+$/g, "");
    }

    /* Eliminar es la misma trama de grabar con la acción en 'D': el registro no
       se borra, se cierra la vigencia. */
    Ventana.eliminar = function (tabla, fila) {
        var nombre = rotuloDeFila(Formulario.modeloDe(tabla), fila);
        var aviso = nombre === ""
            ? "¿Confirma la eliminación del registro seleccionado?"
            : "¿Confirma la eliminación del registro " + nombre + "?";

        if (!fila) return;
        confirmar(aviso, function () {
            Formulario.limpiar(tabla);
            Formulario.poner(tabla, fila.join("|"));
            Formulario.auditoria(tabla, "D");
            enviarGestion(tabla);
        });
    };

    Ventana.eliminarMultiple = function (tabla, filas) {
        var cantidad = filas ? filas.length : 0;

        if (cantidad === 0) {
            Formulario.avisar(tabla, "A", "No hay registros marcados.");
            return;
        }
        confirmar("¿Confirma la eliminación de " + cantidad + " registro(s)?", function () {
            var tramas = [], i;
            for (i = 0; i < filas.length; i++) {
                Formulario.limpiar(tabla);
                Formulario.poner(tabla, filas[i].join("|"));
                Formulario.auditoria(tabla, "D");
                tramas.push(Formulario.tramaPosicional(tabla));
            }
            enviarGestion(tabla, tramas.join(SEP_REGISTRO));
        });
    };

    /* ----------------------------------------------------------- cancelar -- */

    /* Con ventana de mantenimiento, Cancelar la cierra y descarta lo escrito.
       Sin ella, deshace volviendo a pedir lo que hay en la base. */
    Ventana.cancelar = function (tabla) {
        var modelo = Formulario.modeloDe(tabla);

        if (modelo && modelo.popup) {
            Formulario.limpiar(tabla);
            Ventana.cerrar(tabla);
            return;
        }
        Formulario.limpiar(tabla);
        if (Ventana.hayCambios(tabla)) Ventana.cargar(tabla);
    };

    return Ventana;
})();
