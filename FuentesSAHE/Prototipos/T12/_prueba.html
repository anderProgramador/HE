    Validacion.validarNumerosEnlinea = function (tabla) {
        var controles = document.getElementsByClassName("N" + tabla);
        var ncontroles = controles.length;
        for (var j = 0; j < ncontroles; j++) {
            controles[j].onkeydown = function (event) {
                var keycode = ('which' in event ? event.which : event.keycode);
                var esValido = (
                    (keycode >= 48 && keycode <= 57) ||  
                    (keycode >= 96 && keycode <= 105) || 
                    keycode === 8 || keycode === 9 || keycode === 13 ||
                    keycode === 27 || keycode === 37 || keycode === 38 ||
                    keycode === 39 || keycode === 40 || keycode === 46
                );
                if (!esValido) {
                    event.preventDefault();
                    return false;
                }
                return true;
            };
            controles[j].onkeyup = function (event) {
                if (this.value !== '') {
                    var valor = parseInt(this.value);
                    var min = parseInt(this.min) || 0;
                    var max = parseInt(this.max) || 999999;
                    if (isNaN(valor)) this.value = min;
                    else if (valor < min) this.value = min;
                    else if (valor > max) this.value = max;
                }
            };
            controles[j].onchange = function (event) {
                if (this.value !== '') {
                    var valor = parseInt(this.value);
                    var min = parseInt(this.min) || 0;
                    var max = parseInt(this.max) || 999999;
                    if (isNaN(valor)) this.value = min;
                    else if (valor < min) this.value = min;
                    else if (valor > max) this.value = max;
                }
            };
            controles[j].onpaste = function (event) {
                event.preventDefault();
            };
            controles[j].onblur = function () {
                if (this.value === '' || isNaN(this.value)) this.value = this.min || 0;
            };
        }
    }

    Validacion.validarDecimalesEnlinea = function () {
        var controles = document.getElementsByClassName("D");
        var ncontroles = controles.length;
        for (var j = 0; j < ncontroles; j++) {
            controles[j].onkeyup = controles[j].onkeydown = function (event) {
                var keycode = ('which' in event ? event.which : event.keycode);
                var esValido = ((keycode > 47 && keycode < 58) || (keycode > 95 && keycode < 106) || keycode === 8 || keycode === 37 || keycode === 39 || keycode === 110 || keycode === 188 || (keycode === 190 && this.value.split(".").length < 3));
                if (!esValido) this.value = this.value.removeCharAt(this.selectionStart);
            }
            controles[j].onpaste = function (event) {
                event.preventDefault();
            }
        }
    }

    String.prototype.removeCharAt = function (i) {
        var tmp = this.split('');
        tmp.splice(i - 1, 1);
        return tmp.join('');
    }

    Validacion.mostrarMensaje = function(tabla, mensaje){
        var spnValida = document.getElementById("spnValida" + tabla);
        spnValida.innerHTML = mensaje;
        spnValida.style.display = "inline-block";
        spnValida.classList.add("show");
    }

    return Validacion;
})();

var Descomprimir = (function () {
    function Descomprimir() { }

    Descomprimir.Deflate = function (bytesComprimido) {
        var arrayComprimido = new Uint8Array(bytesComprimido);
        var bytesDescomprimido = pako.inflate(arrayComprimido, { raw: true });
        var dataDescomprimida = ab2str(bytesDescomprimido);
        return dataDescomprimida;
    }

    function ab2str(bytes) {
        var rpta = "";
        for (var k = 0; k < bytes.length; k++) {
            rpta += String.fromCharCode(bytes[k]);
        }
        return rpta;
    }

    return Descomprimir;
})();

var FileSystem = (function () {
    function FileSystem() {
    }

    FileSystem.CrearTexto = function (matriz, totalRegistros, separadorCampo, separadorRegistro, cabeceras, anchos, tipos) {
        var texto = "";
        var ncampos = matriz[0].length;
        for (var j = 0; j < ncampos; j++) {
            if(anchos[j]==="0") continue;
            //if (cabeceras[j].substr(0, 2) === "PK") texto += cabeceras[j].substr(2);
            //else texto += cabeceras[j];

            if (cabeceras[j].startsWith("PK")) {
                texto += cabeceras[j].substr(2);
            }
            else if (cabeceras[j].startsWith("UK")) {
                texto += cabeceras[j].substr(2);
            }
            else if (cabeceras[j].startsWith("GC")) {
                texto += cabeceras[j].substr(2);
            }
            else texto += cabeceras[j];

            if (j < ncampos - 1) texto += separadorCampo;
        }
        texto += separadorRegistro;

        if (anchos) {
            for (var j = 0; j < ncampos; j++) {
                if (anchos[j] === "0") continue;
                else texto += anchos[j];
                if (j < ncampos - 1) texto += separadorCampo;
            }
            texto += separadorRegistro;
        }
        if (tipos) {
            for (var j = 0; j < ncampos; j++) {
                if (anchos[j] === "0") continue;
                else texto += tipos[j];
                if (j < ncampos - 1) texto += separadorCampo;
            }
            texto += separadorRegistro;
        }

        var esNumero = false;
        var esFecha = false;
        var esDecimal = false;
        for (var i = 0; i < totalRegistros; i++) {
            for (var j = 0; j < ncampos; j++) {
                if(anchos[j]==="0") continue;
                //switch (tipos[j]) {
                //    case "Int16":
                //    case "Int32":
                //    case "float":
                //        if (tipos[j] === "Decimal") texto += matriz[i][j].toFixed(2);
                //        else texto += matriz[i][j];
                //        break;
                //    case "String":
                //        texto += matriz[i][j];
                //        break;
                //    case "Date":
                //        texto += Fecha.aFechaDMY(matriz[i][j]);
                //        break;
                //}

                esNumero = (tipos[j].indexOf("Int") > -1 || tipos[j].indexOf("Decimal") > -1);
                esFecha = (tipos[j].indexOf("Date") > -1);
                esDecimal = (tipos[j].indexOf("Decimal") > -1);
                if (esNumero) {
                    texto += matriz[i][j];
                }
                else if (esDecimal) {
                    texto += matriz[i][j].toFixed(2);
                }
                else if (esFecha) {
                    if (matriz[i][j] != "") texto += Fecha.mostrarFechaDMY(matriz[i][j]);
                    else texto += "";
                }
                else {
                    texto += matriz[i][j];
                }

                if (j < ncampos - 1) texto += separadorCampo;
            }
            if (i < totalRegistros - 1) texto += separadorRegistro;
        }
        return texto;
    }

    FileSystem.crearHtml = function (matriz, totalRegistros, separadorCampo, separadorRegistro, cabeceras, anchos, tipos, pie) {
        var html = "<html><body><table><tr>";
        var ncampos = cabeceras.length;
        for (var j = 0; j < ncampos; j++) {
            if(anchos[j]==="0") continue;
            html += "<th style='width:";
            html += anchos[j];
            html += "px; background-color:#CC0C2F; color:white;'>";
            if (cabeceras[j].substr(0, 2) === "PK") html += cabeceras[j].substr(2);
            else html += cabeceras[j];
            html += "</th>";
        }
        html += "</tr>";
        if (totalRegistros > 0) {
            var dato = "";
            for (var i = 0; i < totalRegistros; i++) {
                html += "<tr>";
                for (var j = 0; j < ncampos; j++) {
                    if(anchos[j]==="0") continue;
                    html += "<td style='text-align:";
                    switch (tipos[j]) {
                        case "Int16":
                        case "Int32":
                        case "float":
                            html += "right";
                            if (tipos[j] === "Decimal") dato = matriz[i][j].toFixed(2);
                            else dato = matriz[i][j];
                            break;
                        case "String":
                            html += "left";
                            dato = matriz[i][j];
                            if (dato.charAt(0) === '0') {
                                dato = "'" + dato;
                                //dato = "\t" + dato;
                            }
                            break;
                        case "Date":
                            html += "center";
                            dato = Fecha.aFechaDMY(matriz[i][j]);
                            break;
                    }
                    html += "'>";
                    html += dato;
                    html += "</td>";
                }
                html += "</tr>";
            }
        }
        if (pie != null && pie != "") {
            var campos = pie.split(separadorCampo);
            var inicio = +campos[0];
            html += "<tr>";
            html += "<td colspan='";
            html += campos[0];
            html += "' style='text-align:right; background-color:#4682B4; color:white;'> ";
            html += campos[1];
            html += "</td>";
            var celda = "";
            for (var j = inicio; j < ncampos; j++) {
                celda = String.fromCharCode(65 + j);
                html += "<td>";
                if (campos.indexOf(j.toString()) > -1) {
                    html += "=Contar(";
                    html += celda;
                    html += "2:";
                    html += celda;
                    html += (nRegistros + 1);
                    html += ")";
                }
                html += "</td>";
            }
            html += "</tr>";
        }
        html += "</table></body></html>";
        return html;
    }

    FileSystem.download = function (data, archivo, callback) {
        var mime = FileSystem.getMime(archivo);
        //var blob = new Blob(mime == "application/vnd.ms-excel" || mime == "text/csv" ? ["\ufeff", data] : ["\ufeff", data], { "type": mime });
        var blob = new Blob([data], { "type": mime });
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = archivo;
        link.click();
        setTimeout(function() {
            URL.revokeObjectURL(link.href);
            if (callback) callback();
        }, 100);
    }

    FileSystem.getMime = function (archivo) {
        var mime = "";
        var campos = archivo.split(".");
        var extension = campos[campos.length - 1].toLowerCase();
        switch (extension) {
            case "txt":
                mime = "text/plain";
                break;
            case "xls":
                mime = "application/vnd.ms-excel";
                break;
            case "csv":
                mime = "text/csv";
                break;
            case "json":
                mime = "application/json";
                break;
            case "xlsx":
                mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
                break;
            case "pdf":
                mime = "application/pdf";
                break;
            case "jpeg":
            case "jpg":
                mime = "image/jpeg";
            default:
                mime = "application/octet-stream";
                break;
        }
        return mime;
    }

    return FileSystem;
})();

var Fecha = (function () {
    function Fecha() {
    }

    Fecha.convertirDate = function(dato){
        var fecha = dato.split("/");
        if (fecha != "") {
            var dia = +fecha[0];
            var mes = +fecha[1] - 1;
            var anio = +fecha[2];
            return (new Date(anio, mes, dia));
        }
        else return "";
    }

    Fecha.convertirDateString = function(dato){
        var fecha = dato.split("/");
        if (fecha != "") {
            var dia = fecha[0];
            var mes = fecha[1];
            var anio = fecha[2];
            return (anio + "-" + mes + "-" + dia);
        }
        else return "";
    }

    Fecha.convertirDateTime = function(dato){
        var dfecha = dato.split(" ");
        var nDfecha = dfecha.length;
        if (nDfecha > 1) {
            var fecha = dfecha[0].split("/");
            var time = dfecha[1].split(":");
            if (fecha != "") {
                var dia = +fecha[0];
                var mes = +fecha[1] - 1;
                var anio = +fecha[2];
                var hora = +time[0];
                var minuto = +time[1];
                var segundo = +time[2];
                return (new Date(anio, mes, dia, hora, minuto, segundo));
            } else return "";
        }
        else return "";
    }

    Fecha.aFechaDMY = function (fecha) {
        if (fecha != "") {
            var anio = fecha.getYear();
            if (anio < 1000) anio = anio += 1900;
            var mes = fecha.getMonth() + 1;
            if (mes < 10) mes = "0" + mes;
            var dia = fecha.getDate();
            if (dia < 10) dia = "0" + dia;
            return (dia + "/" + mes + "/" + anio);
        }
        else return "";
    }

    Fecha.mostrarFechaDMY = function(fecha) {
        var anio = fecha.getFullYear();
        if (anio < 1000) anio = anio += 1900;
        var mes = fecha.getMonth() + 1;
        mes = (mes < 10 ? "0" + mes.toString() : mes.toString());
        var dia = fecha.getDate();
        dia = (dia < 10 ? "0" + dia.toString() : dia.toString());
        var hora = fecha.getHours();
        hora = (hora < 10 ? "0" + hora.toString() : hora.toString());
        var minuto = fecha.getMinutes();
        minuto = (minuto < 10 ? "0" + minuto.toString() : minuto.toString());
        var segundo = fecha.getSeconds();
        segundo = (segundo < 10 ? "0" + segundo.toString() : segundo.toString());
        if (hora + minuto + segundo === "000000") return (dia + "/" + mes + "/" + anio);
        else return (dia + "/" + mes + "/" + anio + " " + hora + ":" + minuto + ":" + segundo);
    }

    Fecha.fechaMinima = function(añosAtras = 0) {
        var añoActual = new Date().getFullYear();
        var añoObjetivo = añoActual - añosAtras;
        var fechaMinima = new Date(añoObjetivo, 0, 1);
        return fechaMinimaStr = fechaMinima.toISOString().split('T')[0];
    }

    Fecha.fechaMaxima = function(añosSumar = 0) {
        var añoActual = new Date().getFullYear();
        var fechaMaxima = new Date(añoActual, 11, 31);
        return fechaMaximaStr = fechaMaxima.toISOString().split('T')[0];
    }

    Fecha.sumarDias = function (fechaIni, cantidadDias) {
        var partes = fechaIni.split('-');
        var datFechaIni = new Date(+partes[0], +partes[1] - 1, +partes[2])
        if (datFechaIni.toString() != "Invalid Date") {
            datFechaIni.setDate(datFechaIni.getDate() + parseInt(cantidadDias, 10) - 1);
            var anio = datFechaIni.getFullYear();
            if (anio.toString().length > 3) {
                var mes = datFechaIni.getMonth() + 1;
                if (mes.toString().length == 1) mes = "0" + mes.toString();
                var dia = datFechaIni.getDate();
                if (dia.toString().length == 1) dia = "0" + dia.toString();
            }
        }
        return anio + "-" + mes + "-" + dia;
    }
    return Fecha;
})();

var Mensaje = (function () {
    /* El marcado del diálogo vive UNA sola vez, en Escritorio.cshtml, con el id
       divPantMensaje. Una pantalla cargada dentro de #ifrPagina no lo tiene en
       su propio documento: le pide el diálogo al padre, y así el velo cubre
       toda la ventana en vez del rectángulo del marco.

       Antes el overlay se buscaba una sola vez al cargar el archivo y se
       guardaba en una variable; en una vista sin el marcado quedaba en null
       para siempre. Ahora se resuelve en cada llamada.                       */
    var ID_DIALOGO = "divPantMensaje";
    var respuestaCallback = null;

    function Mensaje() {
    }

    function overlayPropio() {
        return document.getElementById(ID_DIALOGO);
    }

    /* Mensaje del documento padre, cuando esta pantalla corre dentro del marco
       y no tiene diálogo propio. Same-origin; si no lo fuera, el try lo cubre. */
    function mensajeDelPadre() {
        try {
            if (window.parent && window.parent !== window &&
                window.parent.Mensaje && window.parent.document &&
                window.parent.document.getElementById(ID_DIALOGO)) {
                return window.parent.Mensaje;
            }
        } catch (e) {
            /* otro origen: se trabaja solo con el documento actual */
        }
        return null;
    }

    Mensaje.configurarMensaje = function () {
        var popupOverlay = overlayPropio();
        /* Sin marcado propio no hay nada que enganchar: los botones que atienden
           la respuesta son los del padre y los engancha el padre. */
        if (!popupOverlay) return false;
        closePopup();
        var popupCloseBtn = document.getElementById('popupCloseBtn');
        var popupCancelBtn = document.getElementById('popupCancelBtn');
        if (popupCloseBtn) {
            popupCloseBtn.onclick = function () {
                if (respuestaCallback) respuestaCallback(false);
                closePopup();
            }
        }
        if (popupCancelBtn) {
            popupCancelBtn.onclick = function () {
                if (respuestaCallback) respuestaCallback(false);
                closePopup();
            }
        }
        var popupOkBtn = document.getElementById('popupOkBtn');
        if (popupOkBtn){
            popupOkBtn.onclick = function(){
                if (respuestaCallback) respuestaCallback(true);
                closePopup();
            }
        }
    }

    function closePopup() {
        var popupOverlay = overlayPropio();
        if (popupOverlay) {
            popupOverlay.style.display = "none";
            popupOverlay.classList.remove('active');
            respuestaCallback = null;
        }
    }

    function openPopup() {
        var popupOverlay = overlayPropio();
        if (popupOverlay) {
            popupOverlay.style.display = "flex";
            popupOverlay.classList.add('active');
        }
    }
    
    var ICONOS_MENSAJE = {
        confirmacion: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
        advertencia: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
        error: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>'
    };

    /* Devuelve true si alcanzó a mostrar el mensaje y false si la pantalla no
       tiene el marcado del popup (divPM). Antes no se validaba: en una vista
       sin divPM, divPMW quedaba null y la primera línea lanzaba TypeError, con
       lo que se perdía el clic completo -por ejemplo el de Cerrar sesión- sin
       ningún aviso. Quien llama puede usar el false para caer a confirm().   */
    Mensaje.mostrarMensaje = function (tipo, mensaje, callback) {
        var popupOverlay = overlayPropio();
        var delPadre, divPMW, popupTitleIcon, popupOkBtn, popupTitleText,
            popupMessageText, popupCancelBtn;

        /* Sin diálogo propio se delega COMPLETO al padre, no solo el dibujo:
           así la respuesta del usuario y el callback quedan en el mismo módulo
           que enganchó los botones. */
        if (!popupOverlay) {
            delPadre = mensajeDelPadre();
            if (delPadre) return delPadre.mostrarMensaje(tipo, mensaje, callback);
            if (typeof console !== "undefined" && console && console.warn) {
                console.warn("[Mensaje] No hay diálogo (" + ID_DIALOGO + ") en esta pantalla ni en la que la contiene; no se pudo mostrar: " + mensaje);
            }
            return false;
        }

        divPMW = document.getElementById("divPMW");
        popupTitleIcon = document.getElementById('popupTitleIcon');
        popupOkBtn = document.getElementById('popupOkBtn');
        popupTitleText = document.getElementById('popupTitleText');
        popupMessageText = document.getElementById('popupMessageText');
        popupCancelBtn = document.getElementById('popupCancelBtn');

        if (!divPMW || !popupTitleIcon || !popupOkBtn || !popupTitleText || !popupMessageText) {
            if (typeof console !== "undefined" && console && console.warn) {
                console.warn("[Mensaje] El marcado de " + ID_DIALOGO + " está incompleto; no se pudo mostrar: " + mensaje);
            }
            return false;
        }

        respuestaCallback = (typeof callback === "function") ? callback : null;
        divPMW.classList.remove('confirmacion', 'advertencia', 'error');
        switch (tipo) {
            case "C":
                divPMW.classList.add('confirmacion');
                popupTitleIcon.innerHTML = ICONOS_MENSAJE.confirmacion;
                popupTitleText.textContent = "Confirmación";
                popupOkBtn.textContent = 'Aceptar';
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
            case "A":
                divPMW.classList.add('advertencia');
                popupTitleIcon.innerHTML = ICONOS_MENSAJE.advertencia;
                popupTitleText.textContent = "Advertencia";
                popupOkBtn.textContent = 'Continuar';
                if (popupCancelBtn) popupCancelBtn.style.display = "inline-block";
                break;
            case "E":
                divPMW.classList.add('error');
                popupTitleIcon.innerHTML = ICONOS_MENSAJE.error;
                popupTitleText.textContent = "Error";
                popupOkBtn.textContent = 'Continuar';
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
            case "U":
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
            default:
                if (popupCancelBtn) popupCancelBtn.style.display = "none";
                break;
        }
        popupMessageText.textContent = mensaje;
        openPopup();
        return true;
    }

    return Mensaje;
})();

</script>

   las pantallas y viven en el módulo Ventana de General.js.

   Los botones Grabar y Cancelar de la plantilla ya quedan atendidos por
   Ventana; aquí solo se registrarían si esta pantalla necesitara algo
   distinto de lo normal.

   ========================================================================== */

        /* Dos etapas, en este orden: Ventana.crear arma el HTML con sus

           dos; la pantalla solo dice qué hacer al final. */
        modelo = Ventana.iniciar(controles, CONTROLADOR, tabla, "PantPri", alCargar);
        if (!modelo) {

            Mensaje.configurarMensaje();
        }

        if (modelo.titulo) document.title = "SAHE - " + modelo.titulo;
    }

    /* Lo propio de esta pantalla una vez que ya tiene sus datos. Por ahora
       nada; el gancho queda porque es donde iría. */
    function alCargar() {
    }

    return {
        iniciar: iniciar,
        tabla: function () { return tabla; }
    };
})();
