       (llegó en esa versión) salvo async/await, Object.entries, spread de
       objetos y NodeList.forEach, que aquí no se usan.

       El formato posicional anterior sigue atendido por crearFormatoPosicional,
       de modo que las pantallas heredadas no se tocan.
       ===================================================================== */
    var Plantilla = (function () {
        "use strict";

        /* ES5 puro: solo var, sin const/let, sin funciones flecha, sin plantillas
           de cadena y sin métodos posteriores a Chrome 49. Las enseñanzas de
           Kyle Simpson se mantienen por disciplina y no por sintaxis: modo
           estricto, todo el estado dentro del cierre, una declaración por
           función al inicio, funciones cortas de una sola responsabilidad,
           comparación con === y ningún global implícito.                      */

        var SEPARADOR_REGISTRO = /\r?\n|¬/;
        var ANCHOS = ["corto", "medio", "largo", "total"];
        var NANCHOS = ANCHOS.length;

        /* Se conservan los prefijos de id del aplicativo anterior. Lo que de
           verdad usa Ventana.obtenerDatos es la clase G+tabla.               */
        var PREFIJOS = {
            number: "num", text: "txt", textarea: "txa", archivo: "fup",
            select: "cbo", checkbox: "chk", fecha: "dat", oculto: "hdn"
        };

        /* ------------------------------------------------ 1. analizar ----- */

        function esPlantillaNombrada(datos) {
            return typeof datos === "string" && /(^|\r?\n|¬)\s*pantalla\|/.test(datos);
        }

        function separarLista(texto) {
            var partes = String(texto || "").split(","), salida = [], i, n = partes.length, dato;
            for (i = 0; i < n; i++) {
                dato = partes[i].replace(/^\s+|\s+$/g, "");
                if (dato !== "") salida.push(dato);
            }
            return salida;
        }

        function analizarRegistro(linea) {
            var partes = linea.split("|");
            /* Es la cantidad de campos, no el largo de la cadena: con
               linea.length el bucle se pasaba del final del arreglo, par
               quedaba undefined y par.indexOf reventaba la construcción de
               toda la ventana. */
            var nPartes = partes.length;
            var registro = { tipo: partes[0].replace(/^\s+|\s+$/g, ""), atributos: {} };
            var i, par, corte, clave, valor;

            for (i = 1; i < nPartes; i++) {
                par = partes[i];
                if (par === undefined || par === "") continue;
                corte = par.indexOf("=");
                if (corte === -1) continue;               /* par suelto: se ignora */
                clave = par.substring(0, corte).replace(/^\s+|\s+$/g, "");
                valor = par.substring(corte + 1).replace(/^\s+|\s+$/g, "");
                if (clave !== "") registro.atributos[clave] = valor;
            }
            return registro;
        }

        /* Columnas de la grilla, declaradas en una sola línea de la plantilla:
               columnas=Id:0:numero,Código:150,Descripción:280:texto
           Cada columna es titulo[:ancho[:tipo]]. Ancho 0 la oculta, que es como
           se lleva la llave sin mostrarla. */
        function analizarColumnas(texto) {
            var partes = separarLista(texto), salida = [], i, campos, ancho;

            for (i = 0; i < partes.length; i++) {
                campos = partes[i].split(":");
                ancho = campos.length > 1 ? campos[1].replace(/^\s+|\s+$/g, "") : "";
                salida.push({
                    titulo: campos[0].replace(/^\s+|\s+$/g, ""),
                    ancho: ancho,
                    tipo: campos.length > 2 ? campos[2].replace(/^\s+|\s+$/g, "") : "texto",
                    /* Cuarta parte: índice de la lista con la que se traduce el
                       código que devuelve Oracle a su descripción. */
                    lista: campos.length > 3 ? campos[3].replace(/^\s+|\s+$/g, "") : "",
                    oculto: ancho === "0"
                });
            }
            return salida;
        }

        /* Los nombres se normalizan contra una lista canónica: en el txt da
           igual escribir eliminarMultiple, eliminarmultiple o ELIMINARMULTIPLE,
           y del otro lado siempre se compara contra el mismo nombre. Antes se
           pasaba todo a minúsculas y 'eliminarmultiple' no coincidía con el
           'eliminarMultiple' que usan los permisos. */
        var ACCIONES_CANONICAS = ["nuevo", "eliminarMultiple", "excel", "editar", "eliminar", "ver"];

        function normalizarAccion(nombre) {
            var buscado = String(nombre || "").toLowerCase(), i;
            for (i = 0; i < ACCIONES_CANONICAS.length; i++) {
                if (ACCIONES_CANONICAS[i].toLowerCase() === buscado) return ACCIONES_CANONICAS[i];
            }
            return "";
        }

        /* Combos de la fila de filtros, en el formato de siempre: columna,
           tipo (cs simple, cm múltiple) e índice de la lista. Por ejemplo
           '6cs1' pone en la columna 6 un combo simple con la lista 1.
           Van separados por coma y no por | porque aquí | separa los campos
           del registro. */
        /* 'editables=3num,4fec' -> qué columnas se escriben y con qué control.
           Mismo formato que los combos: índice de columna + tipo.
              num  número entero      dec  número con decimales
              txt  texto              fec  fecha
           Una columna sin declarar es de solo lectura, que es lo que era
           antes: la grilla no se vuelve editable por accidente. */
        var TIPOS_EDICION = { num: "numero", dec: "decimal", txt: "texto", fec: "fecha" };

        function analizarEditables(texto) {
            var partes = separarLista(texto), salida = [], i, dato, corte, clave, tipo;

            for (i = 0; i < partes.length; i++) {
                dato = partes[i].toLowerCase();
                corte = -1;
                for (clave in TIPOS_EDICION) {
                    if (!Object.prototype.hasOwnProperty.call(TIPOS_EDICION, clave)) continue;
                    if (dato.indexOf(clave) > 0) { corte = dato.indexOf(clave); tipo = TIPOS_EDICION[clave]; break; }
                }
                if (corte < 1) continue;
                salida.push({ columna: Number(dato.substring(0, corte)), tipo: tipo });
            }
            return salida;
        }

        /* 'totales=3,4' -> qué columnas suman al pie. Se declara aparte del
           tipo porque no toda columna numérica se suma: un año o un código de
           agencia son números y sumarlos no significa nada. */
        function analizarTotales(texto) {
            var partes = separarLista(texto), salida = [], i, n;
            for (i = 0; i < partes.length; i++) {
                n = Number(partes[i]);
                if (!isNaN(n) && partes[i] !== "") salida.push(n);
            }
            return salida;
        }

        function analizarCombos(texto) {
            var partes = separarLista(texto), salida = [], i, dato, corte, tipo;

            for (i = 0; i < partes.length; i++) {
                dato = partes[i].toLowerCase();
                corte = dato.indexOf("cs");
                tipo = "cs";
                if (corte === -1) { corte = dato.indexOf("cm"); tipo = "cm"; }
                if (corte < 1) continue;                 /* sin columna delante */
                salida.push({
                    columna: Number(dato.substring(0, corte)),
                    tipo: tipo,
                    lista: Number(dato.substring(corte + 2))
                });
            }
            return salida;
        }

        /* 'editar:Codigo,Justificacion;nuevo:Secuencia' -> un arreglo de ids
           por acción. Los grupos van con ; y los campos de cada uno con , ,
           porque el | ya separa los campos del registro. Sin el prefijo de
           acción, la lista se aplica a todas. */
        function analizarPorAccion(texto) {
            var grupos = String(texto || "").split(";"), salida = {}, i, corte, accion, campos;

            for (i = 0; i < grupos.length; i++) {
                if (grupos[i].replace(/^\s+|\s+$/g, "") === "") continue;
                corte = grupos[i].indexOf(":");
                if (corte === -1) { accion = "todas"; campos = grupos[i]; }
                else {
                    accion = normalizarAccion(grupos[i].substring(0, corte));
                    campos = grupos[i].substring(corte + 1);
                }
                salida[accion] = (salida[accion] || []).concat(separarLista(campos));
            }
            return salida;
        }

        function analizarAcciones(texto) {
            var lista = separarLista(texto), salida = {}, i, nombre;
            for (i = 0; i < lista.length; i++) {
                nombre = normalizarAccion(lista[i]);
                if (nombre !== "") salida[nombre] = true;
            }
            return salida;
        }

        function analizar(texto) {
            var modelo = {
                tabla: "", titulo: "", subtitulo: "",
                secciones: [], ocultos: [], acciones: [], mapeo: [], mapeoGrabar: [], mapeoObtener: [],
                /* Todos los campos en el orden en que aparecen en el archivo,
                   ocultos incluidos. 'secciones' y 'ocultos' sirven para
                   dibujar; 'todos' para setear y leer por posición. */
                todos: [],
                grilla: null,
                /* Las secciones y acciones que van dentro de la ventana de
                   mantenimiento, para no mezclarlas con la pantalla principal. */
                popup: null,
                /* La grilla editable de la ventana de mantenimiento. */
                detalle: null,
                /* Una definición por lupa, en el orden en que el paquete manda
                   las ayudas del segmento 2. */
                ayudas: []
            };
            var lineas = String(texto || "").split(SEPARADOR_REGISTRO);
            var nLineas = lineas.length;
            var seccionActual = null;
            /* A partir de una línea 'popup', todo lo que sigue pertenece a la
               ventana de mantenimiento. Un solo interruptor, fácil de leer en
               el txt y de analizar aquí. */
            var destino = modelo;
            var i, linea, registro, a;

            for (i = 0; i < nLineas; i++) {
                linea = lineas[i].replace(/^\s+|\s+$/g, "");
                if (linea === "" || linea.charAt(0) === "#") continue;

                registro = analizarRegistro(linea);
                a = registro.atributos;

                if (registro.tipo === "pantalla") {
                    modelo.tabla = a.tabla || "";
                    modelo.titulo = a.titulo || "";
                    modelo.subtitulo = a.subtitulo || "";
                } else if (registro.tipo === "grilla") {
                    modelo.grilla = {
                        columnas: analizarColumnas(a.columnas),
                        porPagina: a.porPagina ? Number(a.porPagina) : 10,
                        filtros: a.filtros !== "no",
                        combos: analizarCombos(a.combos),
                        /* pk: con qué campos se identifica una fila al pedirla
                           con Obtener o al borrarla. Sin esto se usaría el
                           primero del mapeo.
                           uk: los campos que no se pueden repetir entre filas.
                           Se comprueban antes de mandar, para no ir al servidor
                           a que Oracle devuelva un ORA-00001. */
                        pk: separarLista(a.pk || a.llave),
                        /* Campo que identifica a la fila cuando hay que
                           nombrarla en un mensaje, p. ej. al eliminar. */
                        rotulo: a.rotulo || "",
                        uk: separarLista(a.uk),
                        archivo: a.archivo || "",
                        /* Campo de la pantalla principal cuyo valor viaja al
                           paquete como filtro. Lo usan las tablas grandes,
                           donde traer todo no es una opción. */
                        filtro: a.filtro || "",
                        /* Cuántas filas por viaje. Solo tiene sentido en las
                           tablas grandes; sin esto se trae todo de una vez. */
                        bloque: a.bloque ? Number(a.bloque) : 0,
                        editables: analizarEditables(a.editables),
                        totales: analizarTotales(a.totales),
                        acciones: analizarAcciones(a.acciones)
                    };
                } else if (registro.tipo === "detalle") {
                    /* La grilla que va DENTRO de la ventana de mantenimiento:
                       los conceptos del trabajador, las cuotas de un préstamo,
                       lo que la pantalla necesite editar de a varios.
                       Se declara igual que la grilla principal y admite además
                       'editables=' y 'totales='. */
                    modelo.detalle = {
                        titulo: a.titulo || "Detalle",
                        columnas: analizarColumnas(a.columnas),
                        porPagina: a.porPagina ? Number(a.porPagina) : 0,
                        filtros: a.filtros === "si",
                        combos: analizarCombos(a.combos),
                        editables: analizarEditables(a.editables),
                        totales: analizarTotales(a.totales),
                        acciones: analizarAcciones(a.acciones),
                        mapeo: separarLista(a.campos)
                    };
                } else if (registro.tipo === "ayuda") {
                    /* 'destino' se llena en cuanto el usuario elige una fila:
                       columna 0 al primer campo, columna 1 al segundo. */
                    modelo.ayudas.push({
                        titulo: a.titulo || "Búsqueda",
                        ancho: a.ancho || "720",
                        porPagina: a.porPagina ? Number(a.porPagina) : 10,
                        columnas: analizarColumnas(a.columnas),
                        destino: separarLista(a.destino)
                    });
                } else if (registro.tipo === "popup") {
                    modelo.popup = {
                        titulo: a.titulo || "Mantenimiento",
                        ancho: a.ancho || "640",
                        /* Qué campos quedan bloqueados según con qué acción se
                           abre la ventana. Lo decide la pantalla, no el JS. */
                        deshabilitar: analizarPorAccion(a.deshabilitar),
                        secciones: [], ocultos: [], acciones: [], todos: []
                    };
                    destino = modelo.popup;
                    seccionActual = null;
                } else if (registro.tipo === "seccion") {
                    seccionActual = { id: a.id || "", titulo: a.titulo || "", descripcion: a.descripcion || "", campos: [] };
                    destino.secciones.push(seccionActual);
                } else if (registro.tipo === "campo") {
                    /* El orden del archivo se respeta aunque un oculto quede
                       entre dos visibles: es el orden en que el paquete manda
                       el registro y en el que hay que asignarlo. */
                    destino.todos.push(a);
                    if (a.tipo === "oculto") destino.ocultos.push(a);
                    else if (seccionActual) seccionActual.campos.push(a);
                } else if (registro.tipo === "accion") {
                    destino.acciones.push(a);
                } else if (registro.tipo === "mapeo") {
                    /* Dos órdenes distintos: el que devuelve listar y el que
                       espera gestionar. Si solo se declara uno, sirve para las
                       dos cosas. */
                    if (a.origen === "grabar") { modelo.mapeoGrabar = separarLista(a.campos); continue; }
                    /* Obtener puede devolver el registro en otro orden que la
                       grilla: el suyo es el de los controles del popup. */
                    if (a.origen === "obtener") { modelo.mapeoObtener = separarLista(a.campos); continue; }
                    /* Orden en que el procedimiento almacenado devuelve los
                       campos de un registro. Es lo único que traduce la trama
                       posicional de Oracle a los nombres de la pantalla; al
                       estar aquí, junto a los campos, se mantiene a la vista. */
                    modelo.mapeo = separarLista(a.campos);
                }
            }
            return modelo;
        }

        /* ------------------------------------------------ 2. construir ---- */

        /* Un único ayudante para crear nodos: el texto entra por textContent,
           así que no hay concatenación de HTML ni nada que escapar a mano.   */
        function elemento(tag, atributos, texto) {
            var nodo = document.createElement(tag);
            var claves, nClaves, i, valor;

            if (atributos) {
                claves = Object.keys(atributos);
                nClaves = claves.length;
                for (i = 0; i < nClaves; i++) {
                    valor = atributos[claves[i]];
                    if (valor !== undefined && valor !== null && valor !== "") {
                        nodo.setAttribute(claves[i], valor);
                    }
                }
            }
            if (texto !== undefined && texto !== null && texto !== "") nodo.textContent = texto;
            return nodo;
        }

        function idControl(campo) {
            return (PREFIJOS[campo.tipo] || "txt") + (campo.id || "");
        }

        function clasesDato(campo, tabla) {
            /* G+tabla la usa obtenerDatos; R+tabla marca lo requerido. */
            var clases = "control G" + tabla;
            if (campo.requerido === "si") clases += " R" + tabla;
            return clases;
        }

        function esAnchoValido(ancho) {
            var i;
            for (i = 0; i < NANCHOS; i++) {
                if (ANCHOS[i] === ancho) return true;
            }
            return false;
        }

        /* Tabla de constructores: agregar un tipo de control es agregar una
           entrada, no editar un switch de doscientas líneas.                 */
        var CONSTRUCTORES = {
            number: function (campo, tabla) {
                return elemento("input", {
                    type: "number", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla),
                    min: campo.min, max: campo.max, step: campo.paso || "1",
                    "data-default": campo.valor
                });
            },
            text: function (campo, tabla) {
                return elemento("input", {
                    type: "text", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla),
                    maxlength: campo.largo, placeholder: campo.marcador,
                    readonly: campo.soloLectura === "si" ? "readonly" : null,
                    "data-default": campo.valor
                });
            },
            textarea: function (campo, tabla) {
                return elemento("textarea", {
                    id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla),
                    rows: campo.filas || "3", maxlength: campo.largo,
                    placeholder: campo.marcador
                });
            },
            fecha: function (campo, tabla) {
                return elemento("input", {
                    type: "date", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla), min: campo.min, max: campo.max
                });
            },
            checkbox: function (campo, tabla) {
                return elemento("input", {
                    type: "checkbox", id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla), value: campo.valor || "1"
                });
            },
            select: function (campo, tabla) {
                return elemento("select", {
                    id: idControl(campo), name: campo.id,
                    "class": clasesDato(campo, tabla), "data-cbotipo": campo.origen
                });
            },
            oculto: function (campo, tabla) {
                return elemento("input", {
                    type: "hidden", id: idControl(campo), name: campo.id,
                    "class": "G" + tabla,
                    /* value además de data-default: si no, el oculto nace
                       vacío y el valor de la plantilla recién aparecía al
                       cancelar. */
                    value: campo.valor,
                    "data-default": campo.valor
                });
            },
            /* El archivo son tres controles: la caja que muestra el nombre, el
               botón visible y el input real, que queda oculto.                */
            archivo: function (campo, tabla) {
                var caja = elemento("div", { "class": "campo__archivo" });
                caja.appendChild(elemento("input", {
                    type: "text", id: "txt" + campo.id, name: campo.id,
                    "class": clasesDato(campo, tabla), readonly: "readonly",
                    placeholder: "Ningún archivo seleccionado"
                }));
                caja.appendChild(elemento("button", {
                    type: "button", id: "btnArchivo" + campo.id,
                    "class": "boton boton--secundario",
                    "data-abrir": "fup" + campo.id
                }, "Examinar…"));
                caja.appendChild(elemento("input", {
                    type: "file", id: "fup" + campo.id, name: "fup" + campo.id,
                    "class": "campo__archivo-real", accept: campo.acepta
                }));
                return caja;
            }
        };

        /* Un campo lleva lupa cuando declara con qué ayuda se busca:
           'lupa=0' es la primera ayuda que manda el paquete. */
        function tieneLupa(campo) {
            return campo.lupa !== undefined && campo.lupa !== "";
        }

        /* El icono es un SVG y no un carácter: '🔍' se ve distinto en cada
           equipo y en Chrome 49 sobre Windows 7 sale en blanco y negro. */
        function construirLupa(campo) {
            var boton = elemento("button", {
                type: "button", "class": "campo__lupa",
                id: "lup" + campo.id, title: "Buscar",
                "data-accion": "buscar", "data-lupa": campo.id,
                "data-ayuda": campo.lupa
            });
            var dibujo = (typeof Grilla !== "undefined" && Grilla.icono) ? Grilla.icono("buscar", 16) : null;

            if (dibujo) boton.appendChild(dibujo);
            else boton.appendChild(document.createTextNode("Buscar"));
            return boton;
        }

        /* Cuántos caracteres admite el campo para el contador. 'contador=250'
           fija el tope a mano; 'contador=si' toma el 'largo', que es el mismo
           que ya limita la caja. Sin 'contador' no se dibuja nada: hay campos
           cortos donde el número sobra. */
        function topeContador(campo) {
            var declarado = campo.contador;
            if (!declarado) return 0;
            if (declarado === "si") return Number(campo.largo || 0);
            return isNaN(Number(declarado)) ? 0 : Number(declarado);
        }

        function construirContador(campo) {
            var caja = elemento("p", { "class": "campo__contador", id: "cnt" + campo.id });
            caja.appendChild(elemento("span", { "class": "campo__contador-usado" }, "0"));
            caja.appendChild(document.createTextNode(" / " + topeContador(campo)));
            return caja;
        }

        function construirCampo(campo, tabla) {
            var ancho = esAnchoValido(campo.ancho) ? campo.ancho : "medio";
            var bloque = elemento("div", { "class": "campo campo--" + ancho, "data-campo": campo.id });
            var etiqueta = elemento("label", { "class": "campo__etiqueta", "for": idControl(campo) }, campo.etiqueta);
            var control = elemento("div", { "class": "campo__control" });
            var constructor = CONSTRUCTORES[campo.tipo] || CONSTRUCTORES.text;

            if (campo.requerido === "si") {
                etiqueta.appendChild(elemento("span", { "class": "campo__obligatorio", title: "Obligatorio" }, "*"));
            }
            bloque.appendChild(etiqueta);

            control.appendChild(constructor(campo, tabla));
            if (campo.unidad) control.appendChild(elemento("span", { "class": "campo__unidad" }, campo.unidad));
            if (tieneLupa(campo)) {
                control.className = "campo__control campo__control--conLupa";
                control.appendChild(construirLupa(campo));
            }
            bloque.appendChild(control);

            if (topeContador(campo) > 0) bloque.appendChild(construirContador(campo));
            if (campo.ayuda) bloque.appendChild(elemento("p", { "class": "campo__ayuda" }, campo.ayuda));
            bloque.appendChild(elemento("p", { "class": "campo__error", id: "err" + campo.id }));

            return bloque;
        }

        function construirSeccion(seccion, tabla) {
            var bloque = elemento("section", { "class": "seccion", id: "sec" + seccion.id });
            var campos = elemento("div", { "class": "seccion__campos" });
            var i;

            bloque.appendChild(elemento("h2", { "class": "seccion__titulo" }, seccion.titulo));
            if (seccion.descripcion) {
                bloque.appendChild(elemento("p", { "class": "seccion__descripcion" }, seccion.descripcion));
            }
            var nSeccion = seccion.campos.length;
            for (i = 0; i < nSeccion; i++) {
                campos.appendChild(construirCampo(seccion.campos[i], tabla));
            }
            bloque.appendChild(campos);
            return bloque;
        }

        function construir(modelo) {
            var tabla = modelo.tabla;
            var fragmento = document.createDocumentFragment();
            var cabecera = elemento("div", { "class": "pantalla__cabecera" });
            var cuerpo = elemento("div", { "class": "pantalla__cuerpo" });
            var pie = elemento("div", { "class": "pantalla__acciones" });
            var botones = elemento("div", { "class": "pantalla__botones" });
            var i, accion;

            cabecera.appendChild(elemento("h1", { "class": "pantalla__titulo", id: "hTituloPantalla" + tabla }, modelo.titulo));
            if (modelo.subtitulo) {
                cabecera.appendChild(elemento("p", { "class": "pantalla__subtitulo" }, modelo.subtitulo));
            }
            fragmento.appendChild(cabecera);

            /* La grilla solo necesita su contenedor: el módulo Grilla arma
               dentro la barra, la tabla, los filtros y la paginación. */
            if (modelo.grilla) {
                cuerpo.appendChild(elemento("div", { "class": "gPrincipal", id: "gPri" + tabla }));
            }

            var nModelo = modelo.secciones.length;
            for (i = 0; i < nModelo; i++) {
                cuerpo.appendChild(construirSeccion(modelo.secciones[i], tabla));
            }
            nModelo = modelo.ocultos.length;
            for (i = 0; i < nModelo; i++) {
                cuerpo.appendChild(CONSTRUCTORES.oculto(modelo.ocultos[i], tabla));
            }
            fragmento.appendChild(cuerpo);

            /* La barra de acciones de la pantalla principal solo tiene sentido
               cuando esta edita directamente; con grilla, las acciones viven en
               la ventana de mantenimiento. */
            if (modelo.acciones.length > 0 || !modelo.popup) {
                pie.appendChild(elemento("span", { "class": "MensajeError", id: "spnValida" + tabla }));
                pie.appendChild(elemento("span", { "class": "pantalla__cambios", id: "spnCambios" + tabla }, "Hay cambios sin guardar."));
                nModelo = modelo.acciones.length;
                for (i = 0; i < nModelo; i++) {
                    accion = modelo.acciones[i];
                    botones.appendChild(elemento("button", {
                        type: "button", id: "btn" + accion.id + tabla,
                        "class": "boton boton--" + (accion.estilo || "secundario"),
                        "data-accion": accion.accion || ""
                    }, accion.etiqueta));
                }
                pie.appendChild(botones);
                fragmento.appendChild(pie);
            }

            if (modelo.popup) fragmento.appendChild(construirPopup(modelo));

        }

        /* Ventana de mantenimiento: mismo velo y misma caja que el diálogo de
           mensajes, para que las dos se vean de la misma familia. */
        function construirPopup(modelo) {
            var tabla = modelo.tabla;
            var popup = modelo.popup;
            var velo = elemento("div", { "class": "velo", id: "divVelo" + tabla });
            var ventana = elemento("div", { "class": "ventana", role: "dialog" });
            var barra = elemento("div", { "class": "ventana__barra" });
            var cuerpo = elemento("div", { "class": "ventana__cuerpo" });

            for (i = 0; i < n; i++) cuerpo.appendChild(construirSeccion(popup.secciones[i], tabla));
            n = popup.ocultos.length;
            for (i = 0; i < n; i++) cuerpo.appendChild(CONSTRUCTORES.oculto(popup.ocultos[i], tabla));

                cuerpo.appendChild(elemento("div", { "class": "gDetalle", id: "gDet" + tabla }));
            }

            pie.appendChild(elemento("span", { "class": "MensajeError", id: "spnValida" + tabla }));
            n = popup.acciones.length;
            for (i = 0; i < n; i++) {
                accion = popup.acciones[i];
                pie.appendChild(elemento("button", {
                    type: "button", id: "btn" + accion.id + tabla,
                    "class": "boton boton--" + (accion.estilo || "secundario"),
                    "data-accion": accion.accion || ""
                }, accion.etiqueta));
            }

            ventana.appendChild(barra);
            ventana.appendChild(cuerpo);
            ventana.appendChild(pie);
            velo.appendChild(ventana);
            return velo;
        }

        function construirBarraDetalle(detalle, tabla) {
            var barra = elemento("div", { "class": "detalle__barra" });
            barra.appendChild(elemento("span", { "class": "detalle__titulo" }, detalle.titulo));
            barra.appendChild(elemento("span", { "class": "detalle__cuenta", id: "spnDet" + tabla }));

        }

        /* ------------------------------------------------ 3. enlazar ------ */

        function nodoConAtributo(nodo, atributo, tope) {
            var actual = nodo;
            while (actual && actual !== tope) {
                if (actual.getAttribute && actual.getAttribute(atributo) !== null) return actual;
                actual = actual.parentNode;
            }
            return null;
        }

        function enlazar(raiz, modelo, controlador) {
            /* Un solo manejador de clic para toda la ventana. */
            raiz.onclick = function (evento) {
                var e = evento || window.event;
                var origen = e.target || e.srcElement;
                var abridor = nodoConAtributo(origen, "data-abrir", raiz);
                var entrada, boton, accion;

                if (abridor) {
                    entrada = document.getElementById(abridor.getAttribute("data-abrir"));
                    if (entrada) entrada.click();
                    return;
                }

                boton = nodoConAtributo(origen, "data-accion", raiz);
                if (!boton) return;
                accion = boton.getAttribute("data-accion");
                /* Sin tercer argumento: las acciones de la pantalla no traen
                   fila. Antes iba el controlador y llegaba como si fuera una.
                   La lupa es la excepción: tiene que decir a qué campo vuelve
                   lo que el usuario elija. */
                Ventana.ejecutarAccion(accion, modelo, boton.getAttribute("data-lupa") || undefined);
            };

            /* Marca la pantalla como modificada y revalida el campo que ya
               estaba en rojo, para que el mensaje se borre al corregirlo.
               Antes esto vivía en el archivo de cada pantalla. */
            raiz.oninput = function (evento) {
                var e = evento || window.event;
                var origen = e.target || e.srcElement;
                var bloque;

                if (!origen || !origen.getAttribute) return;
                bloque = nodoConAtributo(origen, "data-campo", raiz);
                if (!bloque) return;

                Ventana.marcarCambios(modelo.tabla, true);
                Formulario.refrescarContadores(modelo.tabla, bloque.getAttribute("data-campo"));
                if ((" " + bloque.className + " ").indexOf(" campo--error ") !== -1) {
                    Ventana.validarCampo(modelo.tabla, bloque.getAttribute("data-campo"));
                }
            };

            /* Al elegir un archivo, su nombre se muestra en la caja de texto. */
            raiz.onchange = function (evento) {
                var e = evento || window.event;
                var origen = e.target || e.srcElement;
                var caja, nArchivos;

                if (!origen || origen.type !== "file") return;
                caja = document.getElementById("txt" + origen.id.substring(3));
                if (!caja) return;
                /* origen, no orige; y la cantidad se lee después de comprobar
                   que la lista existe, porque en Chrome 49 files puede venir
                   nula si el usuario cancela el diálogo. */
                nArchivos = origen.files ? origen.files.length : 0;
                caja.value = nArchivos > 0 ? origen.files[0].name : "";
            };
        }

        /* --------------------------------------------------- entrada ------ */

        /* Construir es una cosa y llenar es otra. Aquí solo se arma el marcado
           con sus estilos; los datos no se piden hasta que esto termina, y por
           eso 'crear' avisa con alConcluir en lugar de que la pantalla suponga
           que ya está lista. */
        function crear(texto, controlador, tabla, tipoVentana, alConcluir) {
            var contenedor = document.getElementById("div" + (tipoVentana || "PantPri"));
            var modelo;

            if (!contenedor) return null;

            modelo = analizar(texto);
            if (!modelo.tabla) modelo.tabla = tabla || "";
            /* Queda en el modelo para que cargar y grabar sepan a qué
               controlador pedirle, sin que la pantalla lo repita. */
            modelo.controlador = controlador || "SAHE";
            /* Quien llene después necesita saber dónde quedó la pantalla. */
            modelo.contenedor = contenedor;

            contenedor.innerHTML = "";
            contenedor.className = "pantalla";
            contenedor.appendChild(construir(modelo));

            /* El modelo queda registrado ANTES de enlazar: los manejadores lo
               consultan para validar y para armar la trama. */
            Ventana.registrarModelo(modelo);
            enlazar(contenedor, modelo, controlador);

            if (modelo.grilla) armarGrilla(modelo);
            if (modelo.detalle) armarDetalle(modelo);

            concluir(modelo, alConcluir);
            return modelo;
        }

        /* Aquí termina la creación: el marcado ya está en el documento, los
           manejadores enlazados y la rejilla armada, aunque vacía. Se avisa en
           el siguiente cuadro para que el navegador alcance a aplicar los
           estilos y medir las columnas; recién entonces tiene sentido pedirle
           los datos al servidor. */
        function concluir(modelo, alConcluir) {
            modelo.contenedor.className = "pantalla pantalla--cargando";
            if (typeof alConcluir !== "function") {
                modelo.contenedor.className = "pantalla";
                return;
            }
            enCuadro(function () { alConcluir(modelo); });
        }

        /* Espera a que el navegador dibuje el cuadro, pero sin depender de que
           lo dibuje: requestAnimationFrame no se ejecuta si la pestaña está en
           segundo plano o el iframe oculto, y entonces la pantalla se quedaría
           construida y vacía para siempre. El temporizador es la red: corre el
           primero que llegue y el otro ya no hace nada. */
        function enCuadro(fn) {
            var hecho = false;

            function unaVez() {
                if (hecho) return;
                hecho = true;
                fn();
            }

            if (typeof window.requestAnimationFrame === "function") {
                window.requestAnimationFrame(unaVez);
            }
            window.setTimeout(unaVez, 30);
        }

        /* La grilla se crea con lo que declara la plantilla y avisa por una
           sola función: la pantalla no tiene que conocer al módulo. */
        function armarGrilla(modelo) {
            var contenedor = document.getElementById("gPri" + modelo.tabla);
            if (!contenedor || typeof Grilla === "undefined") return;

            /* Quién puede hacer qué NO lo decide la plantilla: lo decide el
               perfil, que llega en hdfTabla desde el menú. Lo que declara el
               txt es el tope -qué acciones tiene sentido ofrecer en esta
               pantalla- y de ahí se toma la intersección. */
            modelo.permisos = Ventana.permisos();
            modelo.grilla.acciones = Ventana.accionesPermitidas(modelo.grilla.acciones);
            modelo.grilla.tabla = modelo.tabla;
            modelo.grilla.alAccionar = function (accion, fila) {
                Ventana.ejecutarAccion(accion, modelo, fila);
            };
            modelo.instanciaGrilla = Grilla.crear(contenedor, modelo.grilla);
        }

           MISMO perfil que los de la pantalla: quien no puede dar de alta
           tampoco puede agregar un concepto, y quien no puede eliminar no ve
           el tacho en las filas. Lo que declara el txt es el tope. */
        function armarDetalle(modelo) {
            var caja = document.getElementById("gDet" + modelo.tabla);
            if (!caja || !modelo.detalle || typeof Grilla === "undefined") return;

            modelo.detalle.tabla = modelo.tabla + "DET";
            modelo.detalle.acciones = Ventana.accionesPermitidas(modelo.detalle.acciones);
            modelo.detalle.alAccionar = function (accion, fila) {
                Ventana.ejecutarAccion(accion + "Detalle", modelo, fila);
            };
            modelo.instanciaDetalle = Grilla.crear(caja, modelo.detalle);
        }

        return {
            esPlantillaNombrada: esPlantillaNombrada,

    /* Punto de entrada único. Reparte según el formato recibido: texto con
       campos nombrados o el arreglo posicional heredado. */
    Ventana.crear = function (datosControles, controlador, tabla, tipoVentana, alConcluir) {
        var modelo;

        if (Plantilla.esPlantillaNombrada(datosControles)) {
            return Plantilla.crear(datosControles, controlador, tabla, tipoVentana, alConcluir);
        }
        /* El formato heredado arma todo de una sola pasada, así que al volver
           ya está concluido. */
        modelo = crearFormatoPosicional(datosControles, controlador, tabla, tipoVentana);
        if (modelo && typeof alConcluir === "function") alConcluir(modelo);
        return modelo;
    };

       que ahora hace igual cualquier pantalla. */
    Ventana.iniciar = function (datosControles, controlador, tabla, tipoVentana, alCargar) {
        return Ventana.crear(datosControles, controlador, tabla, tipoVentana, function (modelo) {
            Ventana.cargar(modelo.tabla || tabla, alCargar);
        });
    };

    /* Lo asigna la pantalla (Sistema.js) para atender Grabar, Cancelar, etc. */
    Ventana.alEjecutarAccion = null;

    Ventana.analizarPlantilla = Plantilla.analizar;

    function crearFormatoPosicional(datosControles, controlador, tabla, tipoVentana) {
        var nregistros = datosControles.length;

        var htmlControl = [];
        var campos = [];

        var tipoTag = "", fila = "", rowsCampo = "", idCampo = "", colsCampo = "", claseCampo = "", svg = "", title = "", tipo = "", value = "", extra = "", style = "", readonlyCampo = "", hiddenCampo = "";
        /* Antes esta línea cortaba el var en el primer punto y coma, y de

                ancho = (+campos[0]) || 60;
                alto = (+campos[1]) || 60;
                idTablaPopup = campos[2];
                datosIdTablas.push(idTablaPopup);

                            htmlControl.push("<span id='" + idCampo + "'" + (claseCampo ? " class='" + claseCampo + "'" : "") + (title ? " title='" + title + "'" : "") + ">" + svg + "</span>");

                        break;
                    case "div":

                        claseCampo = campos[6] || "";

                        else htmlControl.push("<div id='" + idCampo + "'" + (claseCampo ? " class='" + claseCampo + "'" : "") + ">" + datoCampo + (finDivCampo ? finDivCampo : ""));

                    case "label":
                        idCampo = campos[3];

                                break;
                            case "text":
                                minValor = campos[7];
                                maxValor = campos[8];
                                readonlyCampo = campos[9];
                                placeholder = campos[10];
                                htmlControl.push("<input type='" + typeCampo + "' id='txt" + idCampo + "' name='" + nameCampo + "'" + (claseCampo ? " class='" + claseCampo + "'" : "") + (minValor ? " minlength='" + minValor + "'" : "") + (maxValor ? " maxlength='" + maxValor + "'" : "") + (readonlyCampo ? " readonly='" + readonlyCampo + "'" : "") + (placeholder ? " placeholder='" + placeholder + "'" : "") + "/>");
                                break;
                            case "date":
                                if(campos[7].length > 0) minValor = Fecha.fechaMinima(+campos[7] || 0);
                                if(campos[8].length > 0) maxValor = Fecha.fechaMaxima(+campos[8] || 0);
                                defaultCampo = campos[9];
                                eventoCampo = campos[10];
                                htmlControl.push("<input type='" + typeCampo + "' id='dat" + idCampo + "' name='" + nameCampo + "'" + (claseCampo ? " class='" + claseCampo + "'" : "") + (minValor ? " min='" + minValor + "'" : "") + (maxValor ? " max='" + maxValor + "'" : "") + (defaultCampo ? " data-default='" + defaultCampo + "'" : "") + (eventoCampo ? " onkeydown='" + eventoCampo + "'" : "") + " required pattern='[0-9]{4}-[0-9]{2}-[0-9]{2}' />");

    function resizePopup(ancho, alto, tabla) {
        var div = document.getElementById("divPW" + tabla);
        if (!div) return;
        div.style.setProperty('width', ancho + '%', 'important');
        div.style.setProperty('height', alto + '%', 'important');
        div.style.setProperty('max-height', alto + '%', 'important');
    }

    function configurarArrastre(tabla) {
        var divBarra = document.getElementById("divBT" + tabla);
        var divPopupWindow = document.getElementById("divPW" + tabla);
        var divPopupContainer = document.getElementById("divPCT" + tabla);
        if (!divBarra || !divPopupWindow || !divPopupContainer) return;
        divBarra.draggable = true;
        divBarra.ondragstart = function (event) {
            var ancho = getComputedStyle(divPopupWindow, null).getPropertyValue("left");
            var alto = getComputedStyle(divPopupWindow, null).getPropertyValue("top");
            var a = Math.floor(ancho.replace("px", ""));
            var b = Math.floor(alto.replace("px", ""));
            var x = (event.clientX > a ? event.clientX - a : a - event.clientX);
            var y = (event.clientY > b ? event.clientY - b : b - event.clientY);
            var punto = x + "," + y;
            event.dataTransfer.setData("text", punto);
        }
        divBarra.ondragover = function (event) {
            event.preventDefault();
        }
        divPopupContainer.ondragover = function (event) {
            event.preventDefault();
        }
        divPopupContainer.ondrop = function (event) {
            event.preventDefault();
            var x1 = event.clientX;
            var y1 = event.clientY;
            var puntoInicial = event.dataTransfer.getData("text");
            var punto = puntoInicial.split(",");
            var x2 = punto[0] * 1;
            var y2 = punto[1] * 1;
            var divPopupWindow = document.getElementById("divPW" + tabla);
            divPopupWindow.style.left = (x1 - x2) + "px";
            divPopupWindow.style.top = (y1 - y2) + "px";
        }
    }

    function configurarEventos(controlador, tabla){
        var controlTextArea = document.querySelectorAll("textarea.S" + tabla);
        if(controlTextArea != null){
            var nControlTextArea = controlTextArea.length;
            for (var j = 0; j < nControlTextArea; j++) {
                controlTextArea[j].oninput = function () {
                    var maxLength = parseInt(this.getAttribute('maxlength'));
                    var actual = this.value.length;
                    var restante = maxLength - actual;
                    var contadorId = 'contadorInline-' + this.id;
                    var contadorElem = document.getElementById(contadorId);
                    if (contadorElem) {
                        contadorElem.textContent = actual + '/' + maxLength;
                        if (restante < 50) {
                            contadorElem.classList.add('limite');
                        } else {
                            contadorElem.classList.remove('limite');
                        }
                    }
                    if (actual > maxLength) {
                        this.value = this.value.substring(0, maxLength);
                    }
                };
            }
        }

        var btnTabs = document.getElementsByClassName("tab-btn");
        if(btnTabs != null){
            var nBtnTabs = btnTabs.length;
            for (var j = 0; j < nBtnTabs; j++) {
                btnTabs[j].onclick = function () {
                    Ventana.activarTab(this);
                }
            }
        }
        
        var btnAgregar = document.getElementsByClassName("btnTab");
        var nBtnAgregar = btnAgregar.length;
        var btnId = "";
        if (btnAgregar) {
            for (var i = 0; i < nBtnAgregar; i++) {
                btnAgregar[i].onclick = function () {
                    btnId = this.id.slice(-3);
                    var grillaActual = grillaPopup[btnId];
                    if (Validacion.validarDatos(btnId)) {
                        var datos = Ventana.obtenerDatos(btnId);
                        var codigoAccion = document.getElementsByClassName("CAP");
                        if (codigoAccion) {
                            if (codigoAccion[0].value != "I") {
                                var validacion = grillaActual.validarCamposUnicos(datos);
                                if (validacion !== '00') {
                                    Mensaje.mostrarMensaje('A', validacion);
                                    return;
                                }
                                datos = btnId + "¬I|" + datos + "|" + sessionStorage.getItem("datosUsuario").toString().split('|')[0];
                            }
                            if (codigoAccion[0].value === "I") {
                                var rpta = grillaActual.agregarFilaLocal(datos);
                                if (rpta != '00') Mensaje.mostrarMensaje('A', rpta);
                                else {
                                    Mensaje.mostrarMensaje('C', 'Registro agregado correctamente');
                                    Ventana.limpiarDatos(btnId);
                                }
                            }
                            else {
                                var frm = new FormData();
                                frm.append("data", datos);
                                Http.postBytes(controlador + "/Gestionar", function (btnId) {
                                    mostrarGrillaPopup(btnId, grillaActual);
                                }, frm);
                            }
                        }
                    }
                }
            }
        }

        var fechas = document.querySelectorAll('input[type="date"].fecha-calendario');
        if(fechas != null){
            var soportaShowPicker = (typeof HTMLInputElement !== "undefined" && typeof HTMLInputElement.prototype.showPicker === "function");
            fechas.forEach(function(input) {
                if (!soportaShowPicker) return;
                input.addEventListener('keydown', function(e) {
                    e.preventDefault();
                    return false;
                });
                input.addEventListener('click', function(e) {
                    this.showPicker();
                    e.preventDefault();
                });
                input.addEventListener('focus', function(e) {
                    this.blur();
                });
                var wrapper = input.parentNode;
                if (wrapper && wrapper.classList.contains('date-input-wrapper')) {
                    wrapper.addEventListener('click', function(e) {
                        if (e.target === input) return;
                        input.showPicker();
                    });
                }
            });
        }
    }

    function obtenerDatosPosicional(tabla) {
        var data = "", datoCampo="";
        var controles = document.getElementsByClassName("G" + tabla);
        var nControles = controles.length;
        var datoTiempo = [];
        for (var j = 0; j < nControles; j++) {
            if (controles[j].type === 'time') {
                datoTiempo = datoCampo.split(":");
                datoCampo = (datoTiempo[0] * 60) + (datoTiempo[1] * 1);
            }
            else {
                datoCampo = controles[j].value;
                if (datoCampo === "") {
                    datoCampo = controles[j].getAttribute("data-default");
                    if (datoCampo === null) datoCampo = "";
                }
            }
            data += datoCampo;
            if (j === 0) {
                //if (tabla.indexOf('C') > -1) data += "|";
                if (data.indexOf('~') > -1) continue;
                else data += "|";
            }
            else if (j < (nControles - 1)) data += "|";
        }
        return data;
    }

    function limpiarDatosPosicional(tabla) {
        var controles = document.getElementsByClassName("S" + tabla);
        if(controles){
            var nControles = controles.length;
            var img, fup, dataDefault;
            var nOpciones, opcionSeleccionadoPorDefecto = false;
            for (var j = 0; j < nControles; j++) {
                controles[j].classList.remove("form-control-error");
                controles[j].value = "";
                if (controles[j].getAttribute("data-img") != null) {
                    img = document.getElementById(controles[j].getAttribute("data-img"));
                    if (img != null) img.src = "";
                    fup = document.getElementById(controles[j].getAttribute("data-fup"));
                    if (fup != null) fup.value = null;
                }
                if (controles[j].getAttribute("data-default") != null){
                    dataDefault = controles[j].getAttribute("data-default");
                    if(!dataDefault.includes("/")) controles[j].value = dataDefault;
                }
            }
        }
        var controlGrillaPopup = document.getElementsByClassName("gPopup");
        if (controlGrillaPopup) {
            var nControlGrillaPopup = controlGrillaPopup.length;
            var idPopup, tablaPopup;
            var esLlamadaDeTab = false;
            for (var i = 0; i < nControlGrillaPopup; i++) {
                idPopup = controlGrillaPopup[i].id;
                tablaPopup = idPopup.substr(4, 3);
                if (tabla === tablaPopup) { esLlamadaDeTab = true; break; }
            }
            for (var i = 0; i < nControlGrillaPopup; i++) {
                idPopup = controlGrillaPopup[i].id;
                tablaPopup = idPopup.substr(4, 3);
                if (esLlamadaDeTab || grillaPopup[tablaPopup].conSeleccionMultiple) {
                    grillaPopup[tablaPopup].LimpiarChekIds(tablaPopup);
                }
                else {
                    grillaPopup[tablaPopup].limpiarGrillaLocal();
                }
            }
        }
        var spnValida = document.getElementById("spnValida" + tabla);
        if (spnValida) {
            spnValida.innerHTML = "";
            spnValida.style.display = "none";
            spnValida.classList.remove("show");
        }
    }

        var controles = document.getElementsByClassName(accion + tabla);

        for (var j = 0; j < nControles; j++) {
            if (controles[j].type === 'text' || controles[j].type === 'textarea' || controles[j].type === 'number' || controles[j].type === 'select-one' || controles[j].type === 'time' || controles[j].type === 'date') controles[j].disabled = estado;

                if (estado) controles[j].classList.add('hide');

                    if (controles[j].options[i].value === datosPadre[j]) controles[j].value = controles[j].options[i].value;
