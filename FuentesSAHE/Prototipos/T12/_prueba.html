<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>T12 dinamico</title>
<style>
@charset "utf-8";
/* ============================================================================
   SAHE - Sistema Administrativo de Horas Extra
   Sistema.css  -  pantallas de mantenimiento construidas por Ventana.

   Estas pantallas se cargan DENTRO de #ifrPagina del Escritorio: no llevan
   cabecera ni menú propios, solo el contenido.

   CSS nativo. Compatibilidad Chrome 49: sin CSS Grid, sin gap en flexbox,
   sin clamp(), sin inset, sin :focus-visible, sin :focus-within,
   sin position:sticky. Los anchos de columna van en porcentaje sobre flexbox.

   Paleta (la misma de Escritorio.css)
     Rojo institucional ......... #C8102E
     Rojo oscuro (foco) ......... #7A0E1F
     Rojo al pasar el mouse ..... #A32D2D
     Rojo suave ................. #FCEBEB
     Texto ...................... #221F1F
     Texto secundario ........... #5F5C58
     Texto atenuado ............. #8A8781
     Texto tenue ................ #A9A6A0
     Borde ...................... #EDEAE5
     Borde de control ........... #D5D0C9
     Fondo suave ................ #F7F6F3
     Correcto ................... #1F7A4D
   ========================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
    background: #FFFFFF;
    color: #221F1F;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

.hide { display: none !important; }

/* ================================================================ pantalla */
/* Sin tope de ancho: la pantalla -y con ella la grilla- ocupa todo lo que le
   da el iframe. Un formulario sí se acota más abajo, porque campos de 1600px
   no se leen; una rejilla de 8 columnas, en cambio, agradece cada píxel. */
.pantalla {
    margin: 0;
    padding: 24px 26px 32px;
}

/* Los formularios de la pantalla principal -no los del popup, que tienen su
   propio ancho- se quedan en una medida legible. */
.pantalla__cuerpo > .seccion {
    max-width: 1040px;
}

.pantalla__cabecera {
    padding-bottom: 16px;
    margin-bottom: 22px;
    border-bottom: 2px solid #C8102E;
}
.pantalla__titulo {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.2;
    color: #221F1F;
}
.pantalla__subtitulo {
    margin-top: 4px;
    max-width: 78em;
    font-size: 13.5px;
    color: #5F5C58;
}

/* ================================================================ secciones */
.seccion {
    margin-bottom: 22px;
    padding: 18px 20px 6px;
    border: 1px solid #EDEAE5;
    border-radius: 8px;
    background: #FFFFFF;
}
.seccion__titulo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: #C8102E;
}
.seccion__descripcion {
    margin-top: 3px;
    margin-bottom: 14px;
    max-width: 70em;
    font-size: 13px;
    color: #8A8781;
}

/* Fila de campos. Sin gap: la separación va por padding de cada campo. */
.seccion__campos {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
    margin: 0 -10px;
}

/* ==================================================================== campo */
.campo {
    padding: 0 10px;
    margin-bottom: 16px;
}
/* El ancho lo decide el dato, no la plantilla de la página: un número de dos
   dígitos no necesita el mismo espacio que el nombre de un archivo. */
.campo--corto { width: 25%; }
.campo--medio { width: 33.33%; }
.campo--largo { width: 50%; }
.campo--total { width: 100%; }

.campo__etiqueta {
    display: block;
    margin-bottom: 5px;
    font-size: 12.5px;
    font-weight: 600;
    color: #221F1F;
}
.campo__obligatorio {
    margin-left: 3px;
    color: #C8102E;
    font-weight: 700;
}

.campo__control {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
}

.control {
    width: 100%;
    min-width: 0;
    height: 34px;
    padding: 0 10px;
    border: 1px solid #D5D0C9;
    border-radius: 5px;
    background: #FFFFFF;
    color: #221F1F;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    outline: 0;
    -webkit-transition: border-color .15s ease, box-shadow .15s ease;
    transition: border-color .15s ease, box-shadow .15s ease;
}
/* Chrome 49 no soporta :focus-visible; se usa :focus */
.control:focus {
    border-color: #C8102E;
    -webkit-box-shadow: 0 0 0 3px rgba(200, 16, 46, .13);
    box-shadow: 0 0 0 3px rgba(200, 16, 46, .13);
}
.control[readonly] { background: #F7F6F3; color: #5F5C58; }
.control[disabled] { background: #F1EFEC; color: #A9A6A0; }
/* Un select bloqueado en Chrome 49 se pone gris claro por su cuenta y casi no
   se lee; se le fija el mismo par que a las cajas. */
select.control[disabled] { opacity: 1; -webkit-text-fill-color: #A9A6A0; }
.campo__lupa[disabled] {
    background: #F1EFEC; border-color: #E4E1DC; color: #C3C0BA; cursor: default;
}
.campo__lupa[disabled]:hover { background: #F1EFEC; border-color: #E4E1DC; color: #C3C0BA; }

textarea.control {
    height: auto;
    padding: 8px 10px;
    line-height: 1.5;
    resize: vertical;
}
input[type="number"].control { text-align: right; }
select.control { height: 34px; }
input[type="checkbox"].control {
    width: 16px;
    height: 16px;
    padding: 0;
    -webkit-box-flex: 0;
    -ms-flex: 0 0 auto;
    flex: 0 0 auto;
}

/* La unidad al lado del control: el número deja de estar suelto. */
.campo__unidad {
    -ms-flex-negative: 0;
    flex-shrink: 0;
    margin-left: 8px;
    font-size: 12.5px;
    color: #8A8781;
    white-space: nowrap;
}

.campo__ayuda {
    margin-top: 4px;
    font-size: 11.5px;
    color: #8A8781;
}

.campo__error {
    margin-top: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: #B3261E;
}
.campo--error .control { border-color: #B3261E; }
.campo--error .control:focus {
    -webkit-box-shadow: 0 0 0 3px rgba(179, 38, 30, .12);
    box-shadow: 0 0 0 3px rgba(179, 38, 30, .12);
}

/* ================================================================== archivo */
.campo__archivo {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    width: 100%;
    min-width: 0;
}
.campo__archivo .control { border-radius: 5px 0 0 5px; }
.campo__archivo .boton {
    -ms-flex-negative: 0;
    flex-shrink: 0;
    height: 34px;
    margin-left: -1px;
    border-radius: 0 5px 5px 0;
}
/* El input real se oculta; lo dispara el botón Examinar. */
.campo__archivo-real { display: none; }

/* =================================================================== botones */
.boton {
    display: -webkit-inline-box;
    display: -ms-inline-flexbox;
    display: inline-flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    height: 36px;
    padding: 0 18px;
    border: 1px solid #C8102E;
    border-radius: 6px;
    background: #C8102E;
    color: #FFFFFF;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    -webkit-transition: background-color .15s ease;
    transition: background-color .15s ease;
}
.boton:hover { background: #A32D2D; border-color: #A32D2D; }
.boton:focus { outline: 2px solid #7A0E1F; outline-offset: 2px; }
.boton--secundario {
    background: #FFFFFF;
    color: #5F5C58;
    border-color: #D5D0C9;
}
.boton--secundario:hover {
    background: #F7F6F3;
    color: #C8102E;
    border-color: #D5D0C9;
}

/* ================================================================= acciones */
.pantalla__acciones {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -ms-flex-pack: justify;
    justify-content: space-between;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
    padding-top: 16px;
    border-top: 1px solid #EDEAE5;
}
.pantalla__botones {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -ms-flex-wrap: wrap;
    flex-wrap: wrap;
}
.pantalla__botones .boton { margin-left: 10px; }
.pantalla__botones .boton:first-child { margin-left: 0; }

.MensajeError {
    -webkit-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    min-width: 0;
    margin-right: 16px;
    font-size: 13px;
    font-weight: 600;
    color: #B3261E;
}

.pantalla__cambios {
    display: none;
    font-size: 12px;
    color: #8A8781;
}
.pantalla__cambios.visible { display: inline; }

/* ========================================= ventana de mantenimiento (popup) */
/* La arma Ventana a partir de la línea 'popup' de la plantilla. Mismo velo y
   misma caja que el diálogo de mensajes, para que se vean de la misma familia. */
.velo {
    display: none;
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background: rgba(20, 18, 18, .5); z-index: 1000;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
}
.velo.abierto { display: -webkit-box; display: -ms-flexbox; display: flex; }

.ventana {
    width: 100%; max-width: 640px; max-height: 92%; margin: 0 16px;
    background: #FFFFFF; border-radius: 8px; overflow: auto;
    -webkit-box-shadow: 0 18px 44px rgba(0, 0, 0, .3);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .3);
}
.ventana__barra {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: justify; -ms-flex-pack: justify; justify-content: space-between;
    padding: 12px 18px; background: #C8102E; color: #FFFFFF;
}
.ventana__titulo { font-size: 14.5px; font-weight: 700; }
.ventana__cerrar {
    width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .16); color: #FFFFFF;
    font-size: 17px; line-height: 1; cursor: pointer;
}
.ventana__cerrar:hover { background: rgba(255, 255, 255, .3); }
.ventana__cerrar:focus { outline: 2px solid #FFFFFF; outline-offset: 1px; }

.ventana__cuerpo { padding: 18px 18px 4px; }
.ventana__cuerpo .seccion { margin-bottom: 0; padding: 0; border: 0; }

.ventana__pie {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: end; -ms-flex-pack: end; justify-content: flex-end;
    padding: 14px 18px; border-top: 1px solid #EDEAE5; background: #FBFAF9;
}
.ventana__pie .MensajeError {
    -webkit-box-flex: 1; -ms-flex: 1; flex: 1; margin-right: 12px;
}
.ventana__pie .boton { margin-left: 10px; }

/* ====================================================== pantallas angostas */
@media screen and (max-width: 1024px) {
    .campo--corto { width: 33.33%; }
    .campo--medio { width: 50%; }
    .campo--largo { width: 100%; }
}
@media screen and (max-width: 700px) {
    .pantalla { padding: 18px 16px 26px; }
    .seccion { padding: 16px 14px 4px; }
    .campo--corto, .campo--medio, .campo--largo { width: 100%; }
    .pantalla__acciones {
        -webkit-box-orient: vertical;
        -ms-flex-direction: column;
        flex-direction: column;
        -webkit-box-align: stretch;
        -ms-flex-align: stretch;
        align-items: stretch;
    }
    .MensajeError { margin: 0 0 10px 0; }
    .pantalla__botones .boton {
        -webkit-box-flex: 1;
        -ms-flex: 1;
        flex: 1;
    }
}

/* ======================================================= pantalla cargando */
/* Entre que la ventana queda construida y que llegan sus datos. Se apaga un
   poco y no acepta clics, para que nadie pulse Grabar sobre campos vacíos. */
.pantalla--cargando {
    opacity: .55;
    pointer-events: none;
    cursor: progress;
}

/* ==================================================================== lupa */
/* La caja de texto se estira y la lupa queda pegada a su derecha. */
.campo__control--conLupa .control {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
}
.campo__lupa {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
    -webkit-box-flex: 0; -ms-flex: none; flex: none;
    width: 36px; height: 34px; margin-left: -1px;
    border: 1px solid #D5D0C9; border-left-color: #D5D0C9;
    border-radius: 0 5px 5px 0;
    background: #F7F6F3; color: #5F5C58; cursor: pointer;
    -webkit-transition: background-color .15s ease, color .15s ease;
    transition: background-color .15s ease, color .15s ease;
}
.campo__lupa:hover { background: #C8102E; border-color: #C8102E; color: #FFFFFF; }
.campo__lupa:focus {
    outline: 0; border-color: #C8102E;
    -webkit-box-shadow: 0 0 0 2px rgba(200, 16, 46, .13);
    box-shadow: 0 0 0 2px rgba(200, 16, 46, .13);
}
.campo__lupa svg { width: 16px; height: 16px; }

/* ======================================================== ventana de ayuda */
/* La lupa abre esta ventana sobre la de mantenimiento, así que su velo va por
   encima. Chrome 49 no tiene position:sticky ni :focus-within: nada de eso se
   usa aquí. */
#divPantPop .velo { z-index: 1100; }
.ventana--ayuda { max-width: 720px; }
.ventana--ayuda .ventana__cuerpo { padding: 14px 14px 16px; }
.ventana--ayuda .PanelHerramientas { margin-bottom: 8px; }
/* La rejilla de la ayuda no debe empujar la ventana fuera de la pantalla. */
.ventana--ayuda .divGrilla { max-height: 52vh; overflow-y: auto; }

/* ============================================== contador de caracteres */
/* Va debajo del control y encima de la ayuda, alineado a la derecha para que
   no compita con el texto que se está escribiendo. */
.campo__contador {
    margin-top: 3px;
    text-align: right;
    font-size: 12px;
    color: #8A8781;
    -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
}
.campo__contador-usado { font-weight: 700; color: #5F5C58; }
.campo__contador--al-limite { color: #B3261E; }
.campo__contador--al-limite .campo__contador-usado { color: #B3261E; }

/* ============================================ detalle dentro de la ventana */
/* La barra que encabeza la grilla editable del popup. */
.detalle__barra {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    padding-top: 14px; margin-top: 6px; margin-bottom: 10px;
    border-top: 1px solid #EDEAE5;
}
.detalle__titulo { -webkit-box-flex: 1; -ms-flex: 1; flex: 1; font-size: 14.5px; font-weight: 700; }
.detalle__cuenta { font-size: 13px; color: #5F5C58; }
.gDetalle { margin-bottom: 4px; }

@charset "utf-8";
/* ============================================================================
   SAHE - Sistema Administrativo de Horas Extra
   Grilla.css  -  estilos de la rejilla que arma GUI.Grilla (General.js).

   El módulo genera su propio marcado; aquí solo se le da forma. Clases que
   emite y que este archivo atiende:
       divGrilla, cssGridView, FilaCabecera, EnlaceCabecera,
       PanelHerramientas, cssRegistros, contenedor-botones,
       boton-herramienta (+ boton-limpiar, boton-nuevo, boton-excel,
       boton-eliminar-multiple, boton-txt),
       boton-accion (+ boton-editar, boton-eliminar, boton-ver),
       col-marca (columna de selección múltiple),
       col-width-N, col-hidden, Centro, Derecha, Pagina.

   CSS nativo. Compatibilidad Chrome 49: sin Grid, sin gap en flexbox,
   sin :focus-visible, sin position:sticky.

   Paleta: la misma de Sistema.css y Escritorio.css.
   ========================================================================== */

/* ============================================================ herramientas */
.PanelHerramientas {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -ms-flex-wrap: wrap; flex-wrap: wrap;
    margin-bottom: 10px;
}
.cssRegistros {
    -webkit-box-flex: 1; -ms-flex: 1; flex: 1;
    font-size: 13px; color: #5F5C58;
}
.cssRegistros span { font-weight: 700; color: #221F1F; }

.contenedor-botones {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
}

/* Los botones de herramienta son iconos: el title da el nombre y el color
   distingue la acción destructiva de las demás. */
.boton-herramienta {
    display: -webkit-inline-box; display: -ms-inline-flexbox; display: inline-flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
    width: 34px; height: 34px; margin-left: 8px;
    border: 1px solid #D5D0C9; border-radius: 6px;
    background: #FFFFFF; color: #5F5C58; cursor: pointer;
    -webkit-transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.boton-herramienta:hover { background: #F7F6F3; color: #C8102E; }
.boton-herramienta svg { width: 17px; height: 17px; }
.boton-nuevo { background: #C8102E; border-color: #C8102E; color: #FFFFFF; }
.boton-nuevo:hover { background: #A32D2D; border-color: #A32D2D; color: #FFFFFF; }
.boton-eliminar-multiple:hover,
.boton-eliminarMultiple:hover { background: #FCEBEB; color: #B3261E; border-color: #E7C9C9; }
.boton-excel svg, .boton-txt svg { width: 19px; height: 19px; }

/* ================================================================= rejilla */
.divGrilla {
    border: 1px solid #EDEAE5; border-radius: 8px; background: #FFFFFF;
    overflow-x: auto;
}
table.cssGridView {
    width: 100%; border-collapse: collapse;
    font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; color: #221F1F;
}
table.cssGridView th, table.cssGridView td { text-align: left; padding: 9px 12px; }

/* Cabecera: dos filas, la de títulos y la de filtros. Se distinguen entre sí
   para que la segunda se lea como filtros y no como otra cabecera. */
table.cssGridView thead tr:first-child th {
    background: #C8102E; color: #FFFFFF;
    font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    white-space: nowrap; border-right: 1px solid #A32D2D; vertical-align: middle;
}
table.cssGridView thead tr:first-child th:last-child { border-right: 0; }
.EnlaceCabecera { cursor: pointer; -webkit-user-select: none; user-select: none; }
.EnlaceCabecera:hover { text-decoration: underline; }

table.cssGridView thead tr.FilaCabecera + tr th,
table.cssGridView thead tr:nth-child(2) th {
    padding: 6px 8px; background: #F7F6F3;
    border-right: 1px solid #EDEAE5; border-bottom: 1px solid #EDEAE5;
}
table.cssGridView thead input[type="text"],
table.cssGridView thead select {
    width: 100%; height: 28px; padding: 0 8px;
    border: 1px solid #D5D0C9; border-radius: 4px; background: #FFFFFF;
    font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; color: #221F1F; outline: 0;
}
table.cssGridView thead input[type="text"]:focus,
table.cssGridView thead select:focus {
    border-color: #C8102E;
    -webkit-box-shadow: 0 0 0 2px rgba(200, 16, 46, .13);
    box-shadow: 0 0 0 2px rgba(200, 16, 46, .13);
}

table.cssGridView tbody td { border-bottom: 1px solid #EDEAE5; }
table.cssGridView tbody tr:last-child td { border-bottom: 0; }
table.cssGridView tbody tr:nth-child(even) td { background: #FBFAF9; }
table.cssGridView tbody tr:hover td { background: #FCEBEB; }
table.cssGridView tbody tr.seleccionada td { background: #FCEBEB; }

/* Alineación por tipo de dato: la pone Grilla según lo que declara el txt.
   Van calificadas con 'table.cssGridView' A PROPÓSITO: la regla de arriba
   -'table.cssGridView th, table.cssGridView td'- tiene más especificidad que
   una clase suelta, así que '.Derecha' a secas quedaba pisada por el
   text-align:left y los importes se veían a la izquierda. */
table.cssGridView th.Izquierda, table.cssGridView td.Izquierda { text-align: left; }
table.cssGridView th.Centro, table.cssGridView td.Centro { text-align: center; }
table.cssGridView th.Derecha, table.cssGridView td.Derecha {
    text-align: right;
    -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
}

/* Se conservan sueltas para el formato heredado, que las usa fuera de la
   rejilla. */
.Izquierda { text-align: left; }
.Centro { text-align: center; }
.Derecha { text-align: right; }
.col-hidden { display: none; }

/* La columna de acciones no se comprime ni parte los iconos en dos líneas. */
.col-acciones { width: 104px; white-space: nowrap; }

/* Anchos de respaldo. El ancho real lo pone Grilla como estilo en línea a
   partir del número del txt; estas clases quedan para el formato heredado. */
.col-width-5   { width: 90px; }
.col-width-8   { width: 110px; }

/* Un botón con el resumen y un panel de casillas. No se usa <select multiple>
   porque en una fila de filtros ocupa varias líneas y tapa la rejilla. */
.filtro-multiple { position: relative; }
.filtro-multiple__boton {
    width: 100%; height: 28px; padding: 0 8px; text-align: left;
    border: 1px solid #D5D0C9; border-radius: 4px; background: #FFFFFF;
    font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; color: #221F1F;
    cursor: pointer;
}
.filtro-multiple__boton:hover { border-color: #C8102E; }
.filtro-multiple__boton:focus {
    border-color: #C8102E; outline: 0;
    -webkit-box-shadow: 0 0 0 2px rgba(200, 16, 46, .13);
    box-shadow: 0 0 0 2px rgba(200, 16, 46, .13);
}
.filtro-multiple__panel {
    display: none;
    position: absolute; left: 0; top: 30px; z-index: 20;
    min-width: 100%; max-height: 210px; overflow-y: auto;
    padding: 6px; border: 1px solid #D5D0C9; border-radius: 5px; background: #FFFFFF;
    -webkit-box-shadow: 0 6px 16px rgba(0, 0, 0, .16);
    box-shadow: 0 6px 16px rgba(0, 0, 0, .16);
}
.filtro-multiple__panel.abierto { display: block; }
.filtro-multiple__opcion {
    display: block; padding: 4px 6px; border-radius: 4px;
    font-size: 12.5px; font-weight: 400; color: #221F1F;
    white-space: nowrap; cursor: pointer;
}
.filtro-multiple__opcion:hover { background: #F7F6F3; }

table.cssGridView td .boton-accion {

table.cssGridView td.Centro .boton-accion { margin: 0 2px; }

/* ============================================================== paginación */
table.cssGridView tfoot td {
    padding: 12px; text-align: center; background: #FBFAF9; border-top: 1px solid #EDEAE5;

/* ============================================== rejilla de elección (ayuda) */
/* Cuando la fila se elige con doble clic, el cursor tiene que decirlo: sin

   barra horizontal del .divGrilla, que es preferible a una tabla deformada.
   No aplica a la ayuda, que tiene dos columnas y entra sobrada. */
.gPrincipal table.cssGridView { min-width: 1040px; }

<script>
var Http = (function () {

    var ID_CAPA_CARGA = "divLoading";
    var CLASE_OCULTAR = "hide";

    var enCurso = [];            /* peticiones vivas, para la capa de carga  */
    function Http() { }

    /* ------------------------------------------------------------ registro */

    /* La version anterior llamaba a safeLog(), que no existe en el proyecto:
       cualquier error dentro de configuracion() terminaba en ReferenceError
       y se perdia el error original. Se registra aqui, sin dependencias.    */
    function registrar(mensaje, detalle) {
        if (typeof console === "undefined" || !console) return;
        if (detalle !== undefined && console.error) console.error("[Http] " + mensaje, detalle);
        else if (console.error) console.error("[Http] " + mensaje);

    /* ------------------------------------------------------ capa de carga  */

    /* Buscar la capa en el documento padre puede lanzar SecurityError cuando
       la pagina esta embebida en otro origen. Antes no estaba protegido y
       tumbaba toda la peticion.                                             */
    function capaCarga() {
        var capa = document.getElementById(ID_CAPA_CARGA);
        if (capa) return capa;
        try {
            if (window.parent && window.parent !== window && window.parent.document) {
                return window.parent.document.getElementById(ID_CAPA_CARGA);
            }
        } catch (e) {
            /* otro origen: se trabaja solo con el documento actual */
        }
        return null;
    }

    /* Contador de peticiones: con varias en paralelo, la capa se oculta
       recien cuando termina la ultima, no cuando responde la primera.       */
    function mostrarCarga(xhr) {
        var i = indiceDe(xhr);
        if (i === -1) enCurso.push(xhr);
        var capa = capaCarga();

    Menu.SideNav = function (app) {
        this.btnM = document.getElementById("btnT");
        this.btnO = document.getElementById("btnO");
        this.snv = document.querySelector(".js-sn");
        this.snvc = document.querySelector(".js-snc");
        this.startX = 0;
        this.currentX = 0;
        this.tsn = false;
        this.mSn = function (e) {
            if (this.snv) {
                this.snv.classList.add('side-nav--animatable');
                this.snv.classList.add('side-nav--visible');
                this.snv.addEventListener('transitionend', this.oTed);
            }
        };
        this.oSn = function () {
            if (this.snv) {
                this.snv.classList.add('side-nav--animatable');
                this.snv.classList.remove('side-nav--visible');
                this.snv.addEventListener('transitionend', this.oTed);
            }
        };
        this.oTed = function (e) {
            if (this.snv) {
                this.snv.classList.remove('side-nav--animatable');
                this.snv.removeEventListener('transitionend', this.oTed);
            }
        };
        this.bCs = function (e) {
            e.stopPropagation();
            e.preventDefault();
            var li = e.target;
            if (li && li.nodeName == "SPAN") {
                var url = li.onclick;
                if (url) {
                    this.btnO.click();
                }
            }
        };
        this.evlr = function () {
            if (this.btnM) this.btnM.addEventListener('click', this.mSn);
            if (this.btnO) this.btnO.addEventListener('click', this.oSn);
            if (this.snv) this.snv.addEventListener('click', this.oSn);
            if (this.snvc) this.snvc.addEventListener('click', this.bCs);

            if (this.snv) {
                this.snv.addEventListener('touchstart', this.oTs);
                this.snv.addEventListener('touchmove', this.oTm);
                this.snv.addEventListener('touchend', this.oTe);
            }
        };
        this.oTs = function (e) {
            if (!this.snv || !this.snv.classList.contains('side-nav--visible')) return;
            this.startX = e.touches[0].pageX;
            this.currentX = this.startX;
            this.tsn = true;
            requestAnimationFrame(this.uPd);
        };
        this.oTm = function (e) {
            if (!this.tsn) return;
            this.currentX = e.touches[0].pageX;
        };
        this.oTe = function () {
            if (!this.tsn) return;
            this.tsn = false;
            var translateX = Math.min(0, this.currentX - this.startX);
            if (this.snvc) this.snvc.style.transform = '';
            if (translateX < 0) {
                this.oSn();
            }
        };
        this.uPd = function () {
            if (!this.tsn) return;
            requestAnimationFrame(this.uPd);
            var translateX = Math.min(0, this.currentX - this.startX);
            if (this.snvc) this.snvc.style.transform = "translateX(" + translateX + "px)";
        };
        this.mSn = this.mSn.bind(this);
        this.oSn = this.oSn.bind(this);
        this.oTed = this.oTed.bind(this);
        this.bCs = this.bCs.bind(this);
        this.oTs = this.oTs.bind(this);
        this.oTm = this.oTm.bind(this);
        this.oTe = this.oTe.bind(this);
        this.uPd = this.uPd.bind(this);
        this.evlr();
    }

        this.obtenerDatosMatriz = function() {
            this.matriz = [];
            this.listaDatosLlaves = [];
            this.listaDatosUniques = [];
            this.listaDatosGrabarCampos = [];
            this.nRegistros = this.listaDatosGrilla.length;
            if (indicesSubTotalesGrilla.length > 0) {
                this.totales = [];
                for (var j = 0; j < nIndicesSubTotalesGrilla; j++) {
                    totales.push(0);
                }
            }
            if (this.nRegistros > 0 && this.listaDatosGrilla[0] != "") {
                var campos = [];
                var valores = [];
                if (conFiltros) {
                    var controlFiltros = document.getElementsByClassName("Cabecera" + id);
                    var nControlFiltros = controlFiltros.length;
                    var indiceCombo, tipoCombo;
                    for (var j = 0; j < nControlFiltros; j++) {
                        if (controlFiltros[j].className.indexOf("Texto") > -1) valores.push(controlFiltros[j].value.toLowerCase());
                        else {
                            if (controlFiltros[j].className.indexOf("Combo") > -1) {
                                indiceCombo = controlFiltros[j].getAttribute("data-cboind") * 1;
                                tipoCombo = controlFiltros[j].getAttribute("data-cbotipo");
                                if (tipoCombo === 'cm') {
                                    valores.push(obtenerChecksLista("chk" + indiceCombo));
                                }
                                else valores.push(controlFiltros[j].options[controlFiltros[j].selectedIndex].text);
                            }
                        }
                    }
                    var exito = false;
                    for (var i = 0; i < this.nRegistros; i++) {
                        campos = this.listaDatosGrilla[i].split("|");
                        for (var j = 0; j < nCampos; j++) {
                            if (controlFiltros[j].className.indexOf("Texto") > -1) exito = (valores[j] === "" || valores[j] === "todos" || campos[j].toLowerCase().indexOf(valores[j]) > -1);
                            else {
                                if (controlFiltros[j].className.indexOf("Combo") > -1) {
                                    indiceCombo = controlFiltros[j].getAttribute("data-cboind");
                                    tipoCombo = controlFiltros[j].getAttribute("data-cbotipo");
                                    if (tipoCombo === 'cm') {
                                        exito = (valores[j].indexOf(campos[j]) > -1);
                                    }
                                    else exito = (valores[j] == "Todos" || campos[j] == valores[j]);
                                }
                            }
                            if (!exito) break;
                        }
                        if (exito) {
                            this.crearMatriz(campos);
                        }
                    }
                }
                else {
                    for (var i = 0; i < this.nRegistros; i++) {
                        campos = this.listaDatosGrilla[i].split("|");
                        this.crearMatriz(campos);
                    }
                }
            }
        }

        this.crearMatriz = function(dato) {
            var fila = [];
            var esNumero = false;
            var esFecha = false;
            var fecha = [];
            var time = [];
            var nDato, dfecha, nDfecha, dia, mes, anio, hora, minuto, segundo;;
            var datoLlave, datoUnique, datoCamposGrabar;
            var ccs = 0;
            var valor;
            for (var j = 0; j < nCampos; j++) {
                esNumero = (tipos[j].indexOf("Int") > -1 || tipos[j].indexOf("Decimal") > -1);
                esFecha = (tipos[j].indexOf("Date") > -1);
                if (esNumero) {
                    fila.push(dato[j] * 1);
                }
                else if (esFecha) {
                    nDato = dato[j].length;
                    if (nDato === 10) {
                        fila.push(Fecha.convertirDate(dato[j]));
                    }
                    else {
                        fila.push(Fecha.convertirDateTime(dato[j]));
                    }
                }
                else {
                    fila.push(dato[j]);
                }
                if (nIndicesSubTotalesGrilla > 0 && indicesSubTotalesGrilla.indexOf(j) > -1) {
                    valor = fila[j];
                    totales[ccs] += valor;
                    ccs++;
                }
            }
            this.matriz.push(fila);
            if (this.nIndicesLlavesGrilla > 0) {
                datoLlave = "";
                for (var j = 0; j < this.nIndicesLlavesGrilla; j++) {
                    datoLlave += dato[this.indicesLlavesGrilla[j] * 1];
                    if (j < this.nIndicesLlavesGrilla - 1) datoLlave += '|';
                }
                this.listaDatosLlaves.push(datoLlave);
            }
            if (this.nIndicesUniqueGrilla > 0) {
                datoUnique = "";
                for (var j = 0; j < this.nIndicesUniqueGrilla; j++) {
                    datoUnique += dato[this.indicesUniqueGrilla[j] * 1];
                    if (j < this.nIndicesUniqueGrilla - 1) datoUnique += '|';
                }
                this.listaDatosUniques.push(datoUnique);
            }
            if (this.nIndicesGrabarCamposGrilla > 0) {
                datoCamposGrabar = "";
                for (var j = 0; j < this.nIndicesGrabarCamposGrilla; j++) {
                    datoCamposGrabar += dato[this.indicesGrabarCamposGrilla[j] * 1];
                    if (j < this.nIndicesGrabarCamposGrilla - 1) datoCamposGrabar += '|';
                }
                this.listaDatosGrabarCampos.push(datoCamposGrabar);
            }
        }

        this.ordenarColumna = function (label) {
            var simbolo = label.innerHTML;
            var textoCabecera = label.getAttribute("data-texto");
            var orden = label.getAttribute("data-orden") * 1;
            colOrden = orden * 1;
            var buscarSimbolo = simbolo.indexOf("▲");

            borrarSimbolosOrdenacion();

            if (buscarSimbolo === -1) {
                tipoOrden = 0;
                label.innerHTML = textoCabecera + " ▲";
                this.matriz.sort(ordenarMatriz);
            }
            else {
                tipoOrden = 0;
                label.innerHTML = textoCabecera + " ▼";
                this.matriz.sort(ordenarMatriz);
                this.matriz.reverse();
                tipoOrden = 1;
            }

            this.listaDatosLlaves = [];
            this.listaDatosUniques = [];
            this.listaDatosGrabarCampos = [];

            for (var i = 0; i < this.matriz.length; i++) {
                var llave = "", unique = "", grabar = "";

                for (var j = 0; j < this.nIndicesLlavesGrilla; j++) {
                    llave += this.matriz[i][this.indicesLlavesGrilla[j]];
                    if (j < this.nIndicesLlavesGrilla - 1) llave += "|";
                }
                this.listaDatosLlaves.push(llave);

                for (var j = 0; j < this.nIndicesUniqueGrilla; j++) {
                    unique += this.matriz[i][this.indicesUniqueGrilla[j]];
                    if (j < this.nIndicesUniqueGrilla - 1) unique += "|";
                }
                this.listaDatosUniques.push(unique);

                for (var j = 0; j < this.nIndicesGrabarCamposGrilla; j++) {
                    grabar += this.matriz[i][this.indicesGrabarCamposGrilla[j]];
                    if (j < this.nIndicesGrabarCamposGrilla - 1) grabar += "|";
                }
                this.listaDatosGrabarCampos.push(grabar);
            }

            this.mostrarMatriz();
        }

        function borrarSimbolosOrdenacion() {
            var enlaces = document.getElementsByClassName("EnlaceCabecera " + id);
            var nEnlaces = enlaces.length;
            for (var j = 0; j < nEnlaces; j++) {
                enlaces[j].innerHTML = enlaces[j].getAttribute("data-texto");
            }
        }

        function ordenarMatriz(x, y) {
            var rpta = 0;
            var idX = x[colOrden];
            var idY = y[colOrden];
            if (tipoOrden == 0) rpta = (idX > idY ? 1 : -1);
            else rpta = (idX < idY ? 1 : -1);
            return rpta;
        }

        this.crearPaginacion = function() {
            var htmlPaginacion = "";
            var nRegistros = this.matriz.length;
            var tdPagina = document.getElementById("tdPagina" + id);
            if (nRegistros > 0) {
                var totalPaginas = Math.floor(nRegistros / registrosPorPagina);
                if (nRegistros % registrosPorPagina > 0) totalPaginas++;
                if (totalPaginas > 1) {
                    if (totalPaginas > 1) {
                        var registrosBloque = registrosPorPagina * paginasPorBloque;
                        var totalBloques = Math.floor(nRegistros / registrosBloque);
                        if (nRegistros % registrosBloque > 0) totalBloques++;
                        if (this.indiceBloque > 0) {
                            htmlPaginacion += "<input type='button' class='Pagina ";
                            htmlPaginacion += id;
                            htmlPaginacion += " Pagina' value='<<' dato-indicePagina='-1'/>";
                            htmlPaginacion += "<input type='button' class='Pagina ";
                            htmlPaginacion += id;
                            htmlPaginacion += " Pagina' value='<' dato-indicePagina='-2'/>";
                        }
                        var inicio = this.indiceBloque * paginasPorBloque;
                        var fin = inicio + paginasPorBloque;
                        for (var j = inicio; j < fin; j++) {
                            if (j < totalPaginas) {
                                htmlPaginacion += "<input type='button' class='Pagina ";
                                htmlPaginacion += id;
                                htmlPaginacion += " ";
                                if (this.indicePagina == j) htmlPaginacion += "PaginaSeleccionada";
                                else htmlPaginacion += "Pagina";
                                htmlPaginacion += "' value='";
                                htmlPaginacion += (j + 1);
                                htmlPaginacion += "' dato-indicePagina='";
                                htmlPaginacion += j;
                                htmlPaginacion += "'/>";
                            }
                            else break;
                        }
                        if (this.indiceBloque < (totalBloques - 1)) {
                            htmlPaginacion += "<input type='button' class='Pagina ";
                            htmlPaginacion += id;
                            htmlPaginacion += " Pagina' value='>' dato-indicePagina='-3'/>";
                            htmlPaginacion += "<input type='button' class='Pagina ";
                            htmlPaginacion += id;
                            htmlPaginacion += " Pagina' value='>>' dato-indicePagina='-4'/>";
                        }
                        htmlPaginacion += "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
                        htmlPaginacion += "<select id='cboPagina";
                        htmlPaginacion += id;
                        htmlPaginacion += "'>";
                        for (var j = 0; j < totalPaginas; j++) {
                            htmlPaginacion += "<option value='";
                            htmlPaginacion += j;
                            htmlPaginacion += "'";
                            if (this.indicePagina == j) htmlPaginacion += " selected";
                            htmlPaginacion += ">";
                            htmlPaginacion += (j + 1);
                            htmlPaginacion += "</option>";
                        }
                        htmlPaginacion += "</select>";
                    }
                }
            }
            if (tdPagina != null) {
                tdPagina.innerHTML = htmlPaginacion;
            }
        }

        this.seleccionarCheckTodo = function (checkCabecera, checks, nChecks) {
            var seleccion = checkCabecera.checked;
            for (var i = 0; i < nChecks; i++) {
                checks[i].checked = seleccion;
            }
            this.idSeleccionados = [];
            if (seleccion) {

                    this.idSeleccionados.push(this.listaDatosLlaves[i]);
                }
            }
        }

        this.seleccionarCheck = function(check, id) {
            var posicion = this.idSeleccionados.indexOf(id);
            var cantidadTotal = this.idSeleccionados.length;
            if (check.checked) {
                if (cantidadTotal === 0 || (cantidadTotal > 0 && posicion === -1)) {
                    this.idSeleccionados.push(id);
                }
            }
            else {
                if (cantidadTotal > 0 && posicion > -1) {
                    this.idSeleccionados.splice(posicion, 1);
                }
            }
        }

        this.paginar = function(indice) {
            if (indice > -1) {
                this.indicePagina = indice;
                this.indiceBloque = Math.floor(this.indicePagina / paginasPorBloque);
            }
            else {
                var totalRegistros = this.matriz.length;
                var registrosPorBloque = registrosPorPagina * paginasPorBloque;
                var totalBloques = Math.floor(totalRegistros / registrosPorBloque);
                if (totalRegistros % registrosPorBloque > 0) totalBloques++;
                switch (indice) {
                    case -1:
                        this.indicePagina = 0;
                        this.indiceBloque = 0;
                        break;
                    case -2:
                        this.indiceBloque--;
                        this.indicePagina = this.indiceBloque * paginasPorBloque;
                        break;
                    case -3:
                        this.indiceBloque++;
                        this.indicePagina = this.indiceBloque * paginasPorBloque;
                        break;
                    case -4:
                        this.indiceBloque = (totalBloques - 1);
                        this.indicePagina = this.indiceBloque * paginasPorBloque;
                        break;
                }
            }
            this.mostrarMatriz();
        }

        this.agregarFilaLocal = function (datosFila) {
            if (!datosFila || datosFila.length === 0) return 'No hay datos para agregar';
            var campos = datosFila.split("|");

            var camposVacios = false;
            var valor = "";
            for (var j = 0; j < this.nIndicesUniqueGrilla; j++) {
                valor = campos[this.indicesUniqueGrilla[j] * 1] || "";
                if (valor === "") { camposVacios = true; break; }
            }
            if (camposVacios) return 'Debe completar todos los campos obligatorios antes de agregar.';;

            var datoUnique = "";
            for (var j = 0; j < this.nIndicesUniqueGrilla; j++) {
                datoUnique += campos[this.indicesUniqueGrilla[j] * 1];
                if (j < this.nIndicesUniqueGrilla - 1) datoUnique += '|';
            }
            if (this.listaDatosUniques.indexOf(datoUnique) !== -1) return 'El registro ya existe';
            else {
                this.listaDatosUniques.push(datoUnique);
                var datoGrabar = ""
                for (var j = 0; j < this.nIndicesGrabarCamposGrilla; j++) {
                    datoGrabar += campos[this.indicesGrabarCamposGrilla[j] * 1];
                    if (j < this.nIndicesGrabarCamposGrilla - 1) datoGrabar += '|';
                }
                this.listaDatosGrabarCampos.push(datoGrabar);
            }
            this.matriz.push(campos);
            this.mostrarMatriz();
            return '00';
        }

        this.validarCamposUnicos = function (datosFila) {
            if (!datosFila || datosFila.length === 0) return 'No hay datos para agregar';
            var campos = datosFila.split("|");
            var camposVacios = false;
            var valor = "";
            for (var j = 0; j < this.nIndicesUniqueGrilla; j++) {
                valor = campos[this.indicesUniqueGrilla[j] * 1] || "";
                if (valor === "") { camposVacios = true; break; }
            }
            if (camposVacios) return 'Debe completar todos los campos obligatorios antes de agregar.';
            return '00';
        }

        this.eliminarFilaLocal = function(dato) {
            var indice = this.listaDatosUniques.indexOf(dato);
            this.matriz.splice(indice, 1);
            this.listaDatosUniques.splice(indice, 1);
            this.listaDatosGrabarCampos.splice(indice,1);
            this.mostrarMatriz();
            return '00';
        }
    }

        this.obtenerDatosMatriz = function() {
            this.matriz = [];
            this.listaDatosLlaves = [];
            this.nRegistros = this.listaDatosGrilla.length;
            if (indicesSubTotalesGrilla.length > 0) {
                this.totales = [];
                for (var j = 0; j < nIndicesSubTotalesGrilla; j++) {
                    totales.push(0);
                }
            }
            if (this.nRegistros > 0 && this.listaDatosGrilla[0] != "") {
                var campos = [];
                var valores = [];
                if (conFiltros) {
                    var controlFiltros = document.getElementsByClassName("Cabecera" + id);
                    var nControlFiltros = controlFiltros.length;
                    var indiceCombo, tipoCombo;
                    for (var j = 0; j < nControlFiltros; j++) {
                        if (controlFiltros[j].className.indexOf("Texto") > -1) valores.push(controlFiltros[j].value.toLowerCase());
                        else {
                            if (controlFiltros[j].className.indexOf("Combo") > -1) {
                                indiceCombo = controlFiltros[j].getAttribute("data-cboind") * 1;
                                tipoCombo = controlFiltros[j].getAttribute("data-cbotipo");
                                if (tipoCombo === 'cm') {
                                    valores.push(obtenerChecksLista("chk" + indiceCombo));
                                }
                                else valores.push(controlFiltros[j].options[controlFiltros[j].selectedIndex].text);
                            }
                        }
                    }
                    var exito = false;
                    for (var i = 0; i < this.nRegistros; i++) {
                        campos = this.listaDatosGrilla[i].split("|");
                        for (var j = 0; j < nCampos; j++) {
                            if (controlFiltros[j].className.indexOf("Texto") > -1) exito = (valores[j] === "" || valores[j] === "todos" || campos[j].toLowerCase().indexOf(valores[j]) > -1);
                            else {
                                if (controlFiltros[j].className.indexOf("Combo") > -1) {
                                    indiceCombo = controlFiltros[j].getAttribute("data-cboind");
                                    tipoCombo = controlFiltros[j].getAttribute("data-cbotipo");
                                    if (tipoCombo === 'cm') {
                                        exito = (valores[j].indexOf(campos[j]) > -1);
                                    }
                                    else exito = (valores[j] == "Todos" || campos[j] == valores[j]);
                                }
                            }
                            if (!exito) break;
                        }
                        if (exito) {
                            this.crearMatriz(campos);
                        }
                    }
                }
                else {
                    for (var i = 0; i < this.nRegistros; i++) {
                        campos = this.listaDatosGrilla[i].split("|");
                        this.crearMatriz(campos);
                    }
                }
            }
        }

        this.crearMatriz = function(dato) {
            var fila = [];
            var esNumero = false;
            var esFecha = false;
            var nDato;
            for (var j = 0; j < nCampos; j++) {
                esNumero = (tipos[j].indexOf("Int") > -1 || tipos[j].indexOf("Decimal") > -1);
                esFecha = (tipos[j].indexOf("Date") > -1);
                if (esNumero) {
                    fila.push(dato[j] * 1);
                }
                else if (esFecha) {
                    nDato = dato[j].length;
                    if (nDato === 10) {
                        fila.push(Fecha.convertirDate(dato[j]));
                    }
                    else if(nDato === 0){
                        fila.push("");
                    }
                    else {
                        fila.push(Fecha.convertirDateTime(dato[j]));
                    }
                }
                else {
                    fila.push(dato[j]);
                }
            }
            this.matriz.push(fila);
        }

        this.ordenarColumna = function(label) {
            var simbolo = label.innerHTML;
            var textoCabecera = label.getAttribute("data-texto");
            var orden = label.getAttribute("data-orden") * 1;
            colOrden = orden * 1;
            var buscarSimbolo = simbolo.indexOf("▲");
            borrarSimbolosOrdenacion();
            if (buscarSimbolo === -1) {
                tipoOrden = 0;
                label.innerHTML = textoCabecera + " ▲";
                this.matriz.sort(ordenarMatriz);
            }
            else {
                tipoOrden = 1;
                label.innerHTML = textoCabecera + " ▼";
                this.matriz.reverse();
            }
            this.mostrarMatriz();
        }

        function borrarSimbolosOrdenacion() {
            var enlaces = document.getElementsByClassName("EnlaceCabecera " + id);
            var nEnlaces = enlaces.length;
            for (var j = 0; j < nEnlaces; j++) {
                enlaces[j].innerHTML = enlaces[j].getAttribute("data-texto");
            }
        }

        function ordenarMatriz(x, y) {
            var rpta = 0;
            var idX = x[colOrden];
            var idY = y[colOrden];
            if (tipoOrden == 0) rpta = (idX > idY ? 1 : -1);
            else rpta = (idX < idY ? 1 : -1);
            return rpta;
        }

        this.crearPaginacion = function() {
            var htmlPaginacion = "";
            this.nRegistros = this.matriz.length;
            var tdPagina = document.getElementById("tdPagina" + id);
            if (this.nRegistros > 0) {
                var totalPaginas = Math.floor(this.nRegistros / registrosPorPagina);
                if (this.nRegistros % registrosPorPagina > 0) totalPaginas++;
                if (totalPaginas > 1) {
                    if (totalPaginas > 1) {
                        var registrosBloque = registrosPorPagina * paginasPorBloque;
                        var totalBloques = Math.floor(this.nRegistros / registrosBloque);
                        if (this.nRegistros % registrosBloque > 0) totalBloques++;
                        if (this.indiceBloque > 0) {
                            htmlPaginacion += "<input type='button' class='Pagina ";
                            htmlPaginacion += id;
                            htmlPaginacion += " Pagina' value='<<' dato-indicePagina='-1'/>";
                            htmlPaginacion += "<input type='button' class='Pagina ";
                            htmlPaginacion += id;
                            htmlPaginacion += " Pagina' value='<' dato-indicePagina='-2'/>";
                        }
                        var inicio = this.indiceBloque * paginasPorBloque;
                        var fin = inicio + paginasPorBloque;
                        for (var j = inicio; j < fin; j++) {
                            if (j < totalPaginas) {
                                htmlPaginacion += "<input type='button' class='Pagina ";
                                htmlPaginacion += id;
                                htmlPaginacion += " ";
                                if (this.indicePagina == j) htmlPaginacion += "PaginaSeleccionada";
                                else htmlPaginacion += "Pagina";
                                htmlPaginacion += "' value='";
                                htmlPaginacion += (j + 1);
                                htmlPaginacion += "' dato-indicePagina='";
                                htmlPaginacion += j;
                                htmlPaginacion += "'/>";
                            }
                            else break;
                        }
                        if (this.indiceBloque < (totalBloques - 1)) {
                            htmlPaginacion += "<input type='button' class='Pagina ";
                            htmlPaginacion += id;
                            htmlPaginacion += " Pagina' value='>' dato-indicePagina='-3'/>";
                            htmlPaginacion += "<input type='button' class='Pagina ";
                            htmlPaginacion += id;
                            htmlPaginacion += " Pagina' value='>>' dato-indicePagina='-4'/>";
                        }
                        htmlPaginacion += "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
                        htmlPaginacion += "<select id='cboPagina";
                        htmlPaginacion += id;
                        htmlPaginacion += "'>";
                        for (var j = 0; j < totalPaginas; j++) {
                            htmlPaginacion += "<option value='";
                            htmlPaginacion += j;
                            htmlPaginacion += "'";
                            if (this.indicePagina == j) htmlPaginacion += " selected";
                            htmlPaginacion += ">";
                            htmlPaginacion += (j + 1);
                            htmlPaginacion += "</option>";
                        }
                        htmlPaginacion += "</select>";
                    }
                }
            }
            if (tdPagina != null) {
                tdPagina.innerHTML = htmlPaginacion;
            }

        this.paginar = function(indice) {
            if (indice > -1) {
                this.indicePagina = indice;
                this.indiceBloque = Math.floor(this.indicePagina / paginasPorBloque);
            }
            else {
                var totalRegistros = this.matriz.length;
                var registrosPorBloque = registrosPorPagina * paginasPorBloque;
                var totalBloques = Math.floor(totalRegistros / registrosPorBloque);
                if (totalRegistros % registrosPorBloque > 0) totalBloques++;
                switch (indice) {
                    case -1:
                        this.indicePagina = 0;
                        this.indiceBloque = 0;
                        break;
                    case -2:
                        this.indiceBloque--;

            if (conSeleccion) nueva.appendChild(elemento("td", { "class": "col-marca" }));

            for (j = 0; j < columnas.length; j++) {
                columna = columnas[j];
                esTotal = contieneNumero(totales, j);
                if (columna.oculto) { nueva.appendChild(elemento("td", { "class": "col-hidden" })); continue; }

                if (esTotal) {

                                     formatearNumero(sumaDe(visibles, j), { tipo: "decimal" }));

                    /* El rótulo se pone en la columna anterior a la primera
                       que suma, que es donde el ojo lo busca. */

                    rotulado = true;

            var cuerpo = elemento("tbody");
            var i, j, fila, celda, columna, texto, indice, marca;

            if (enPagina.length === 0) {
                fila = elemento("tr", { "class": "sinDatos" });
                fila.appendChild(elemento("td", { colspan: columnas.length + 2 },
                    filas.length === 0 ? "No hay registros." : "Ningún registro coincide con los filtros."));
                cuerpo.appendChild(fila);

                    fila.appendChild(celda);

            if (columna.lista !== undefined && columna.lista !== "") {
                return describir(valor, listas[Number(columna.lista)]);
